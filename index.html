<style>@font-face{font-family:"DM Serif Display";src:url(fonts/dm.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Source Sans 3";src:url(fonts/sans400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Source Sans 3";src:url(fonts/sans600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:"Source Sans 3";src:url(fonts/sans700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:"Source Serif 4";src:url(fonts/serif400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Source Serif 4";src:url(fonts/serif500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}@font-face{font-family:"Source Serif 4";src:url(fonts/serif600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:"Source Serif 4";src:url(fonts/serif400-i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:"Source Serif 4";src:url(fonts/serif500-i.woff2) format("woff2");font-weight:500;font-style:italic;font-display:swap}/* Estudio DSI: sierra de pinos y oro, tomado de la identidad del Encuentro. Lectura móvil, una columna, barra inferior. */
:root{--bg:#eef2ea;--card:#fbfcf8;--ink:#17302a;--soft:#566b62;--line:#d5ded2;--pine:#12382e;--pine2:#2a5d4e;--gold:#a8741f;--goldbg:#f5ead2;--sage:#dfe8dc;--ok:#2c7a54;--bad:#b23a32;--disp:"DM Serif Display",Georgia,serif;--read:"Source Serif 4",Georgia,serif;--ui:"Source Sans 3",system-ui,sans-serif;--fs:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f1a;--card:#15302a;--ink:#e9efe6;--soft:#a3b8ad;--line:#28483e;--pine:#0a1a16;--pine2:#7fb8a2;--gold:#e0b25c;--goldbg:#33301c;--sage:#1d3c33;--ok:#6fcf9f;--bad:#f08a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1f1a;--card:#15302a;--ink:#e9efe6;--soft:#a3b8ad;--line:#28483e;--pine:#0a1a16;--pine2:#7fb8a2;--gold:#e0b25c;--goldbg:#33301c;--sage:#1d3c33;--ok:#6fcf9f;--bad:#f08a80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--ui)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px}
#app{max-width:640px;margin:0 auto;padding:0 0 92px}
.pad{padding:0 16px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);min-height:54px}
.top h2{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.ic svg,.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.on svg{fill:var(--gold);stroke:var(--gold)}
.hero{position:relative;background:var(--pine);color:#f3efe1;overflow:hidden}
.hero svg.m{display:block;width:100%;height:118px}
.herot{padding:20px 18px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.hero .eyebrow{color:#e3bc72}
.hero h1{font-size:34px;margin-top:4px}
.hero p{margin:6px 0 0;font-size:15.5px;color:#d3dccf;max-width:30ch}
.hero .ic{background:#ffffff1c;color:#fff}
.sec{margin-top:24px}
.sec>h3{font-size:22px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lnk{color:var(--pine2);font-weight:600;font-size:15px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;text-decoration:none}
.stack{display:flex;flex-direction:column;gap:9px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-22px;position:relative;z-index:2}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--disp);font-weight:400;font-size:25px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft)}
.daily{background:var(--goldbg);border-color:transparent}
.daily q{quotes:none;font:500 20px/1.3 var(--read);display:block;margin:5px 0 8px}
.meta{font-size:14px;color:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:99px;font-size:15px;max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pr{background:var(--pine);color:#f3efe1;border-radius:14px;padding:13px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.pr b{font:400 19px/1.15 var(--disp)}
.pr span{font-size:13.5px;color:#c9d5c7;line-height:1.3}
.cap{display:flex;gap:13px;align-items:center}
.num{font:400 33px/1 var(--disp);color:var(--gold);width:38px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.cap h4,.li h4{margin:0;font:600 17px/1.25 var(--ui)}
.bar{height:5px;background:var(--sage);border-radius:9px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--gold)}
.li{display:flex;align-items:flex-start;gap:11px}
.dot{width:21px;height:21px;border-radius:50%;border:1.8px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:13px;color:#fff}
.dot.y{background:var(--ok);border-color:var(--ok)}
.chead{background:var(--pine);color:#f3efe1;padding:20px 18px}
.chead .eyebrow{color:#e3bc72}
.chead h1{font-size:29px;margin:5px 0 8px}
.chead p{margin:0;color:#d3dccf;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--pine2);color:#fff;border-radius:11px;padding:11px 15px;font-weight:600;text-align:center;flex:1 1 auto}
:root[data-theme="dark"] .btn{color:#0d1f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1f1a}}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.reader{font:calc(19px*var(--fs))/1.62 var(--read);max-width:65ch}
.reader p{margin:0 0 1em}
.art h1{font-size:30px;margin:6px 0 4px}
.ask{font:italic calc(18px*var(--fs))/1.4 var(--read);color:var(--soft);margin:0 0 14px}
.key{border-left:4px solid var(--gold);background:var(--goldbg);padding:12px 14px;border-radius:0 10px 10px 0;font:600 calc(18px*var(--fs))/1.38 var(--read);margin-bottom:18px}
.refs{border-top:1px solid var(--line);padding-top:12px;font-size:15px;display:grid;gap:5px}
.refs b{font-weight:600}
textarea,input[type=search],input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 12px;font:16px/1.4 var(--ui)}
textarea{min-height:82px;resize:vertical}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager button{min-height:66px;text-align:left;font-size:15px;line-height:1.25}
.pager small{display:block;color:var(--soft);font-size:13px}
.moment{display:flex;gap:12px}
.moment .n{width:30px;height:30px;border-radius:50%;background:var(--pine2);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
:root[data-theme="dark"] .moment .n{color:#0d1f1a}
.moment h4{margin:2px 0 4px;font:600 17px var(--ui)}
.moment p{margin:0;font:calc(17px*var(--fs))/1.5 var(--read)}
.tag{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.tl{position:relative;padding-left:58px}
.tl .y{position:absolute;left:0;top:14px;font:400 16px var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}
.tl h4{margin:0;font:600 17px/1.2 var(--ui)}
.flash{min-height:320px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:22px;font:500 22px/1.35 var(--read)}
.flash small{font:600 13px var(--ui);color:var(--soft);letter-spacing:.05em;text-transform:uppercase}
.opt{padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;width:100%}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.msg{padding:11px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;font:calc(17px*var(--fs))/1.5 var(--read)}
.msg.u{background:var(--pine2);color:#fff;align-self:flex-end;font-family:var(--ui)}
:root[data-theme="dark"] .msg.u{color:#0d1f1a}
.msg.a{background:var(--card);border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:9px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{font-weight:600;cursor:pointer}
details p{font:calc(17px*var(--fs))/1.5 var(--read);margin:9px 0 5px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav div{display:flex;width:100%;max-width:640px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;font-size:12px;color:var(--soft)}
.nav button.on{color:var(--pine2);font-weight:700}
.empty{color:var(--soft);padding:16px 2px}
mark{background:var(--goldbg);color:inherit}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .18s ease-out}@keyframes f{from{transform:translateY(5px)}to{transform:none}}}
.brandline{display:flex;align-items:center;gap:7px}.brandline img{height:18px;width:auto;opacity:.95}
.sello{display:flex;flex-direction:column;align-items:center;gap:7px;margin:30px 0 8px;font-size:12.5px;color:var(--soft);font-family:var(--ui)}
.sello .chip-l{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:7px 14px;opacity:.92}
.sello img{height:54px;width:auto;display:block}
.qs{display:grid;gap:7px;font:calc(16.5px*var(--fs))/1.42 var(--read);border-top:1px solid var(--line);padding-top:9px;margin-top:6px}
.chip.sel{background:var(--pine2);color:#fff;border-color:var(--pine2)}
:root[data-theme="dark"] .chip.sel{color:#0d1f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.sel{color:#0d1f1a}}
.crisis{border-color:var(--gold);margin-bottom:10px}
.scene{display:block;width:100%}.hero .scene{height:150px}
.emb{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cemb{width:48px;height:48px;border-radius:50%;background:var(--pine);color:#e7c078;display:grid;place-items:center;flex:none}
.banner{position:relative;background:var(--pine);color:#f8f3e4}.banner .scene{height:170px}
.bt{padding:12px 18px 18px;background:var(--pine)}.bt .eyebrow{color:#e3bc72}.bt h1{font-size:27px;margin-top:4px;color:#f8f3e4}
.st-r{display:flex;align-items:center;gap:6px;padding:6px 8px}.ring{width:50px;height:50px;flex:none}
.quote{margin:14px 0;padding:16px 16px 13px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.quote .qm{position:absolute;right:8px;top:4px;color:var(--gold);opacity:.22}.quote .qm svg{width:50px;height:50px;fill:currentColor;stroke:none}
.quote blockquote{margin:0 0 10px;font:italic 500 calc(19px*var(--fs))/1.38 var(--read);position:relative}
.quote figcaption{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--soft);line-height:1.25}.quote b{color:var(--ink);font-weight:600}
.med{width:30px;height:30px;border-radius:50%;background:var(--pine);color:#e7c078;display:inline-grid;place-items:center;font:400 16px var(--disp);flex:none}
.hb{padding:0;overflow:hidden;position:relative;border:0;background:var(--pine)}.hb .scene{height:104px}
.hbt{display:block;padding:12px 15px 14px;color:#f8f3e4}.hbt h3{font-size:22px;margin:2px 0}.hbt .eyebrow{color:#e3bc72}.s2{font-size:14.5px;color:#d3dccf}
.diag{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;margin:12px 0}.diag svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.node{cursor:pointer}.node:focus-visible{outline:2.5px solid var(--gold)}
.vals{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px}.vals span{font-size:13px;font-weight:600;color:var(--gold);background:var(--goldbg);padding:3px 10px;border-radius:99px}
.era{display:flex;gap:12px;align-items:flex-start}.era h4{margin:1px 0 2px;font:600 17px/1.25 var(--ui)}
.eb{width:46px;height:46px;border-radius:50%;background:var(--pine);color:#e7c078;display:grid;place-items:center;flex:none}
.eras .link{display:block;width:2px;height:12px;background:var(--gold);margin-left:37px;opacity:.65}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:13.5px;color:var(--soft);margin:2px 0 10px}.legend span{display:flex;align-items:center;gap:5px}
.d{display:inline-block;width:12px;height:12px;border-radius:50%}.d.i{background:var(--gold)}.d.m{background:var(--pine2)}.d.l{background:var(--bad)}
.rail{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;display:grid;gap:14px}.ev{position:relative;font:calc(17px*var(--fs))/1.42 var(--read)}.ev .tag{font-family:var(--ui)}.ev .d{position:absolute;left:-25px;top:3px;box-shadow:0 0 0 3px var(--bg)}
.quote blockquote{padding-right:30px}.quote .qm svg{width:38px;height:38px}

@media (prefers-reduced-motion:no-preference){.rays{animation:rot 36s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
#splash{position:fixed;inset:0;z-index:99;background:#0e2f26;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}

.spm{position:relative;text-align:center;color:#f6efdc;display:flex;flex-direction:column;align-items:center;gap:10px}
.spsun{width:104px;height:104px}
.spt{font:400 21px var(--disp);letter-spacing:.01em;max-width:30ch}

.meta2{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--soft)}.meta2 span{display:flex;align-items:center;gap:6px}.meta2 .emb{width:19px;height:19px}
.chk{display:flex;gap:10px;align-items:flex-start;font:16.5px/1.4 var(--ui)}
.chk input{width:21px;height:21px;accent-color:var(--pine2);margin-top:1px;flex:none}
.tmin{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
.card.mini{padding:9px 12px}.card.mini b{display:block;font:600 15.5px var(--ui)}.card.mini .meta{font-size:13.5px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--pine);color:#f6efdc;padding:11px 18px;border-radius:99px;font:600 15px var(--ui);z-index:60;box-shadow:0 4px 18px #0005;max-width:90%;text-align:center}

/* ---------- Pantallas anchas: barra lateral y aprovechar el espacio ---------- */
.nbrand{display:none;align-items:center;gap:10px;padding:4px 14px 16px;font:400 20px var(--disp);color:var(--ink)}
.nbrand img{height:27px;width:auto}

}

 body{padding-left:244px}

/* ---------- Pantalla de entrada ---------- */

@media (prefers-reduced-motion:no-preference){
 .splogo img{animation:spIn 1s cubic-bezier(.2,.85,.25,1) both}

 @keyframes spIn{from{opacity:0;transform:scale(.68) rotate(-7deg)}to{opacity:1;transform:none}}

</style></head><body><main id="app"></main><nav class="nav" id="nav" aria-label="Principal"></nav><script>const CAPS=[];

C({n:1,t:"El plan maestro de Dios: el amor",r:"1–21",s:"De dónde viene todo esto: un Dios que ama y un mundo que quiere ver transformado.",
intro:"Antes de hablar de salarios, Estado o ecología, el DOCAT empieza por el principio: quién es Dios y qué quiso al crearnos. La Doctrina Social no nace de un programa político; nace de haber sido amados.",
or:"Padre bueno, tú nos pensaste antes de que existiéramos. Abre nuestros ojos para vernos como nos miras tú, y que ese amor no se nos quede adentro, sino que se haga servicio. Amén.",
din:"La caja y el espejo (adaptada de la Guía de estudio). En una caja se esconde un espejo y se anuncia que dentro está la creación más bella de Dios. Cada grupo intenta adivinar qué hay. Luego cada joven se asoma y se encuentra con su propio rostro. Conversen: ¿qué cambia en mi trato con los demás si creo esto de mí y de ellos?",
cp:{c:"Dedica diez minutos diarios esta semana a agradecer a Dios por una persona concreta.",s:"Ofrece tiempo y escucha, de verdad, a alguien que suele pasar inadvertido en tu parroquia.",t:"Identifica en tu grupo una costumbre que trate a alguien como descartable y propongan cambiarla."},
f:[
["Dios tiene un plan, y se llama amor","¿Creó Dios el mundo con algún propósito?","El hilo que une toda la creación es el amor: fuimos hechos para recibirlo y devolverlo.",["Nada de lo que existe es un accidente sin sentido. Así como quien inventa un juego le da reglas para que funcione, Dios creó el mundo con un propósito. Ese propósito tiene nombre: amar. El ser humano está llamado a pensar, hablar y actuar desde el amor que primero recibió.","Por eso la pregunta social, «¿qué debemos hacer?», depende de otra anterior: «¿para qué existimos?». Si la vida es don, el otro también lo es, y la manera como organizamos la sociedad deja de ser indiferente."],"1, 5","Sb 11,24; 1 Jn 4,8"],
["Dios como medida de nuestro actuar","¿Qué tiene que ver creer en Dios con la vida social?","Lo que Dios quiere para nosotros es la regla de una vida buena y justa.",["Si Dios es origen y meta de todo, también es la referencia para distinguir lo bueno de lo malo. El creyente no actúa solidariamente por simple filantropía: lo hace porque Dios actuó primero con amor hacia él.","El DOCAT lo dice con una imagen fuerte: Dios escribió el ADN de nuestra vida. Una sociedad que se organiza contra ese diseño termina volviéndose contra las personas."],"2–4","1 Jn 4,19"],
["El mal, la libertad y el pecado","Si Dios creó por amor, ¿por qué hay tanta injusticia?","Amar exige libertad; y la libertad incluye la posibilidad real de herir.",["Dios hizo un mundo bueno, pero nadie puede ser obligado a amar. Una libertad auténtica implica poder elegir mal, y de ahí nacen tanto los daños entre personas como las injusticias que se acumulan en la historia. El relato de Adán y Eva y el de Babel muestran a la humanidad apartándose de Dios y destruyendo sus propios vínculos.","Dios no abandona a quien se aleja. Toda la historia de la salvación es la historia de un Dios que sigue buscando al ser humano."],"6–8","Gn 3; Gn 11"],
["Dios se revela: de Abrahán a Jesús","¿Cómo podemos conocer lo que Dios quiere?","Dios se da a conocer en la historia de un pueblo y llega a su plenitud en Jesucristo.",["La razón puede intuir que Dios existe, pero quién es en verdad solo lo sabemos porque él se ha manifestado. Habló a Abrahán, liberó a su pueblo de Egipto por medio de Moisés y selló con él una Alianza.","Fíjate en el punto de partida social de la Biblia: Dios se revela liberando esclavos. En Jesús de Nazaret esa revelación llega a su punto más alto, porque en su persona el amor de Dios se hace carne, rostro y cercanía."],"9–10, 13","Ex 3,7-10; Jn 1,14"],
["Los Diez Mandamientos, reglas para convivir","¿Siguen sirviendo los mandamientos para la vida en común?","No son cadenas: son los cimientos que protegen la libertad y la vida de todos.",["La Alianza del Sinaí muestra que reconocer a Dios cambia la manera de vivir juntos. Los mandamientos expresan obligaciones básicas (no matar, no robar, no mentir) y, por eso mismo, protegen derechos básicos de cada persona: la vida, los bienes, la verdad.","Una comunidad que los olvida pierde el suelo firme sobre el cual construir confianza."],"11–12","Ex 19–24; Ex 20,1-17"],
["El mandamiento nuevo","¿Qué añade Jesús a la regla de oro?","Jesús eleva el listón: amar como él nos ha amado.",["Muchas culturas conocen la regla de oro: trata a otros como quieres ser tratado. El Antiguo Testamento ya mandaba amar al prójimo como a uno mismo. Jesús va más allá: el amor se mide por su entrega, hasta incluir a los enemigos.","El amor no se reduce a un sentimiento. Es una virtud, una fuerza que se entrena con actos concretos, igual que un músculo. Por eso el amor al prójimo se puede y se debe educar."],"14–16","Lv 19,18; Jn 13,34; Lc 10,25-37"],
["La transformación empieza en el corazón","¿Cómo cambia de verdad una sociedad?","Sin conversión personal, las estructuras nuevas repiten las viejas injusticias.",["Primero la persona se convierte por dentro; luego actúa hacia fuera. La conversión del corazón es un camino continuo y nos enseña a reconocer cómo pueden mejorarse las instituciones. Ninguna de las dos cosas sustituye a la otra.","Quien se encierra en sí mismo se atrofia: esa alienación es el centro del pecado. Estamos hechos para la comunidad y para Dios, y solo saliendo de nosotros mismos llegamos a ser plenamente humanos."],"18–19","EG 8; Rm 12,2"],
["La Iglesia y el Reino","¿Para qué existe la Iglesia en este plan?","La Iglesia es comunidad enviada para que el mundo tenga espacio para Dios.",["La salvación que Dios quiere alcanza a toda la persona: cuerpo y espíritu, vida individual y vida social. La historia tiene sentido porque camina hacia esa plenitud.","Jesús nos invita a participar en esta obra en comunidad, y esa comunidad es la Iglesia, su Cuerpo. Allí donde se celebran los sacramentos y se vive el amor concreto, el Reino de Dios ya despunta, aunque todavía no esté completo."],"17, 20–21","Mt 13,31-33; LG 5"]
],
q:[
["Según el DOCAT, ¿cuál es el hilo conductor de la creación?",["El orden natural","El amor","La obediencia","El progreso"],1,"Dios creó por amor y para que amemos: de ahí parte toda la Doctrina Social."],
["¿Por qué existe la posibilidad de hacer el mal?",["Porque Dios la quiso como castigo","Porque el mundo fue mal creado","Porque amar exige libertad","Porque el mal es igual de fuerte que el bien"],2,"A nadie se le puede obligar a amar; la libertad verdadera incluye poder elegir mal."],
["¿Dónde empieza toda transformación social, según el capítulo?",["En las leyes","En la economía","En el corazón humano","En las elecciones"],2,"La conversión personal es el primer paso, y de ella brota el cambio de instituciones y sistemas."],
["El amor al prójimo, para el DOCAT, es ante todo:",["Una emoción espontánea","Una virtud que se entrena","Un mandato solo para religiosos","Una consecuencia automática de la fe"],1,"Se educa con actos repetidos, como cualquier fuerza que se ejercita."],
["¿Cuál es la novedad del mandamiento de Jesús respecto a la regla de oro?",["Amar como él nos ha amado","Amar solo a los creyentes","Sustituir los Diez Mandamientos","Amar sin obrar"],0,"Jn 13,34 pone como medida el amor entregado del propio Jesús."]
]});
C({n:2,t:"La Iglesia y lo social: la unión hace la fuerza",r:"22–46",s:"Qué es la Doctrina Social, de dónde salió, y por qué también habla de redes y medios.",
intro:"No se puede escuchar el Evangelio sin sentirse llamado a actuar en la sociedad. Este capítulo define qué es la DSI, qué no es, y cómo ha ido creciendo desde Rerum novarum hasta el mundo digital.",
or:"Señor Jesús, que te detuviste ante quien sufría: no nos dejes creer en ti con los brazos cruzados. Haznos Iglesia que sale, escucha y carga con el herido. Amén.",
din:"Fe de brazos cruzados. Dos jóvenes representan a un creyente muy piadoso que pasa de largo ante un necesitado. El grupo detiene la escena y propone cómo reescribirla, leyendo después St 2,14-17. Pregunta final: ¿de qué manera se puede pasar de largo en nuestro municipio?",
cp:{c:"Lee esta semana el Buen Samaritano (Lc 10,25-37) y escribe con qué personaje te identificas.",s:"Averigua qué hace Cáritas o la Pastoral Social en tu parroquia y ofrece una hora.",t:"Revisen como grupo qué publican en redes: ¿une, informa o solo señala?"},
f:[
["¿Qué es la Doctrina Social?","¿Por qué la Iglesia tiene una enseñanza sobre la sociedad?","Es el Evangelio aplicado a la vida social: anuncia lo justo y denuncia lo que hiere a las personas.",["La DSI es la reflexión de la Iglesia sobre la convivencia humana a la luz de la fe y la razón. Tiene dos tareas: proponer una actuación justa acorde al Evangelio, y denunciar las estructuras sociales, económicas o políticas que lo contradicen.","No es un manual técnico, sino una orientación propositiva: un signo de esperanza. Todos los miembros de la Iglesia participan en ella según su vocación, aunque su formulación auténtica corresponde al Magisterio."],"22–24","EG 183; CA 54"],
["Cómo surgió: la cuestión obrera","¿Desde cuándo existe la Doctrina Social?","El nombre y el cuerpo actual nacen con Rerum novarum (1891), pero la raíz es el Evangelio.",["La Iglesia siempre se ocupó de los pobres. Lo que empieza en 1891 es una forma nueva: el papa León XIII responde a las condiciones de los obreros de la industrialización, y desde entonces los papas han leído los signos de cada época.","En el camino la DSI ha enfrentado guerras, el totalitarismo, el subdesarrollo, la globalización, la crisis ecológica y, ahora, la inteligencia artificial. La sección Documentos de esta app te muestra ese recorrido."],"25, 27","RN (1891); MH (2026)"],
["No basta salvar almas sueltas","¿Por qué a la Iglesia no le interesa solo el individuo?","Cada persona es única, pero está llamada a la comunidad desde el vientre materno.",["A la Iglesia se le ha reprochado ocuparse únicamente del alma de cada cual. Sin embargo, ante Dios cuenta cada persona y, a la vez, nadie se salva ni vive en solitario.","Una Iglesia sin solidaridad sería una contradicción. El amor recibido de Dios debe prolongarse en amor humano hasta llegar a todos. Esa es la razón de fondo de la pastoral social."],"26–27","GS 1; GS 32"],
["Fe y compromiso social","¿Se puede ser cristiano sin comprometerse socialmente?","Difícilmente: el Evangelio llama a practicar el amor, la justicia, la libertad y la paz.",["No todo el que se compromete socialmente es cristiano, pero con dificultad puede llamarse cristiano quien no se compromete. Al mismo tiempo, lo social no es el fin último de la Iglesia: incluso en una sociedad perfectamente justa seguiría anunciando la salvación.","Evangelización y promoción humana van de la mano. La caridad es, junto con el anuncio y la liturgia, función esencial de la Iglesia. Quitarle la dimensión social a la fe sería reducir el Evangelio a la mitad; reducirlo a lo social, también."],"28–30","St 2,14-17; DCE 25; EN 31"],
["La Iglesia no hace política de partido","¿Dónde está el límite de la Iglesia en cuestiones sociales?","La Iglesia no sustituye al Estado: inspira la política desde el Evangelio, y actúa en ella por medio de los laicos.",["La Iglesia no ofrece soluciones técnicas. Formula principios sobre salario, propiedad o participación, y son los laicos, con competencia y libertad, quienes los traducen en decisiones concretas.","Aun así, aprecia el orden democrático como mejor garante de los derechos y la participación, en la medida en que respete la dignidad humana. Y no invade competencias ajenas al pronunciarse, porque ni la persona ni la familia son propiedad del Estado."],"31–33","CA 46; GS 76; DCE 28"],
["Una doctrina abierta, para todos","¿La DSI está terminada? ¿Es solo para católicos?","Tiene un núcleo permanente, pero sigue creciendo y se dirige a toda persona de buena voluntad.",["La DSI no es un sistema cerrado: dialoga con las ciencias políticas, económicas, naturales y sociales. La sociedad cambia, de modo que esta enseñanza nunca se da por concluida, aunque sus fundamentos permanezcan.","Sus argumentos pueden ser comprendidos por la razón, y por eso los papas la han dirigido también a quienes no creen. Tu resumen universitario lo llama «saber histórico»: un núcleo de principios y un cuerpo que se actualiza."],"34–36","MH 17-27; PT, saludo inicial"],
["Saber teórico de alcance práctico","¿Qué tipo de saber es la DSI?","Parte de los hechos sociales, los ilumina con la fe y la razón, y vuelve a la realidad para transformarla.",["La DSI pertenece a la teología moral. Su objeto material es la sociedad; su objeto formal, la mirada sobre sus principios y problemas con la razón iluminada por la fe, para construir el mundo según el plan de Dios.","Se alimenta de la Escritura, los Padres de la Iglesia, los grandes teólogos y el Magisterio, además de la ley natural. Pertenece al magisterio ordinario, cuyas orientaciones concretas se desarrollan en la historia. El método clásico es Ver, Juzgar, Actuar."],"Resumen DSI, unidad I","SRS 41; MM 236"],
["Medios y redes sociales","¿Qué dice la Iglesia del mundo digital?","Las redes pueden unir o aislar; cuentan los fines, y el modo como las usamos.",["Los medios sirven a las personas y su mutua comprensión: no son un fin en sí mismos. Las redes amplían la capacidad de comunicarse, pero el acceso desigual crea una brecha digital que deja fuera a muchos.","Cada usuario responde por lo que hace y deja hacer en línea. El cristiano en la red debería distinguirse por su modo de hablar: veraz, respetuoso, capaz de escuchar. Los proveedores y plataformas también deben someterse a criterios morales."],"37–45","Benedicto XVI, mensajes para la Jornada de las Comunicaciones"],
["Técnica: ni todo lo nuevo es bueno","¿Debe la Iglesia acompañar cada avance técnico?","La ciencia es fruto admirable de la creatividad humana, pero el progreso no es un fin en sí mismo.",["Que algo sea nuevo no significa que sea bueno. Todo avance debe medirse por lo que hace a la persona y a la comunidad.","Este criterio de 2016 se ha desarrollado mucho desde entonces. La encíclica Magnifica humanitas de León XIV (2026) aborda directamente la inteligencia artificial y sostiene que la técnica no es neutral, porque refleja a quienes la conciben, financian, regulan y usan."],"46","LS 102-114; MH 9"]
],
q:[
["¿Con qué documento y año nace formalmente la DSI moderna?",["Quadragesimo anno, 1931","Rerum novarum, 1891","Gaudium et spes, 1965","Mater et magistra, 1961"],1,"León XIII responde en 1891 a la cuestión obrera."],
["¿Cuáles son las dos tareas de la DSI según el DOCAT?",["Gobernar y juzgar","Proponer lo justo y denunciar lo injusto","Administrar y evangelizar","Predicar y recaudar"],1,"Promover una actuación justa y denunciar las estructuras contrarias al Evangelio."],
["¿Por medio de quién interviene la Iglesia concretamente en política?",["Los obispos como candidatos","Un partido católico","Los laicos cristianos","El Vaticano directamente"],2,"La Iglesia inspira; los laicos actúan con competencia y libertad."],
["¿Qué significa que la DSI es un «sistema abierto»?",["Que cada quien opina lo que quiera","Que sus principios caducan","Que tiene un núcleo estable y se desarrolla ante nuevas realidades","Que no tiene autoridad"],2,"Sus fundamentos permanecen y su aplicación se actualiza en la historia."],
["¿Cómo se llama la desigualdad en el acceso a internet que el DOCAT señala?",["Brecha digital","Red social","Bioética","Subsidiaridad digital"],0,"Quienes no tienen acceso quedan excluidos de la participación."]
]});
C({n:3,t:"Única e irrepetiblemente valiosa: la persona humana",r:"47–83",s:"La dignidad, la libertad, los derechos humanos y la vida frágil.",
intro:"Toda la DSI gira alrededor de una convicción: cada ser humano es persona, imagen de Dios, con una dignidad que nadie concede y nadie puede quitar. De ahí se siguen los derechos, los deberes y la defensa de la vida.",
or:"Dios de la vida, tú nos llamas por nuestro nombre. Enséñanos a reconocer tu imagen en el rostro herido, en el anciano solo, en el que estorba a los poderosos. Amén.",
din:"Precio y valor. Repartan etiquetas con frases como «no produce», «es migrante», «tiene antecedentes», «ya está viejo». Cada una se pega sobre una silueta humana. Después, se leen juntos Gn 1,27 y se retiran una a una mientras cada joven dice: «Vale por ser persona». Conversen: ¿qué etiquetas usamos en nuestro barrio?",
cp:{c:"Haz un examen de conciencia: ¿a quién he tratado esta semana como si valiera menos?",s:"Visita a un adulto mayor o a un enfermo sin otro motivo que acompañarlo.",t:"Identifiquen una barrera (física o de trato) que excluya a personas con discapacidad en su templo y gestionen su cambio."},
f:[
["¿Qué significa ser persona?","¿Por qué decimos «persona» y no simplemente «individuo»?","Persona significa una dignidad inviolable: imagen de Dios, nunca un medio.",["Al llamar persona a cada ser humano afirmamos que tiene un valor único, porque está creado a imagen de Dios (Gn 1,27). Es la única criatura querida por sí misma.","La filosofía clásica definió a la persona como sustancia individual de naturaleza racional (Boecio): alguien con inteligencia y voluntad, capaz de verdad, bien y libertad. Por eso la persona es principio, sujeto y fin de toda institución social."],"47, 54","Gn 1,27; GS 24; MM 219"],
["Seres sociales por naturaleza","¿Necesitamos realmente de los demás?","La persona solo se desarrolla en relación: la vida social no es un añadido.",["Dios, que es comunión de Padre, Hijo y Espíritu, nos creó para el encuentro. Lo social se aprende primero en la familia, y desde allí se abre a otras comunidades.","Esta visión se separa de dos extremos. El individualismo ve la sociedad como un contrato artificial entre sujetos aislados; el colectivismo disuelve al individuo en el todo. El personalismo cristiano afirma ambas cosas: somos sociales por naturaleza y nadie queda reducido a engranaje."],"48–49, 61","GS 12; GS 25"],
["El pecado también es social","¿Mis pecados afectan a la sociedad?","Todo pecado es acto personal con efectos en los vínculos; acumulados, forman estructuras de pecado.",["El pecado siempre es un acto libre y consciente de alguien, pero su efecto llega a las relaciones y a la comunidad. El egoísmo, la codicia y la soberbia llevan a someter y explotar a otros.","Cuando estas conductas se consolidan en costumbres, normas y sistemas, hablamos de estructuras de pecado (corrupción normalizada, explotación laboral). Se superan con conversión personal y con cambios institucionales, pues su origen está en decisiones humanas concretas."],"50–51, 62","SRS 36-37; ReP 16"],
["Cuerpo, alma, apertura a Dios","¿Qué somos en el fondo?","Una unidad de cuerpo y alma, abierta al Infinito.",["No somos dos realidades pegadas. El materialismo reduce el alma a la materia y el espiritualismo desprecia el cuerpo. La fe sostiene su unidad: por eso lo que se hace al cuerpo del pobre, del enfermo o del trabajador toca a la persona entera.","Solo el ser humano tiene hambre de respuestas últimas. Una sociedad que solo atiende necesidades materiales lo deja a medias; y una espiritualidad indiferente al hambre también."],"52–53","GS 14; Mt 25,31-46"],
["Lo que la sociedad le debe a cada uno","¿Qué exige la dignidad de la organización social?","El orden social se subordina a la persona, nunca al revés.",["Una sociedad justa respeta y promueve la dignidad de cada uno. Quedan excluidas la explotación y la instrumentalización con fines económicos, políticos o de cualquier tipo.","Dignitas infinita (2024) ha recordado que esta dignidad es ontológica: permanece en cualquier circunstancia, y no depende de capacidades o logros. Magnifica humanitas insiste en que ninguna eficiencia productiva la puede medir."],"54–55","GS 26; DI (2024); MH 51-53"],
["Libertad con finalidad","¿Ser libre es hacer lo que yo quiera?","La libertad se realiza en el bien: se ordena al amor y a la verdad.",["La libertad es derecho primario de la persona; sin ella no hay responsabilidad ni amor verdadero. Pero no se reduce a escoger entre opciones, y tampoco es absoluta: existe para que podamos optar por lo bueno.","La conciencia es el lugar íntimo donde la persona discierne el bien y el mal. Se ha de formar, porque puede errar; y debe ser respetada, porque nadie puede ser forzado a actuar contra ella."],"56–57","GS 16-17; Ga 5,13; CCC 1776-1802"],
["Igual dignidad de mujer y varón","¿La Iglesia considera iguales a hombres y mujeres?","Igual dignidad, en una diferencia que se complementa; toda discriminación injusta debe superarse.",["No hay diferencias de dignidad por sexo, origen, religión o color de piel. Las injusticias entre sexos y pueblos deben vencerse a favor del crecimiento común. El DOCAT sostiene que Dios creó varón y mujer con igual dignidad, para que se complementen y se necesiten mutuamente.","Sobre las personas con discapacidad, la justicia social se realiza cuando todos pueden participar de la vida social, económica, política y cultural. No son objeto de lástima; son sujetos."],"58–60","Gn 1,27; Ga 3,28; GS 29"],
["Derechos humanos","¿De dónde vienen los derechos humanos?","No son un regalo del Estado: brotan de la dignidad de la persona.",["La Iglesia valora la Declaración Universal de 1948 como un hito moral. Los derechos no son invención de juristas ni concesión de gobernantes bondadosos: pertenecen a la naturaleza humana.","Tu resumen los caracteriza como universales, intransferibles, inviolables y perennes, y añade que se conocen gradualmente y van unidos a deberes. Quien reclama sus derechos y olvida sus deberes construye con una mano y derriba con la otra, según la imagen de Pacem in terris. También los pueblos tienen derechos."],"63–67","PT 8-34; PT 30; MH 54-58"],
["Bioética: la vida más frágil","¿Por qué la Iglesia interviene en bioética?","La Iglesia celebra el avance científico y exige que nunca convierta a una persona en medio.",["La bioética afecta decisiones que van más allá de lo privado: quién vive, quién decide, quién queda sin protección. La Iglesia afirma que la vida humana merece respeto desde la concepción hasta la muerte natural y, por eso, rechaza el aborto y la selección de embriones.","Junto a la firme defensa de la vida, el DOCAT pide acompañamiento real. Ante una mujer embarazada tras una violación, nombra el crimen sufrido y pide para ella toda ayuda, junto con la protección del niño por nacer. La DSI no se limita a decir no: exige estar presente."],"69–76, 80","EV 58-62; CCC 2270-2275; Dignitas personae (2008)"],
["Eutanasia, cuidados paliativos y muerte","¿Qué dice la Iglesia sobre el final de la vida?","No se mata al enfermo: se le acompaña, se alivia su dolor y no se le abandona.",["Matar directamente a una persona, incluso enferma terminal, contradice el «no matarás». Ninguna vida tiene precio y por eso es reprobable hacer negocio de la muerte. Tampoco existe obligación de sufrir tratamientos desproporcionados.","El miedo que hay detrás suele ser al dolor, la dependencia y la soledad. La respuesta cristiana es el cuidado: medicina paliativa, compañía y comunidad. Para enfermería esto es muy concreto: cuidar nunca termina, aunque curar ya no sea posible."],"77–83","EV 65; CCC 2276-2279; Samaritanus bonus (2020)"]
],

C({n:4,t:"Bien común, persona, solidaridad, subsidiaridad",r:"84–111",s:"Los principios: la brújula con la que se lee cualquier realidad.",
intro:"Si solo fueras a aprender un capítulo, que sea este. Cuatro principios y unos valores permiten analizar casi cualquier problema social: un salario, un desplazamiento, un plan de ordenamiento en tu municipio.",
or:"Espíritu Santo, danos ojos para mirar el bien de todos y manos para tejerlo. Que nadie se quede por fuera de nuestra mesa. Amén.",
din:"El problema de la vereda. Presenten un caso: en una vereda se seca el acueducto comunitario y una empresa propone comprarlo. Por grupos, cada uno analiza con un principio (persona, bien común, subsidiaridad, solidaridad). En plenaria armen entre todos una respuesta y noten qué falta si se usa un solo principio.",
cp:{c:"Memoriza los cuatro principios y di con tus palabras qué significa cada uno.",s:"Únete a una iniciativa existente en tu municipio antes de crear una nueva: eso también es subsidiaridad.",t:"Elijan un problema local y analícenlo por escrito con los cuatro principios."},
f:[
["Los cuatro principios","¿Cuáles son los principios de la DSI?","Persona, bien común, subsidiaridad y solidaridad, inseparables entre sí.",["El DOCAT presenta cuatro: dignidad de la persona (personalidad), bien común, subsidiaridad y solidaridad. Son permanentes, universales y se han de aplicar juntos.","Si se aísla uno, se deforma. La solidaridad sin subsidiaridad cae en asistencialismo; la subsidiaridad sin solidaridad, en individualismo. Los documentos añaden otros: el destino universal de los bienes y la participación. Magnifica humanitas menciona como fundamentos la imagen de Dios, la igual dignidad y los derechos humanos."],"84–86, 104","CDSI 160-163; MH 46-77"],
["Bien común","¿Qué es exactamente el bien común?","El conjunto de condiciones que permiten a todos y a cada uno desarrollarse.",["No es la suma de intereses particulares ni el bien de la mayoría. Abarca las condiciones de vida social (seguridad, salud, educación, trabajo, ambiente sano, instituciones justas) que hacen posible la plenitud de personas, familias y asociaciones.","Se construye entre todos y tiene un criterio concreto: los pobres están en el corazón de la Iglesia. Para el DOCAT, velar por quienes viven marginados es la primera obligación social de cada persona y de toda la comunidad."],"87–88, 94","GS 26; GS 74; CDSI 164; CCC 1905-1912; MH 59-64"],
["Destino universal de los bienes","¿Para quién son los bienes de la tierra?","Dios dio la tierra a toda la familia humana: ningún bien puede usarse contra ese destino.",["Toda persona debe poder acceder a lo necesario para vivir con dignidad. Este principio es anterior a los regímenes concretos de propiedad.","Los Padres de la Iglesia hablaron del propietario como administrador. Magnifica humanitas lo aplica a nuestro tiempo: datos, algoritmos, patentes y plataformas digitales también están sujetos a este destino."],"89, 92–93","GS 69; PP 22; LS 93-95; MH 65-67"],
["Propiedad privada y su hipoteca","¿La Iglesia defiende la propiedad privada?","Sí la defiende, porque protege la libertad, pero nunca como un derecho absoluto.",["La propiedad personal ofrece a cada uno un espacio de autonomía y responsabilidad. Sin embargo, tiene función social: sobre ella pesa, en expresión de san Juan Pablo II, una hipoteca social.","Por eso la DSI se distingue tanto del marxismo, que busca abolirla, como del liberalismo extremo, que la vuelve ilimitada. Fratelli tutti recuerda que el derecho a la propiedad es secundario respecto al destino universal."],"90–91","RN; SRS 42; LE 14; CA 30; FT 120"],
["Subsidiaridad","¿Qué significa en concreto?","Lo que una comunidad pequeña puede hacer no lo debe absorber una mayor, y esta debe ayudarle a hacerlo.",["La palabra viene de subsidium, ayuda. Tiene dos caras: una instancia superior no reemplaza a la familia, la junta o el municipio en lo que pueden hacer; y sí debe apoyarlos cuando no alcanzan.","Es un dique contra el paternalismo y el abandono. Para la Pastoral Social es decisivo: acompañar a las comunidades para que sean protagonistas, nunca organizarlas como mano de obra de proyectos diseñados por otros."],"95–98","QA 79-80; CDSI 185-188; CCC 1883-1885; MH 68-72"],
["Participación","¿Cómo se realiza la subsidiaridad?","Cada persona tiene derecho y deber de tomar parte en lo que afecta a su comunidad.",["Participar no se limita a votar. Incluye juntas de acción comunal, asociaciones, consejos parroquiales, veedurías y cooperativas.","Corresponsabilidad significa que nadie depende de forma humillante y nadie se desentiende. Para que exista, hace falta información, formación y espacios reales de decisión, sobre todo para quienes suelen quedar por fuera."],"98–99","GS 75; CDSI 189-191; CCC 1913-1917"],
["Solidaridad","¿Es lo mismo solidaridad que dar limosna?","Es la determinación firme y perseverante de empeñarse por el bien común.",["San Juan Pablo II la describe como una virtud, y no como un sentimiento vago de compasión. Se apoya en una evidencia: estamos unidos en un mismo destino y somos responsables unos de otros.","No conoce fronteras, aunque empieza por lo cercano y se concreta en cambios de vida, voto, consumo y trabajo. Su raíz más honda en la fe es Cristo, que se hizo solidario con nosotros hasta la cruz."],"100–103","SRS 38-40; EG 188-189; CDSI 192-196; MH 73-76"],
["Verdad, libertad y justicia","¿Qué valores sostienen la vida social?","Verdad, libertad, justicia y amor: sin ellos, los principios quedan sin alma.",["Los principios señalan el camino; los valores son la manera de recorrerlo. Sin verdad no hay confianza: cuando las palabras contradicen las obras, la comunidad se desmorona.","La libertad abre el espacio de la responsabilidad. Y la justicia es la voluntad constante de dar a Dios y al prójimo lo que les corresponde. Sobre sus clases: conmutativa (entre personas), distributiva (de la sociedad a sus miembros), legal (de los miembros a la sociedad) y, en conjunto, social."],"105–109","PT 35; CCC 1807; CDSI 197-203"],
["El amor va más allá de la justicia","¿Por qué no basta con la justicia?","La justicia da lo debido; la caridad da de sí misma, y humaniza la justicia.",["La caridad supone la justicia, no la reemplaza. Dar por caridad lo que se debe por justicia es una trampa. Pero una sociedad solo justa sería fría: hacen falta misericordia y compasión.","De ahí la «caridad social y política»: amar al prójimo también mediante estructuras y leyes que le protejan. Para Fratelli tutti, ayudar a un anciano a cruzar el río es caridad, y también lo es construir el puente."],"110–111","CiV 2, 6; DCE 28; FT 180-186"],
["Opción preferencial por los pobres","¿La Iglesia tiene preferidos?","Dios ama a todos, y por eso se inclina especialmente hacia quien está caído.",["Es una forma especial de primacía en el ejercicio de la caridad, testimoniada por toda la Tradición. No excluye a nadie: mira la sociedad desde quien va último.","La Iglesia latinoamericana la formuló con fuerza en Medellín, Puebla y Aparecida. Dilexi te (2025), de León XIV, recuerda que existe un vínculo inseparable entre la fe y los pobres, a quienes no conviene ver como un problema, pues son familia."],"94, 238","SRS 42; Puebla 1134-1165; EG 197-201; DT (2025)"]
],

C({n:5,t:"El fundamento de la sociedad: la familia",r:"112–133",s:"La primera escuela de humanidad y por qué merece políticas que la protejan.",
intro:"En la familia aprendemos a ser queridos sin condiciones. Por eso la DSI la considera célula vital de la sociedad y exige al Estado que la sirva, sin suplantarla.",
or:"Sagrada Familia de Nazaret, migrantes y trabajadores: bendice nuestras casas, sana lo que está herido y acompaña a quienes no tienen hogar. Amén.",
din:"El horario de la casa. Cada joven dibuja en una hoja cómo fue su ayer, por horas, y marca cuántos minutos compartió de verdad con alguien de su familia. Se conversa sin juzgar: ¿qué lo facilita, qué lo impide? ¿Qué condiciones sociales (jornadas, transporte, migración) afectan a las familias de nuestro municipio?",
cp:{c:"Reconcíliate o da un primer paso con alguien de tu familia.",s:"Ofrezcan compañía a familias con un enfermo o una persona cuidadora agotada.",t:"Investiguen qué apoyo reciben madres cabeza de hogar en su municipio y preséntenlo a la parroquia."},
f:[
["Por qué vivir en familia","¿Por qué Dios nos quiere en familia?","Fuimos creados para la comunión; en la familia lo experimentamos por primera vez.",["Desde las primeras páginas de la Biblia aparece esa vocación. Jesús mismo creció en un hogar. La Iglesia ve a la familia como la primera comunidad natural, donde se origina la vida y nacen los primeros vínculos.","En ella se transmite la fe y se aprenden las primeras lecciones de sabiduría. Por eso se le llama también Iglesia doméstica."],"112–114","Gn 2,18; FC 21; LG 11"],
["Amados sin condiciones","¿Qué tiene de especial la familia?","En ella cada persona es querida por sí misma, sin tener que ganárselo.",["Muchas generaciones conviven, comparten aprecio, apoyo y justicia. Allí alguien vale por ser quien es, y no por su rendimiento.","Esta experiencia es insustituible, y su ausencia deja heridas que deben ser tenidas en cuenta en toda pastoral. Muchos jóvenes llegan a los grupos sin haber tenido esto: la comunidad también puede acoger y reparar."],"115–117","AL 90-119"],
["La aportación social de la familia","¿Qué le da la familia a la sociedad?","Vida, educación, cuidado y solidaridad entre generaciones.",["La familia perpetúa la sociedad, socializa y educa a los hijos en valores, cuida a sus miembros frágiles y ofrece solidaridad gratuita que ningún mercado puede reemplazar.","Los abuelos transmiten memoria y sabiduría. Los niños, por su fragilidad, merecen una protección especial en cualquier circunstancia. Los padres tienen el derecho primario de educar a sus hijos, aunque esa tarea se comparte con la escuela y la comunidad."],"118–122","FC 42-44; CDSI 238-245"],
["Matrimonio","¿Qué es el matrimonio para la Iglesia?","Alianza entre un hombre y una mujer, fiel, indisoluble y abierta a la vida.",["Casarse significa entregarse completamente. El matrimonio se extiende a todos los ámbitos de la vida y es fundamento de la familia, aun antes de ser signo sacramental.","El DOCAT distingue con claridad el matrimonio de otras formas de convivencia. Amoris laetitia invita, al mismo tiempo, al discernimiento y acompañamiento pastoral de situaciones complejas, y la acogida respetuosa de cada persona, sin renunciar al ideal."],"123–126","GS 48; CCC 1601-1666; AL 291-312"],
["Hijos y paternidad responsable","¿Cuántos hijos se deben tener?","Es decisión responsable de los esposos, nunca imposición del Estado.",["Cada matrimonio discierne generosamente, teniendo en cuenta sus condiciones físicas, económicas, psicológicas y sociales. Si un matrimonio no puede tener hijos, no por eso vale menos: su comunión y su fecundidad espiritual permanecen.","Las políticas públicas no pueden suplantar esta decisión. Son ilegítimas las campañas coercitivas de control de natalidad."],"127–130","GS 50; HV 10; CDSI 234"],
["Políticas familiares subsidiarias","¿Qué debe hacer el Estado por la familia?","Apoyar a las familias para que puedan cumplir su misión, sin reemplazarlas.",["La sociedad y el Estado deben protegerla: salarios suficientes, vivienda, educación accesible, jornada compatible con el cuidado y apoyo a quienes atienden enfermos o ancianos.","La subsidiaridad aplicada aquí significa que el Estado no asume lo que la familia puede hacer, pero sí crea las condiciones para que pueda hacerlo. En Colombia, el trabajo informal y el desplazamiento hacen este tema particularmente urgente."],"131–133","Carta de los derechos de la familia (1983); CDSI 252-254"]
],

C({n:6,t:"Profesión y vocación: el trabajo humano",r:"134–157",s:"La persona vale más que lo que produce: salario, sindicatos y descanso.",
intro:"El trabajo es, según san Juan Pablo II, clave de la cuestión social. En Colombia, con tanto empleo informal, este capítulo se vuelve muy concreto.",
or:"San José obrero, tú enseñaste a Jesús a usar las manos. Acompaña a quienes madrugan, a quienes buscan empleo y a quienes trabajan sin derechos. Amén.",
din:"Radiografía del rebusque. Cada joven entrevista antes a un trabajador informal, y comparte en el grupo cuánto gana, qué protección tiene y qué le preocupa. Con LE 6 y LE 12 en mano, se pregunta: ¿qué dice esto sobre la dignidad? ¿Quién podría cambiar algo?",
cp:{c:"Ofrece a Dios tu estudio o trabajo de mañana como acto de amor.",s:"Paga precio justo y trata con respeto a quienes te prestan servicios.",t:"Inviten a un trabajador o sindicalista a contar su realidad y definan un gesto de apoyo."},
f:[
["El sentido del trabajo","¿Trabajamos solo por dinero?","Mediante el trabajo la persona se realiza y colabora con la obra de Dios.",["El desempleo hiere la dignidad porque quita más que un ingreso: hace sentir inútil. El trabajo desarrolla capacidades y permite participar en la sociedad.","No es un castigo divino: en el Génesis, antes del pecado, el ser humano recibe la misión de cultivar y cuidar el jardín. Lo que el pecado añadió fue la fatiga."],"134–136","Gn 2,15; LE 9; LS 124-129"],
["Jesús, trabajador","¿Cómo vivió Jesús el trabajo?","El Hijo de Dios trabajó con sus manos: ninguna labor honesta es indigna.",["Jesús pasó la mayor parte de su vida como artesano, entre pescadores y campesinos. Sus parábolas están llenas de oficios.","Sin embargo, el trabajo hace parte de la vida sin ser toda la vida. El descanso del domingo orienta la mirada a Dios y recuerda que la persona no es una máquina."],"137–139","Mc 6,3; Ex 20,8-11; LE 26; SC 106"],
["Dimensión objetiva y subjetiva","¿Qué significa que el trabajo es «para el hombre»?","Lo decisivo no es qué se hace, sino quién lo hace.",["La dimensión objetiva es lo producido: técnica, productos, resultados. La subjetiva es la persona que trabaja. Toda labor tiene dignidad porque la realiza una persona.","Por eso una economía que mide a alguien solo por su productividad invierte el orden."],"143","LE 5-6"],
["Prioridad del trabajo sobre el capital","¿Qué vale más: el capital o las personas?","El capital es instrumento; el trabajo es la persona en acción.",["De la dimensión subjetiva se sigue que el trabajo tiene prioridad frente al capital, porque el capital es fruto de trabajo previo y solo funciona unido a él.","Esto no descalifica la inversión ni a la empresa. Reclama un orden: los recursos sirven a las personas. Magnifica humanitas lo aplica a la automatización: los cambios deben evaluarse por la dignidad del trabajador."],"144","LE 12-13; MH 37"],
["La cuestión obrera y el marxismo","¿En qué se diferencia la DSI del marxismo?","Comparte la indignación ante la explotación, y rechaza la lucha de clases como camino.",["En el siglo XIX la industrialización dejó a los obreros desprotegidos. Marx propuso la lucha de clases y la abolición de la propiedad privada.","León XIII reconoció la injusticia y propuso otro camino: derechos laborales, asociaciones de trabajadores, un papel activo del Estado y colaboración social. La Iglesia rechaza tanto el colectivismo como el capitalismo sin ética."],"140–142, 146","RN; QA; CA 12-14"],
["Derecho al trabajo y precariedad","¿Existe un derecho al trabajo?","El desempleo y el trabajo precario son problemas éticos, no solo económicos.",["La sociedad debe ayudar a procurar empleo, aunque el Estado no pueda garantizarlo por sí solo. Toda la sociedad comparte esa responsabilidad, incluidos los que la DSI llama empresarios indirectos.","El cristiano está llamado a tratar al trabajador precario como a Cristo. También se ocupa de migrantes laborales y del campo: la agricultura sostiene la cultura de un pueblo, tema decisivo para el suroeste antioqueño cafetero."],"147–148, 152–153","LE 16-18; EG 192; LS 129"],
["Salario justo","¿Cuándo es justo un salario?","El que permite vivir dignamente al trabajador y a su familia.",["Desde León XIII, la Iglesia niega que el salario se fije solo por la oferta y la demanda. Debe alcanzar para el sustento familiar y para participar plenamente en la sociedad.","Tu resumen aporta criterios: posición y responsabilidad del trabajador, situación de la empresa y bien común. Magnifica humanitas llama al salario justo prueba de la equidad de un sistema."],"155","RN; QA 71; LE 19; MH 37"],
["Sindicatos y huelga","¿Puede un cristiano ir a huelga?","Sí: es legítima como último recurso, pacífica y orientada a lo justo.",["Dado el desequilibrio de fuerzas, los trabajadores tienen derecho a asociarse. Un sindicato defiende intereses justos y no debería volverse instrumento de partidos.","La huelga es un recurso extremo cuando se han agotado el diálogo y la negociación. Debe evitar daños desproporcionados, sobre todo en servicios esenciales."],"154, 156–157","RN; LE 20; CCC 2435"]
],
