"San Antonio Abad":{d:"Hacia 251 – 356 · Egipto",
v:["Nació en una familia acomodada del Medio Egipto. Tenía unos veinte años cuando, huérfano y a cargo de su hermana menor, entró en la iglesia y escuchó el Evangelio en que Jesús le dice al joven rico que venda lo que tiene y lo dé a los pobres. Lo tomó al pie de la letra: vendió las tierras, dejó a su hermana con unas vírgenes consagradas y se marchó al desierto.",
"Vivió más de ochenta años en soledad, primero en una tumba abandonada y después en el monte Colzim, junto al mar Rojo. No fue una huida: a su celda llegaban enfermos, campesinos y obispos, y de allí salían consejo, pan y paz. Dos veces bajó a Alejandría, una para animar a los cristianos perseguidos y otra para defender la fe frente a los arrianos.",
"San Atanasio escribió su vida poco después de su muerte y ese libro encendió el monacato en todo el Mediterráneo. Murió a los ciento cinco años, pidiendo que no se dijera dónde quedaba su tumba."],
f:["Tu vida y tu muerte están en el prójimo","Sentencia atribuida en los dichos de los Padres del desierto"],
s:"Antonio desmonta la idea de que buscar a Dios aleja de la gente. Quien de verdad se encuentra con Dios termina abriendo la puerta de su celda. Es la advertencia para todo comité que se vuelve grupo cerrado.",
o:"San Antonio, que escuchaste una sola frase del Evangelio y le creíste: danos oídos así, y que nuestro retiro con Dios termine siempre en la puerta del hermano."},

"San Francisco de Sales":{d:"1567 – 1622 · Saboya y Ginebra",
v:["Hijo mayor de una familia noble de Saboya, estudió derecho en Padua para complacer a su padre y se ordenó sacerdote contra su voluntad. Lo enviaron a la región del Chablais, entonces enteramente calvinista, donde nadie quería escucharlo. Durante cuatro años escribió hojas a mano y las deslizó por debajo de las puertas. Así, de casa en casa, volvió a nacer allí una comunidad católica.",
"Obispo de Ginebra desde 1602, residió en Annecy porque la ciudad le estaba cerrada. Escribió la «Introducción a la vida devota» para una mujer casada que le pedía consejo, y con ese libro hizo algo nuevo: afirmar que la santidad no es cosa de conventos, sino que cada estado de vida tiene su propio camino.",
"Con santa Juana Francisca de Chantal fundó en 1610 la Visitación. Lo recordaban por su mansedumbre inagotable con los que lo insultaban. Pío XI lo declaró patrono de los periodistas y de los escritores católicos."],
f:["Se atrapan más moscas con una gota de miel que con un barril de vinagre","Dicho recogido por sus biógrafos"],
s:"Enseñó que la santidad es para el obrero, la madre y el comerciante, no solo para el religioso. Esa es la convicción que sostiene a un laico comprometido en la Pastoral Social.",
o:"San Francisco de Sales, maestro de la dulzura: enséñanos a decir la verdad sin herir y a sostener la paciencia cuando nos cierran la puerta."},

"Santo Tomás de Aquino":{d:"1225 – 1274 · Italia y París",
v:["Nació en el castillo de Roccasecca, cerca de Nápoles. Su familia lo destinaba a abad de Montecasino y, cuando a los diecinueve años quiso entrar en la orden mendicante de los dominicos, sus hermanos lo secuestraron y lo retuvieron más de un año en casa. No cedió.",
"Estudió en Colonia con san Alberto Magno, que lo defendió de sus compañeros: lo llamaban «el buey mudo» por callado y corpulento. Enseñó en París y en Italia. Escribió la «Suma Teológica», donde puso la razón y la fe a trabajar juntas, y trató cuestiones muy concretas: el precio justo, la licitud del préstamo con interés, el deber de socorrer al necesitado con lo superfluo.",
"Murió a los cuarenta y nueve años en la abadía de Fossanova, camino del concilio de Lyon. Meses antes había dejado de escribir: dijo que, frente a lo que había visto, todo lo suyo le parecía paja."],
f:["Lo que se tiene en superabundancia se debe a los pobres","Suma Teológica II-II, c. 66, a. 7"],
s:"La frase del superfluo es una de las raíces del destino universal de los bienes. Lo que sobra no es caridad: es justicia que se debe.",
o:"Santo Tomás, que no separaste la inteligencia de la fe: danos claridad para pensar lo que creemos y valor para hacer lo que entendemos."},

"San Juan Bosco":{d:"1815 – 1888 · Piamonte, Italia",
v:["Nació en una casa campesina de los Becchi y quedó huérfano de padre a los dos años. Su madre, Margarita, lo crió en la pobreza y sería después su primera colaboradora. Para pagar sus estudios fue aprendiz de sastre, de zapatero, de carpintero y de panadero: los mismos oficios que luego enseñaría.",
"Ordenado en 1841, encontró en las cárceles de Turín a muchachos de doce y catorce años encerrados con adultos. Decidió que su vida sería impedir que llegaran allí. Empezó el Oratorio de Valdocco con unos pocos y llegó a tener cientos: escuela, taller, patio e iglesia. Firmó en 1852 los primeros contratos de aprendizaje de Italia, exigiendo a los patrones horario, trato digno y descanso dominical.",
"Su método cabe en tres palabras: razón, religión y cariño. Nada de castigos: presencia constante. Fundó a los salesianos en 1859 y, con santa María Mazzarello, a las Hijas de María Auxiliadora en 1872."],
f:["Basta que sean jóvenes para que yo los ame","Palabras recogidas por sus primeros biógrafos"],
s:"Don Bosco no hizo asistencia: hizo promoción humana antes de que existiera la palabra. Enseñó oficios, negoció contratos y transformó la situación de los muchachos, no solo su hambre de ese día.",
o:"San Juan Bosco, padre y maestro de los jóvenes: que nunca miremos a un muchacho por lo que ha hecho, sino por lo que todavía puede llegar a ser."},

"Santa Josefina Bakhita":{d:"Hacia 1869 – 1947 · Sudán e Italia",
v:["Nació en Olgossa, en la región sudanesa de Darfur. Tenía unos siete años cuando unos traficantes la secuestraron mientras jugaba. El terror le borró su propio nombre: Bakhita, «afortunada», fue el que le pusieron sus captores. Fue vendida cinco veces. Un amo la hizo tatuar con más de cien cortes en el cuerpo, frotados con sal.",
"El cónsul italiano Callisto Legnani la compró en Jartum y la llevó a Italia, donde quedó al cuidado de las Hermanas Canosianas de Venecia. Allí conoció al que llamaba «el Patrón» de todas las cosas. Cuando quisieron llevársela de vuelta, se negó: un tribunal italiano declaró en 1889 que nunca había sido legalmente esclava. Fue bautizada al año siguiente con el nombre de Josefina.",
"Vivió cincuenta años en la casa de Schio como cocinera y portera. Los niños del pueblo la llamaban «nuestra madre morena». Preguntada qué haría si se encontrara con sus secuestradores, respondió que se arrodillaría a besarles las manos, porque sin ellos no habría llegado a conocer a Cristo. Juan Pablo II la canonizó en el año 2000."],
f:["Si volviera a encontrar a aquellos negreros que me raptaron, me arrodillaría","Testimonio recogido en su proceso"],
s:"Bakhita es el rostro de la trata de personas, que no es historia antigua: sigue ocurriendo en nuestras carreteras y nuestras ciudades. Su fiesta es la Jornada Mundial de Oración contra la Trata.",
o:"Santa Josefina Bakhita, que fuiste comprada y vendida y acabaste libre: libra a quienes hoy son tratados como mercancía, y haz que no apartemos la mirada."},

"Nuestra Señora de Lourdes":{d:"1858 · Francia",
v:["Bernadette Soubirous tenía catorce años, era asmática, apenas sabía leer y vivía con su familia en un antiguo calabozo de Lourdes porque no tenían otra cosa. El 11 de febrero de 1858, recogiendo leña junto al río Gave, vio en la gruta de Massabielle a una señora joven. Hubo dieciocho apariciones.",
"En la novena aparición, la señora le pidió que bebiera y se lavara en una fuente que no existía; Bernadette escarbó el barro con las manos ante la burla de la gente, y brotó el manantial que todavía corre. En la decimosexta la señora le dijo su nombre en dialecto local: «Yo soy la Inmaculada Concepción».",
"Bernadette no sacó nada de aquello: entró en un convento en Nevers, pidió que la dejaran en paz y murió a los treinta y cinco años. Lourdes recibe hoy millones de peregrinos, muchos enfermos. Juan Pablo II instituyó en 1992 la Jornada Mundial del Enfermo en este día."],
f:["No te prometo ser feliz en este mundo, sino en el otro","Palabras que Bernadette atribuyó a la Señora"],
s:"Lourdes recuerda que el enfermo no es objeto de nuestra caridad sino sujeto de la Iglesia. Una pastoral de la salud que no escuche al enfermo todavía no ha empezado.",
o:"Nuestra Señora de Lourdes, que elegiste a una niña pobre para hablar: enséñanos a escuchar a los que nadie cree, y acompaña a los enfermos de nuestras casas."},

"San Juan de Dios":{d:"1495 – 1550 · Portugal y Granada",
v:["Juan Ciudad nació en Montemor-o-Novo, en Portugal, y a los ocho años desapareció de su casa con un clérigo de paso; su madre murió poco después. Fue pastor, soldado en las guerras del emperador, vendedor de libros. A los cuarenta y dos años, en Granada, escuchó predicar a san Juan de Ávila y la conmoción fue tal que lo encerraron por loco en el Hospital Real.",
"Lo que vio dentro de aquel hospital le cambió el rumbo definitivamente: a los enfermos mentales se les trataba a golpes. Al salir alquiló una casa, puso unas esteras y empezó a recoger de noche a los enfermos, a las prostitutas, a los mendigos que dormían en la calle, cargándolos él mismo a la espalda.",
"Nunca fundó formalmente una orden ni escribió una regla: solo pedía limosna por las calles gritando «¡hermanos, haced bien para vosotros mismos!». Sus compañeros, después de su muerte, se convirtieron en la Orden Hospitalaria. Murió a los cincuenta y cinco años, de pie y abrazado a un crucifijo. León XIII lo declaró patrono de los hospitales, de los enfermos y de quienes los cuidan."],
f:["Haced bien, hermanos, para vosotros mismos","Su pregón por las calles de Granada"],
s:"Inventó una manera de cuidar: separar a los enfermos según su mal, lavarlos, darles cama propia. Fue reforma de una estructura, no solo limosna. Patrono de la enfermería.",
o:"San Juan de Dios, que cargaste enfermos a la espalda: danos manos que no se asquen y un corazón que no mida a quién sirve."},

"San José":{d:"Siglo I · Nazaret",
v:["Los evangelios no le ponen en la boca una sola palabra. Lo que sabemos de él son decisiones. La primera: no denunciar a María cuando la ley le daba derecho a hacerlo, y asumir en silencio un hijo que no era suyo. La segunda: levantarse de noche y huir a Egipto, convertido en padre de familia refugiada en país extranjero.",
"Era «tekton», el artesano del pueblo: el que hacía puertas, yugos, arados y vigas. A Jesús lo llamaban «el hijo del carpintero», y Jesús aprendió de él un oficio antes que una doctrina. Durante treinta años, la vida del Hijo de Dios fue la vida de un taller en una aldea sin importancia.",
"Pío IX lo declaró patrono de la Iglesia universal en 1870. En 2020 el papa Francisco le dedicó la carta «Patris corde», donde lo llama padre en la sombra, padre de la ternura y padre del valor creativo."],
f:["",""],
s:"José es el patrono de los trabajadores porque santificó el trabajo manual desde dentro, sin discursos. Y es el patrono de los migrantes forzados: su familia huyó de una amenaza real.",
o:"San José, hombre justo y callado: enséñanos a trabajar sin ruido, a proteger a los que nos han sido confiados y a levantarnos de noche cuando haga falta."},

"Santo Toribio de Mogrovejo":{d:"1538 – 1606 · España y Perú",
v:["Era un jurista laico, presidente del tribunal de la Inquisición de Granada, cuando lo nombraron arzobispo de Lima sin que él lo pidiera ni fuera sacerdote. Recibió todas las órdenes en pocos meses y cruzó el Atlántico en 1581 para hacerse cargo de un territorio inmenso.",
"Hizo tres visitas pastorales a pie y a lomo de mula por la sierra y la costa, recorriendo decenas de miles de kilómetros en veinticinco años. Aprendió quechua para confesar sin intérprete. Donde encontraba abuso de encomenderos sobre los indígenas, lo denunciaba por escrito al rey, y por eso tuvo pleitos permanentes con las autoridades coloniales.",
"Convocó el Tercer Concilio Limense, que mandó imprimir el catecismo en quechua y aimara, la primera obra impresa de América del Sur. Confirmó a santa Rosa de Lima y a san Martín de Porres. Murió en Saña, de viaje, como había vivido."],
f:["El tiempo no es nuestro, y habremos de dar cuenta de él","Dicho recogido en su proceso de canonización"],
s:"Es el modelo del pastor que no gobierna desde el escritorio: visita, aprende la lengua del pueblo y se enfrenta al poder cuando el poder abusa. Patrono del episcopado latinoamericano.",
o:"Santo Toribio, caminante incansable: que nuestros pastores y nuestros comités conozcan el territorio con los pies y no solo con los informes."},

"San Óscar Romero":{d:"1917 – 1980 · El Salvador",
v:["Nació en Ciudad Barrios y fue aprendiz de carpintero antes de entrar al seminario. Durante casi toda su vida fue un sacerdote prudente y conservador, de confianza para la jerarquía. Cuando en 1977 lo nombraron arzobispo de San Salvador, los sectores poderosos respiraron tranquilos.",
"Tres semanas después asesinaron a su amigo, el jesuita Rutilio Grande, junto a un anciano y un muchacho que iban con él. Romero fue hasta el lugar, pasó la noche junto a los cuerpos y algo se le rompió por dentro. Desde entonces, cada domingo, su homilía se transmitía por radio y era lo más escuchado del país: leía uno por uno los nombres de los desaparecidos de la semana.",
"El 23 de marzo de 1980 pidió públicamente a los soldados que desobedecieran la orden de matar. Al día siguiente, mientras celebraba la Misa en la capilla del Hospital de la Divina Providencia, un tirador lo mató de un disparo al llegar al ofertorio. El papa Francisco lo canonizó en 2018."],
f:["En nombre de Dios, les suplico, les ruego, les ordeno: cese la represión","Homilía del 23 de marzo de 1980"],
s:"Romero muestra que la Doctrina Social no es neutral frente al atropello, y que denunciar tiene un costo. También muestra una conversión: nadie nace comprometido, se llega.",
o:"San Óscar Romero, pastor con olor a pueblo: danos tu valentía para nombrar la injusticia y tu ternura para acompañar a quien la sufre."},

"Santa Catalina de Siena":{d:"1347 – 1380 · Siena y Roma",
v:["Era la penúltima de veinticinco hermanos en la casa de un tintorero de Siena. Se negó a casarse, se cortó el pelo para que la dejaran en paz y a los dieciocho años entró como terciaria dominica: no monja de clausura, sino laica consagrada que vivía en su casa. Pasó tres años encerrada en un cuarto y después salió para no parar más.",
"Cuidó enfermos en el hospital de la Scala durante la peste, acompañó a condenados a muerte hasta el patíbulo y se metió a mediar en las guerras entre ciudades italianas. No sabía escribir de joven: dictaba. Se conservan casi cuatrocientas cartas suyas, dirigidas a reyes, papas, mercenarios y presos.",
"En 1376 fue a Aviñón y convenció al papa Gregorio XI de volver a Roma, después de setenta años de papado en Francia. Murió a los treinta y tres años, agotada. Pablo VI la declaró doctora de la Iglesia en 1970, una de las primeras mujeres en recibir ese título."],
f:["Si sois lo que debéis ser, prenderéis fuego a todo el mundo","Carta a Esteban Maconi"],
s:"Una mujer laica, joven y sin estudios formales que le habló de frente al poder de su tiempo. Es la respuesta a quien dice que en la Iglesia los laicos solo obedecen.",
o:"Santa Catalina, fuego y verdad: danos el coraje de decirle al poderoso lo que no quiere oír, y la humildad de servir al enfermo que nadie ve."},

"San José Obrero":{d:"Fiesta instituida en 1955",
v:["El 1 de mayo de 1955, ante una multitud de trabajadores reunidos en la plaza de San Pedro, Pío XII instituyó esta fiesta. La fecha no era casual: el 1 de mayo era ya la jornada internacional del trabajo, nacida de la lucha obrera. La Iglesia no quiso disputarla ni ignorarla, sino ponerle un rostro.",
"La fiesta afirma algo sencillo y enorme: que el trabajo manual no es castigo ni condena social, porque el Hijo de Dios se pasó treinta años en un taller. El Evangelio de Marcos conserva la pregunta escandalizada de los vecinos de Nazaret: «¿No es este el carpintero?».",
"Desde entonces, cada primero de mayo la Iglesia reza por los que trabajan, por los que buscan trabajo y por los que trabajan sin derechos. En muchas parroquias es el día en que se bendicen las herramientas de los oficios."],
f:["",""],
s:"La fiesta resume el capítulo del trabajo en la Doctrina Social: el trabajo es para la persona y no la persona para el trabajo, y el trabajo tiene prioridad sobre el capital.",
o:"San José Obrero, que ganaste el pan con las manos: bendice a quienes madrugan, a quienes no encuentran trabajo y a quienes trabajan sin que nadie los proteja."},

"San Felipe Neri":{d:"1515 – 1595 · Florencia y Roma",
v:["Llegó a Roma desde Florencia a los dieciocho años, sin plan y sin dinero, cuando la ciudad todavía estaba arruinada por el saqueo de 1527. Durante años vivió como laico, trabajando de tutor y pasando las noches en las catacumbas. Recorría las calles hablando con cualquiera, y su pregunta habitual era: «Bueno, hermanos, ¿cuándo empezamos a hacer el bien?».",
"Fundó una cofradía para cuidar a los peregrinos pobres y a los convalecientes que salían del hospital sin a dónde ir. Se ordenó tarde, a los treinta y seis años, y empezó a reunir en su cuarto a un grupo que rezaba, cantaba y conversaba: de ahí nació el Oratorio, y de las músicas que allí se cantaban, la palabra «oratorio» en la música.",
"Odiaba la solemnidad falsa. Se presentaba con media barba afeitada para que se rieran de él y curaba la vanidad de sus discípulos mandándolos a hacer ridículos por la calle. Lo llamaron el apóstol de Roma y el santo de la alegría."],
f:["Prefiero el paraíso","Respuesta suya recogida por sus discípulos"],
s:"Felipe Neri recuerda que un grupo parroquial que no se ríe y no canta no dura. La alegría no es adorno del servicio: es la señal de que el servicio es evangélico.",
o:"San Felipe Neri, santo del buen humor: líbranos de la tristeza disfrazada de seriedad y danos la alegría que atrae a los jóvenes."}

"San Antonio de Padua":{d:"1195 – 1231 · Lisboa y Padua",
v:["Fernando de Bulhões nació en Lisboa, hijo de una familia acomodada, y fue canónigo agustino y buen estudiante. Lo cambió todo el día en que vieron pasar por su convento los cuerpos de cinco franciscanos martirizados en Marruecos. Pidió el hábito franciscano, tomó el nombre de Antonio y se embarcó hacia África para correr la misma suerte.",
"No le salió nada como lo había planeado: enfermó gravemente, el barco de regreso se desvió por una tormenta y acabó en Sicilia, y durante un año vivió escondido en una ermita de Italia sin que nadie supiera quién era. Un día, por falta de predicador, le pidieron que improvisara unas palabras. Dejó a todos atónitos.",
"Pasó diez años predicando por el norte de Italia y el sur de Francia, en plazas, porque ninguna iglesia alcanzaba. Se enfrentó a los usureros de su tiempo y logró en Padua una ley que prohibía encarcelar a los deudores insolventes. Murió a los treinta y seis años. Fue canonizado once meses después, el proceso más rápido de la historia."],
f:["",""],
s:"La ley que consiguió en Padua a favor de los deudores es incidencia política en estado puro: no repartió limosnas a los endeudados, cambió la norma que los metía presos.",
o:"San Antonio, predicador del pueblo: que nuestras palabras sirvan para defender a alguien y no solo para quedar bien."},

"San Luis Gonzaga":{d:"1568 – 1591 · Lombardía y Roma",
v:["Era el primogénito del marqués de Castiglione y estaba destinado a heredar el marquesado y a servir en las cortes de Florencia, Mantua y Madrid. Desde muy joven quiso otra cosa. Tardó tres años en arrancarle a su padre el permiso para renunciar a la herencia en favor de su hermano y entrar en la Compañía de Jesús.",
"Estudiaba en Roma cuando en 1591 estalló una epidemia de peste. Los jesuitas abrieron un hospital y Luis salió a las calles a recoger enfermos y cargarlos él mismo. Sus superiores, preocupados, lo destinaron a una sala donde supuestamente no había contagio. Allí se infectó.",
"Murió a los veintitrés años, tres meses después, el 21 de junio. Es patrono de la juventud y, por la forma en que murió, también de quienes atienden a enfermos en epidemia."],
f:["",""],
s:"Renunció a una herencia entera. A los jóvenes de hoy no se les pide un marquesado, pero sí decidir qué lugar ocupa el éxito propio frente al servicio.",
o:"San Luis Gonzaga, joven que lo dejó todo: ayuda a los jóvenes de nuestras comunidades a no medir su vida por lo que acumulan."},

"San Pedro y San Pablo":{d:"Siglo I · Roma",
v:["Pedro era pescador en el lago de Galilea, casado, de hablar rudo y de respuestas rápidas. Negó a Jesús tres veces la noche del juicio y lloró. Pablo era Saulo de Tarso, fariseo instruido y perseguidor convencido: estuvo presente, guardando los mantos, cuando apedrearon a Esteban.",
"Los dos se encontraron con Cristo y los dos discutieron entre sí. El conflicto más importante de la Iglesia primitiva fue el suyo: si los paganos que se convertían debían cumplir la ley judía. Pablo se enfrentó a Pedro en Antioquía «cara a cara», y el asunto se resolvió reunidos en Jerusalén, hablando.",
"La tradición sitúa la muerte de ambos en Roma bajo Nerón: Pedro crucificado, Pablo decapitado por ser ciudadano romano. La Iglesia los celebra el mismo día, juntos, como las dos columnas."],
f:["",""],
s:"Dos hombres muy distintos que discutieron en público y siguieron siendo Iglesia. Un comité donde nadie discute no es un comité unido: es un comité donde alguien se está callando.",
o:"San Pedro y san Pablo: dennos la humildad de reconocer el error y la libertad de hablar claro entre hermanos."},

"San Pier Giorgio Frassati":{d:"1901 – 1925 · Turín",
v:["Era hijo del dueño y director de «La Stampa», el gran diario de Turín, y de una pintora. Tenía dinero, buenos amigos y una pasión por la montaña: escalaba los Alpes cada vez que podía y dejó escrito en una foto la frase «verso l’alto», hacia la cima.",
"Lo que su familia no sabía era en qué gastaba el tiempo y el dinero. Desde los diecisiete años pertenecía a las Conferencias de San Vicente de Paúl y subía a diario a las buhardillas de los barrios obreros de Turín a llevar medicinas, pagar alquileres y buscar trabajo. Regalaba el pasaje del tranvía y volvía corriendo a casa para no llegar tarde a la cena.",
"Enfermó de poliomielitis fulminante, contraída probablemente en una de aquellas casas. Murió en seis días, a los veinticuatro años. La familia esperaba un funeral de la alta sociedad turinesa; las calles se llenaron de miles de pobres que nadie conocía. Juan Pablo II lo llamó «el hombre de las ocho bienaventuranzas»."],
f:["Verso l’alto: hacia lo alto","Escrito de su puño en una fotografía de montaña"],
s:"Frassati es el patrono natural de un joven de Pastoral Social: militó en una organización concreta, visitó casas y no hizo de ello un espectáculo. Ni su padre lo sabía.",
o:"Beato Pier Giorgio, alegre y escalador: enséñanos a servir sin que se note y a subir alto sin dejar a nadie abajo."},

"San Benito":{d:"Hacia 480 – 547 · Italia",
v:["Nació en Nursia, en Umbría, y fue enviado a estudiar a Roma. El ambiente de la ciudad lo espantó y se marchó a vivir solo en una cueva de Subiaco, donde un monje le bajaba el pan con una cuerda. Pasó tres años así. Cuando lo descubrieron, empezaron a llegar discípulos.",
"Fundó doce pequeños monasterios y después, hacia el año 529, el de Montecasino. Allí escribió su Regla: setenta y tres capítulos breves, sin heroísmos, llenos de sentido común. Mide el vino, regula el sueño, manda que el abad escuche también al más joven de la comunidad y que a los huéspedes se los reciba como a Cristo.",
"Su fórmula, «ora et labora», puso el trabajo manual en el centro de la vida de hombres que en su mayoría eran nobles. Durante los siglos siguientes, los monasterios benedictinos desecaron pantanos, copiaron libros, alimentaron a los hambrientos y sostuvieron Europa. Pablo VI lo proclamó patrono de Europa en 1964."],
f:["Que a todos los huéspedes se los reciba como a Cristo","Regla de san Benito, capítulo 53"],
s:"Benito dignificó el trabajo manual mil cuatrocientos años antes de Laborem exercens, y organizó la hospitalidad como obligación de la comunidad y no como gesto de un alma generosa.",
o:"San Benito, hombre de orden y de paz: enséñanos a sostener lo que empezamos y a recibir al que llega como si fuera el Señor."},

"Nuestra Señora del Carmen":{d:"Devoción del siglo XIII",
v:["La devoción nace en el monte Carmelo, en Tierra Santa, donde el profeta Elías había desafiado a los sacerdotes de Baal y donde en el siglo XII se instalaron ermitaños cristianos. De ellos nació la orden del Carmen. La tradición sitúa el 16 de julio de 1251 la entrega del escapulario a san Simón Stock.",
"En Colombia, la Virgen del Carmen es la patrona de los conductores, de la Policía Nacional y de los mineros: de los oficios donde se sale de casa sin garantía de volver. Por eso su fiesta llena las calles de buses y camiones adornados y de bendiciones de vehículos a la salida de las parroquias.",
"Detrás de las flores y las cintas hay algo serio: la confianza de familias que trabajan en oficios de riesgo y que encomiendan a la Madre el regreso del que sale a trabajar."],
f:["",""],
s:"Su fiesta es una de las pocas ocasiones del año en que la parroquia entra en contacto natural con gremios enteros de trabajadores. Un COPPAS atento no la desaprovecha.",
o:"Virgen del Carmen, Madre del camino: cuida a los que conducen, a los que bajan a la mina y a los que trabajan lejos de su casa."},

"Santa María Magdalena":{d:"Siglo I · Galilea y Jerusalén",
v:["Los evangelios dicen que Jesús expulsó de ella siete demonios y que acompañaba al grupo desde Galilea, ayudando con sus propios bienes. Es decir: era una mujer con recursos propios que financiaba la misión, algo poco común en su tiempo.",
"Estuvo al pie de la cruz cuando casi todos los discípulos habían huido, y vio dónde ponían el cuerpo. El domingo fue al sepulcro cuando todavía estaba oscuro. Lo encontró abierto, corrió a avisar, volvió y se quedó llorando fuera. Lo confundió con el jardinero hasta que la llamó por su nombre.",
"Fue la primera testigo de la resurrección y la primera enviada a anunciarla a los apóstoles. Por eso la tradición la llama «apóstol de los apóstoles», título que el papa Francisco recuperó en 2016 al elevar su memoria a fiesta."],
f:["He visto al Señor","Juan 20,18"],
s:"El primer anuncio cristiano lo hizo una mujer a la que nadie creyó al principio. Es una advertencia permanente sobre a quién escuchamos y a quién no.",
o:"Santa María Magdalena, primera testigo: que sepamos reconocer al Señor cuando viene con cara desconocida, y creerle a quien nos trae su noticia."},

"Santiago Apóstol":{d:"Siglo I · Galilea",
v:["Era hijo de Zebedeo y hermano de Juan; los dos eran socios de Pedro en la pesca. Jesús los llamó «hijos del trueno» por el carácter que tenían: fueron ellos los que propusieron hacer bajar fuego del cielo sobre un pueblo samaritano que no los recibió, y los que pidieron los primeros puestos en el Reino.",
"Estuvo entre los tres que vieron la transfiguración y la agonía en Getsemaní. Fue el primero de los apóstoles en morir mártir: Herodes Agripa lo hizo decapitar en Jerusalén hacia el año 44, como consta en los Hechos de los Apóstoles.",
"Desde el siglo IX, su sepulcro en Compostela convirtió el noroeste de España en destino de una de las grandes peregrinaciones de la historia, que hoy sigue viva. La concha de vieira es su signo y el del peregrino."],
f:["",""],
s:"Pidió el primer puesto y terminó siendo el primero en morir. El servicio en la Iglesia se parece poco a lo que imaginamos cuando lo pedimos.",
o:"Santiago apóstol, peregrino: haz que nuestro camino tenga destino y que no dejemos atrás a los que caminan más despacio."},

"San Juan María Vianney":{d:"1786 – 1859 · Francia",
v:["Era hijo de campesinos y creció en plena Revolución Francesa, escondiéndose para asistir a misas clandestinas en graneros. Empezó a estudiar tardísimo y con enorme dificultad: no lograba con el latín y estuvo a punto de ser rechazado para el sacerdocio. Lo ordenaron casi por compasión y lo mandaron a Ars, una aldea de doscientos treinta habitantes donde ya nadie practicaba.",
"Trabajó allí cuarenta y un años. Visitó casa por casa, dio catequesis, fundó un hogar para niñas huérfanas y abandonadas al que llamó la Providencia, y se pasaba hasta dieciséis horas diarias en el confesionario. Dormía dos o tres horas y comía papas frías.",
"Al cabo de unos años llegaban a Ars más de veinte mil personas al año desde toda Francia, solo para confesarse con él. Intentó huir tres veces a un monasterio, y las tres lo trajeron de vuelta. Pío XI lo declaró patrono de los párrocos."],
f:["",""],
s:"El cura de Ars demuestra que no hace falta brillantez para transformar un lugar: hace falta quedarse. La constancia en un mismo territorio es lo que cambia una comunidad.",
o:"San Juan María Vianney, cura de aldea: sostén a los sacerdotes de nuestras parroquias rurales y danos a todos la paciencia de quedarnos."},

"Santa Clara de Asís":{d:"1194 – 1253 · Asís",
v:["Clara Offreduccio era hija de una familia noble de Asís y tenía dieciocho años cuando se escapó de su casa la noche del Domingo de Ramos de 1212. Francisco, que entonces era el escándalo del pueblo, le cortó el pelo en la Porciúncula. Su familia intentó sacarla por la fuerza; se agarró al altar y no la movieron.",
"Fundó la comunidad de San Damián y vivió allí cuarenta y dos años, casi siempre enferma. Peleó durante casi toda su vida con tres papas por una sola cosa: el «privilegio de la pobreza», el derecho de sus hermanas a no poseer absolutamente nada, ni siquiera en común. Se lo concedieron por escrito dos días antes de su muerte.",
"Escribió la primera regla monástica redactada por una mujer en la historia de la Iglesia. Cuando las tropas del emperador asediaron Asís, salió a la puerta del monasterio con la custodia en las manos y el asalto se detuvo. Por eso la pintan con ella."],
f:["",""],
s:"Clara no pidió poder: pidió que la dejaran ser pobre. Peleó cuarenta años por un derecho que a ojos del mundo era un absurdo, y lo consiguió por escrito.",
o:"Santa Clara, mujer de hierro y de silencio: danos tu firmeza para defender lo que de verdad importa y tu alegría en la pobreza."},

"San Maximiliano Kolbe":{d:"1894 – 1941 · Polonia",
v:["Fue un franciscano polaco emprendedor y moderno: fundó cerca de Varsovia la «Ciudad de la Inmaculada», con imprenta propia, y llegó a publicar una revista con más de setecientos mil ejemplares. Pasó seis años misionando en Japón, donde fundó un convento en Nagasaki que sobrevivió a la bomba atómica por estar al otro lado de la colina.",
"Cuando los nazis invadieron Polonia, el convento acogió a miles de refugiados, entre ellos unos dos mil judíos. La Gestapo lo arrestó en 1941 y lo llevó a Auschwitz, donde fue el prisionero 16670.",
"En julio de 1941 desapareció un preso de su barracón y el comandante escogió a diez hombres para morir de hambre en represalia. Uno de ellos, Franciszek Gajowniczek, gritó que tenía mujer e hijos. Kolbe dio un paso al frente y pidió ocupar su lugar. Lo aceptaron. Murió en el búnker del hambre dos semanas después. Gajowniczek sobrevivió a la guerra y asistió a su canonización en 1982."],
f:["",""],
s:"Dar la vida por otro es el límite extremo de la solidaridad, que la Doctrina Social define como la decisión firme de empeñarse por el bien del otro. Kolbe la llevó hasta el final.",
o:"San Maximiliano Kolbe, que diste un paso al frente: danos el valor de ponernos delante cuando alguien indefenso está a punto de ser aplastado."},

"Asunción de la Virgen María":{d:"Dogma proclamado en 1950",
v:["Pío XII definió el dogma el 1 de noviembre de 1950: María, terminado el curso de su vida terrena, fue llevada en cuerpo y alma a la gloria del cielo. Es la fiesta mariana más antigua de la que hay memoria en Oriente y en Occidente.",
"Lo que se celebra no es un privilegio aislado, sino un anticipo: lo que le pasó a María es lo que la fe espera para todos. El cuerpo humano, con su historia concreta de trabajo, de cansancio y de ternura, no es un estorbo que se deja atrás.",
"El evangelio del día es el Magníficat, donde María canta que Dios derriba a los poderosos de sus tronos y enaltece a los humildes, llena de bienes a los hambrientos y despide vacíos a los ricos."],
f:["Derribó a los poderosos de sus tronos y enalteció a los humildes","Lucas 1,52"],
s:"El Magníficat es el cántico social más antiguo de la Iglesia. Que lo rece una muchacha campesina de Galilea dice mucho sobre desde dónde habla el Evangelio.",
o:"Virgen asunta al cielo: que tu canto no se nos vuelva costumbre, y que creamos de verdad que los humildes serán enaltecidos."},

"San Alberto Hurtado":{d:"1901 – 1952 · Chile",
v:["Quedó huérfano de padre a los cuatro años y su madre tuvo que vender las tierras a bajo precio; vivieron de prestado en casas de parientes. Estudió con beca, se hizo abogado y después jesuita. Se doctoró en pedagogía en Lovaina.",
"De vuelta en Chile fue capellán de la Acción Católica juvenil y escribió un libro incómodo, «¿Es Chile un país católico?», donde mostraba con cifras la distancia entre una nación que se decía cristiana y la miseria de sus barrios. Le costó críticas duras y la salida del cargo.",
"Una noche de invierno de 1944 se encontró con un hombre enfermo y empapado que no tenía dónde dormir. De esa noche nació el Hogar de Cristo, que empezó con una casa y acabó siendo la mayor red de acogida del país. Fundó también la Acción Sindical Chilena para formar dirigentes obreros. Murió de cáncer a los cincuenta y un años. Fue canonizado en 2005."],
f:["El pobre es Cristo","Expresión repetida en sus escritos y predicaciones"],
s:"Hurtado unió las tres cosas que un COPPAS debe unir: acogida inmediata, formación de dirigentes y denuncia con datos. No eligió entre asistencia y transformación.",
o:"San Alberto Hurtado, que abriste la puerta una noche de lluvia: no nos dejes acostumbrarnos a pasar de largo."},

"Santa Rosa de Lima":{d:"1586 – 1617 · Lima",
v:["Isabel Flores de Oliva nació en Lima de familia empobrecida; su padre era un arcabucero español y su madre criolla. Trabajó desde niña bordando y cultivando flores para sostener la casa. Rechazó todos los pretendientes y se hizo terciaria dominica, viviendo en una pequeña ermita en el huerto de su casa.",
"En una habitación de esa misma casa atendía a los enfermos, a los ancianos y a los indígenas que nadie recibía en los hospitales de la ciudad. Esa habitación se considera el primer espacio de atención social organizada del Perú.",
"Murió a los treinta y un años. Su entierro fue tal multitud que hubo que aplazarlo. En 1671 fue la primera persona de América canonizada, y es patrona de América Latina, de Filipinas y de las Indias."],
f:["",""],
s:"Montó un lugar de cuidado en su propia casa para los que el sistema de salud de la colonia excluía. Hoy diríamos que detectó una barrera de acceso y la respondió con lo que tenía.",
o:"Santa Rosa de Lima, primera flor de América: enséñanos a empezar con lo poco que tenemos y en el lugar donde estamos."},

"San Agustín":{d:"354 – 430 · Norte de África",
v:["Nació en Tagaste, en la actual Argelia, de padre pagano y madre cristiana, santa Mónica. Fue un estudiante brillante y un joven desordenado: tuvo un hijo, Adeodato, con una mujer con la que vivió trece años y a la que la presión social lo obligó a dejar. Buscó la verdad en el maniqueísmo, en el escepticismo y en la filosofía.",
"Enseñando retórica en Milán escuchó predicar a san Ambrosio y algo empezó a ceder. Se bautizó en la Pascua de 387, a los treinta y dos años. Volvió a África y, casi a la fuerza, lo hicieron obispo de Hipona.",
"Gobernó aquella diócesis treinta y cuatro años: predicaba varias veces por semana, hacía de juez en los pleitos de la ciudad y gastó los bienes de la iglesia en rescatar esclavos. Escribió las «Confesiones» y «La ciudad de Dios». Murió mientras los vándalos sitiaban Hipona."],
f:["Nos hiciste para ti, y nuestro corazón está inquieto hasta que descanse en ti","Confesiones I, 1"],
s:"Agustín enseñó que una sociedad se define por lo que ama en común. Preguntar qué ama realmente nuestra comunidad es el comienzo de todo análisis de la realidad.",
o:"San Agustín, corazón inquieto: que nuestra búsqueda no se detenga en lo cómodo y que lo que amemos en común sea digno de personas."},

"San Gregorio Magno":{d:"Hacia 540 – 604 · Roma",
v:["Era prefecto de Roma, el cargo civil más alto de la ciudad, cuando lo dejó todo, convirtió la casa de su familia en monasterio y repartió sus bienes. Lo sacaron de allí para hacerlo diácono, embajador en Constantinopla y, en 590, papa, cargo que aceptó llorando.",
"Le tocó una Roma devastada por la peste, el hambre y las invasiones lombardas. Organizó el reparto de grano desde los graneros de la Iglesia con registros escritos de cada familia pobre de la ciudad, negoció personalmente con los lombardos la paz que el emperador no conseguía y rescató cautivos.",
"Escribió la «Regla pastoral», un manual para obispos que se leyó durante mil años, y envió a Agustín de Canterbury a evangelizar Inglaterra. Firmaba sus cartas como «siervo de los siervos de Dios», fórmula que los papas usan hasta hoy."],
f:["Cuando damos a los pobres lo necesario, no hacemos liberalidad: devolvemos lo suyo","Regla pastoral III, 21"],
s:"Esa frase sobre devolver lo suyo es una de las formulaciones más antiguas y más duras del destino universal de los bienes. Gregorio no habla de generosidad: habla de justicia.",
o:"San Gregorio Magno, siervo de los siervos: que organicemos la caridad con cuidado y que nunca llamemos regalo a lo que es deuda."}
});

Object.assign(SVIDA,{
"Santa Teresa de Calcuta":{d:"1910 – 1997 · Macedonia e India",
v:["Anjezë Gonxhe Bojaxhiu nació en Skopie, de familia albanesa. A los dieciocho años entró en las Hermanas de Loreto y la enviaron a Calcuta, donde durante casi veinte años fue profesora y después directora de un colegio para niñas de clase acomodada.",
"En un viaje en tren a Darjeeling, en 1946, tuvo lo que llamó «la llamada dentro de la llamada»: dejar el colegio e irse a vivir entre los más pobres. Tardó dos años en conseguir el permiso. Salió con cinco rupias, un sari blanco de borde azul comprado en el mercado y ninguna garantía.",
"Fundó las Misioneras de la Caridad en 1950 y la casa para moribundos de Kalighat, donde se recogía de la calle a quien iba a morir solo para que al menos muriera acompañado. La orden llegó a más de cuatro mil hermanas en todo el mundo. Después de su muerte se publicaron sus cartas: durante casi cincuenta años vivió una oscuridad interior en la que no sentía a Dios, y siguió trabajando igual."],
f:["No todos podemos hacer cosas grandes, pero sí cosas pequeñas con gran amor","Dicho recogido por sus hermanas"],
s:"Su crítica más citada no es a la pobreza material sino a la indiferencia: ser nadie para nadie. Esa soledad también existe en nuestros barrios y no se resuelve con un mercado.",
o:"Santa Teresa de Calcuta: danos ojos para ver al que está solo y manos que no tengan prisa."},

"San Pedro Claver":{d:"1580 – 1654 · Cataluña y Cartagena de Indias",
v:["Nació en Verdú, en Cataluña, y entró en la Compañía de Jesús. En Mallorca conoció al portero del colegio, el hermano Alonso Rodríguez, que le insistió una y otra vez en que se fuera a las Indias. Llegó a Cartagena en 1610, el principal puerto negrero de América del Sur: por allí entraban cada año miles de africanos esclavizados.",
"Hizo un voto que firmó de su puño: «Petrus Claver, aethiopum semper servus», Pedro Claver, esclavo de los negros para siempre. Cuando se avistaba un barco negrero bajaba al puerto con intérpretes africanos, pan, aguardiente, medicinas y tabaco, y entraba en las bodegas, donde nadie entraba por el olor y las enfermedades. Curaba, daba de comer y bautizaba.",
"Trabajó así treinta y ocho años y se calcula que atendió a más de trescientos mil personas. Denunció a los tratantes, visitó las cárceles y acompañó a los condenados a muerte. Pasó sus últimos cuatro años paralítico y abandonado en una celda, atendido con desprecio por un esclavo al que apenas daban de comer. León XIII lo declaró en 1896 patrono universal de las misiones entre los afrodescendientes."],
f:["Esclavo de los negros para siempre","Fórmula de su voto, firmada en Cartagena"],
s:"No pudo abolir la esclavitud, pero no se limitó a consolarla: se puso físicamente del lado de las víctimas y denunció a los responsables. Es nuestro santo, de nuestra costa.",
o:"San Pedro Claver, que bajaste a las bodegas de los barcos: danos valor para ir a donde nadie quiere entrar y para llamar a la injusticia por su nombre."},

"San Juan Crisóstomo":{d:"Hacia 349 – 407 · Antioquía y Constantinopla",
v:["Nació en Antioquía, estudió retórica con el mejor maestro pagano de su tiempo y pasó seis años como ermitaño, dos de ellos en una cueva, hasta que la salud se le arruinó para siempre. Ordenado sacerdote, predicó doce años en su ciudad y le pusieron el sobrenombre de Crisóstomo, «boca de oro».",
"En el año 397 lo llevaron casi a la fuerza a ser obispo de Constantinopla. Allí hizo lo que nadie esperaba: vendió los mármoles del palacio episcopal para construir hospitales, redujo su propia mesa a lo mínimo y mantuvo con los fondos de la Iglesia a miles de pobres de la ciudad. Y predicó contra el lujo de la corte sin bajar la voz.",
"La emperatriz Eudoxia no se lo perdonó. Fue depuesto y desterrado dos veces. Murió en el camino del segundo destierro, en el Ponto, agotado y enfermo, diciendo «gloria a Dios por todo»."],
f:["El pan que te sobra es el pan del hambriento","Homilía sobre Lázaro"],
s:"Los Padres de la Iglesia fueron mucho más duros sobre la propiedad que la mayoría de discursos actuales. Crisóstomo dice que no compartir es robar, y lo dijo en la capital del imperio.",
o:"San Juan Crisóstomo, boca de oro: danos palabras que no adulen al poderoso y manos que repartan lo que nos sobra."},

"San Vicente de Paúl":{d:"1581 – 1660 · Francia",
v:["Hijo de campesinos de las Landas, se hizo sacerdote joven buscando sobre todo un beneficio que le permitiera vivir sin estrecheces, cosa que él mismo reconoció después. Dos encuentros le cambiaron la vida: la confesión de un campesino moribundo en Folleville y el trabajo entre los galeotes, los condenados a remar encadenados en las galeras del rey.",
"Entendió que la caridad espontánea no bastaba y empezó a organizarla. Fundó las Cofradías de la Caridad, grupos de mujeres de cada parroquia que se repartían por turnos la visita a los enfermos. Con santa Luisa de Marillac fundó en 1633 a las Hijas de la Caridad, religiosas sin clausura: «por monasterio, las casas de los enfermos; por celda, un cuarto de alquiler; por clausura, la obediencia».",
"Organizó la recogida de niños expósitos que morían abandonados en las calles de París, el socorro masivo a las regiones arrasadas por la guerra y la reforma del clero rural. Murió a los setenta y nueve años. En 1833, Federico Ozanam y un grupo de estudiantes universitarios fundaron en su nombre las Conferencias de San Vicente de Paúl."],
f:["Amemos a Dios, hermanos míos, pero que sea con el esfuerzo de nuestros brazos","Conferencia a los misioneros"],
s:"Es el padre de la caridad organizada: turnos, registros, reparto de responsabilidades. Exactamente lo que un COPPAS intenta hacer. Sin organización, la caridad dura lo que dura el entusiasmo.",
o:"San Vicente de Paúl, organizador de la caridad: que nuestro servicio tenga método y nuestro método tenga corazón."},

"Santa Teresa del Niño Jesús":{d:"1873 – 1897 · Normandía",
v:["Teresa Martin era la menor de nueve hermanos, cuatro de los cuales murieron pequeños. Perdió a su madre a los cuatro años y fue una niña enfermiza y llorona. A los quince consiguió, pidiéndoselo al papa en una audiencia pública, el permiso para entrar en el Carmelo de Lisieux.",
"Vivió nueve años de clausura absoluta, sin salir, sin hacer nada que el mundo llamaría importante. Allí formuló lo que llamó su «caminito»: no hacen falta grandes obras, sino hacer las pequeñas con amor y confiar en Dios como un niño confía. Escribió por obediencia sus recuerdos, que después se publicaron como «Historia de un alma».",
"Murió de tuberculosis a los veinticuatro años, tras dieciocho meses de dolores muy duros y de oscuridad en la fe. Su libro se tradujo al mundo entero. Pío XI la hizo patrona de las misiones sin que hubiera salido jamás de su convento, y Juan Pablo II la declaró doctora de la Iglesia en 1997."],
f:["En el corazón de la Iglesia, mi madre, yo seré el amor","Manuscrito B"],
s:"Su caminito desarma la excusa más común en un grupo parroquial: «es que yo no puedo hacer nada grande». Nadie puede. Lo que se pide es lo pequeño, sostenido y con amor.",
o:"Santa Teresita, maestra del camino pequeño: que no despreciemos lo diminuto ni esperemos a poder hacer algo grande para empezar."},

"San Francisco de Asís":{d:"1181 – 1226 · Asís",
v:["Hijo de un rico comerciante de telas, fue el joven más festejado de Asís. Soñaba con ser caballero: se fue a la guerra contra Perugia, cayó prisionero un año y volvió enfermo y cambiado. Un día, cabalgando por la llanura, se encontró con un leproso. En lugar de huir, se bajó del caballo y lo abrazó. Él mismo contó después que eso fue el comienzo de todo.",
"Rompió con su padre en público, en la plaza, devolviéndole hasta la ropa que llevaba puesta. Empezó a vivir de limosna y a reparar iglesias en ruinas con sus propias manos. Pronto lo siguieron otros y nació la fraternidad: sin propiedades, trabajando con las manos y pidiendo solo cuando el trabajo no alcanzaba.",
"En 1219, en plena cruzada, cruzó las líneas y se presentó ante el sultán al-Malik al-Kamil en Egipto: fue a hablar, no a vencer. Al final de su vida, casi ciego, compuso el «Cántico de las criaturas», donde llama hermano al sol y hermana a la muerte. Juan Pablo II lo declaró patrono de los ecologistas en 1979, y de su cántico tomó el papa Francisco el título «Laudato si’»."],
f:["Laudato si’, mi’ Signore: alabado seas, mi Señor","Cántico de las criaturas"],
s:"De su cántico sale el nombre de la encíclica sobre la casa común. Francisco une las dos cosas que la ecología integral no separa: el abrazo al leproso y la alabanza por la creación.",
o:"San Francisco de Asís, hermano de los pobres y de las criaturas: haz de nosotros instrumentos de paz y quítanos el miedo a bajarnos del caballo."},

"Nuestra Señora del Rosario":{d:"Memoria desde 1573",
v:["La fiesta nació tras la batalla de Lepanto de 1571, cuando san Pío V atribuyó el resultado a la oración del rosario; al principio se llamó Santa María de la Victoria y después Nuestra Señora del Rosario. Con el tiempo la Iglesia desplazó el acento de la victoria militar a la oración misma.",
"El rosario es la oración popular por excelencia: se reza caminando, en el velorio, en la novena de difuntos, en el bus. No necesita libro, ni templo, ni quien lo dirija. En muchos pueblos de Antioquia ha sostenido la fe en los años en que no había sacerdote.",
"Juan Pablo II añadió en 2002 los misterios luminosos y llamó al rosario «oración contemplativa con el rostro de Cristo» en compañía de María."],
f:["",""],
s:"Es la forma de oración que ya existe en las casas de nuestras comunidades. Una pastoral que la desprecia por sencilla se corta de la espiritualidad real de la gente.",
o:"Nuestra Señora del Rosario: enséñanos a rezar con las manos ocupadas y a acompañar a los que rezan como aprendieron de sus abuelas."},

"San Carlo Acutis":{d:"1991 – 2006 · Londres y Milán",
v:["Nació en Londres de padres italianos y creció en Milán. Era un adolescente corriente: jugaba al fútbol, tenía perros y gatos, hacía bromas. Lo que no era corriente es que iba a Misa diaria por decisión propia desde los siete años, en una familia que entonces no practicaba. Su madre contó después que fue él quien la devolvió a la fe.",
"Se le daba muy bien la informática: aprendió solo a programar y a editar video. Con quince años montó una exposición en línea sobre los milagros eucarísticos del mundo, documentada país por país, que después recorrió miles de parroquias en los cinco continentes. También llevaba las páginas web de su parroquia y de la escuela.",
"Repartía comida y mantas a las personas sin hogar de Milán, compradas con su propio dinero, y defendía en el colegio a los compañeros a los que molestaban. En octubre de 2006 le diagnosticaron una leucemia fulminante; ofreció sus sufrimientos por el Papa y por la Iglesia y murió en tres días, a los quince años. Fue canonizado en 2025."],
f:["Todos nacen originales, pero muchos mueren como fotocopias","Anotación suya, citada en su proceso"],
s:"Carlo usó la herramienta de su generación para evangelizar y, al mismo tiempo, bajaba a la calle a llevar mantas. Lo digital no lo sacó del mundo real: lo puso a servir en él.",
o:"San Carlo Acutis, joven de nuestro tiempo: que usemos las pantallas para acercar y no para escondernos, y que no acabemos siendo fotocopias."},

"Santa Teresa de Ávila":{d:"1515 – 1582 · Castilla",
v:["Teresa de Cepeda y Ahumada entró en el Carmelo de la Encarnación de Ávila a los veinte años y pasó allí casi veinte más sin demasiada hondura, en un convento grande y relajado donde las monjas recibían visitas y salían con frecuencia. Una enfermedad larguísima y después una conversión profunda hacia los cuarenta años lo cambiaron todo.",
"Decidió fundar conventos pequeños, pobres y de clausura verdadera. Fundó diecisiete en veinte años, viajando por los caminos de Castilla en carreta, enferma, discutiendo con obispos, alquilando casas y negociando con los vecinos que se oponían. La Inquisición le abrió proceso y le requisaron escritos.",
"Escribió el «Libro de la vida», «Camino de perfección» y «Las moradas», cumbres de la literatura española. Tenía un humor filoso: pedía a Dios que la librara de los santos de cara larga. Pablo VI la proclamó en 1970 la primera mujer doctora de la Iglesia."],
f:["Entre los pucheros anda el Señor","Libro de las fundaciones"],
s:"Mujer fundadora, administradora y escritora en un tiempo que no se lo permitía. Y una espiritualidad que no se evade: Dios está también en la cocina y en el trabajo de cada día.",
o:"Santa Teresa de Ávila, andariega y determinada: danos oración honda y pies en la tierra, y líbranos de la tristeza beata."},

"Santa Laura Montoya":{d:"1874 – 1949 · Jericó y Medellín, Antioquia",
v:["Nació en Jericó, Antioquia. Tenía dos años cuando mataron a su padre en la guerra civil y la familia quedó en la ruina; la repartieron entre parientes y creció sabiendo lo que es depender de la caridad ajena. Se hizo maestra rural para sostener a su madre y a sus hermanos, y enseñó durante años en pueblos de Antioquia.",
"Le dolía que a los indígenas se los tuviera por incapaces de fe y de letras. En 1914, con cuatro compañeras y su propia madre, se internó en la selva de Dabeiba, en el occidente antioqueño, para vivir entre los embera: no para traerlos al pueblo, sino para quedarse con ellos. Fue muy criticada: una mujer no debía hacer eso, y menos con indígenas.",
"De allí nació la congregación de las Misioneras de María Inmaculada y Santa Catalina de Siena, las «lauritas», hoy presentes en una veintena de países. Pasó los últimos nueve años en silla de ruedas, escribiendo. Murió en Medellín y el papa Francisco la canonizó en 2013: fue la primera santa colombiana."],
f:["",""],
s:"Laura es de aquí, de Antioquia. Hizo inculturación y defensa de los pueblos indígenas un siglo antes de que la Iglesia usara esas palabras, y lo hizo siendo mujer, laica de origen y pobre.",
o:"Santa Laura Montoya, maestra antioqueña: enséñanos a ir hacia el que está lejos sin pedirle que deje de ser quien es."},

"San Juan Pablo II":{d:"1920 – 2005 · Polonia y Roma",
v:["Karol Wojtyła nació en Wadowice. Perdió a su madre a los ocho años, a su hermano a los doce y a su padre a los veinte: a esa edad estaba solo en el mundo. Durante la ocupación nazi trabajó en una cantera y en una fábrica química, y estudió teología en un seminario clandestino mientras actuaba en un teatro también clandestino.",
"Obispo y después arzobispo de Cracovia bajo el régimen comunista, participó en el Concilio Vaticano II. En 1978 fue elegido papa: el primero no italiano en cuatro siglos y medio. Hizo ciento cuatro viajes internacionales, visitó Colombia en 1986 y pidió perdón públicamente por los pecados históricos de los cristianos.",
"Escribió tres grandes encíclicas sociales: «Laborem exercens» sobre el trabajo, «Sollicitudo rei socialis» sobre el desarrollo y las estructuras de pecado, y «Centesimus annus» en el centenario de Rerum novarum. Sobrevivió a un atentado en 1981 y fue a la cárcel a perdonar a quien le disparó. Murió en 2005 y fue canonizado en 2014."],
f:["El trabajo es para el hombre y no el hombre para el trabajo","Laborem exercens, 6"],
s:"Es el papa que más desarrolló la Doctrina Social contemporánea: el trabajo antes que el capital, la solidaridad como virtud y las estructuras de pecado como realidad que hay que cambiar.",
o:"San Juan Pablo II, que no tuviste miedo: sostén a los jóvenes que quieren cambiar su realidad y danos tu capacidad de perdonar."},

"Todos los Santos":{d:"Solemnidad desde el siglo IX",
v:["La fiesta se consolidó en el siglo IX cuando Gregorio IV fijó el 1 de noviembre para celebrar a todos los santos, conocidos y desconocidos. Antes se celebraba a los mártires, cuyos nombres sí se recordaban; esta fiesta ensanchó la memoria a todos los demás.",
"El evangelio del día son las bienaventuranzas. La lista de los felices según Jesús no coincide con ninguna lista de éxito: los pobres de espíritu, los que lloran, los mansos, los que tienen hambre de justicia, los misericordiosos, los que trabajan por la paz, los perseguidos.",
"La fiesta afirma que la mayoría de los santos no están en el calendario: son las abuelas que criaron solas, los catequistas de vereda, los que cuidaron a un enfermo durante años sin que nadie lo supiera."],
f:["Dichosos los que trabajan por la paz, porque serán llamados hijos de Dios","Mateo 5,9"],
s:"Las bienaventuranzas son el programa de la Pastoral Social antes que cualquier documento. Todo lo demás son consecuencias de esta lista.",
o:"Señor, por todos los santos sin nombre que han sostenido la fe de nuestras familias: haznos de los suyos."},

"San Martín de Porres":{d:"1579 – 1639 · Lima",
v:["Hijo de un noble español y de Ana Velázquez, una mujer negra liberta de Panamá. Su padre no lo reconoció durante años y la partida de bautismo lo registró como «hijo de padre desconocido». Creció pobre, en un Lima donde la ley le cerraba casi todas las puertas por ser mulato.",
"Aprendió el oficio de barbero, que entonces incluía sangrar, curar heridas y atender enfermos. A los quince años pidió entrar con los dominicos, pero la ley del convento no admitía como religiosos a los mulatos: lo aceptaron como «donado», el escalón más bajo, para barrer y hacer la limpieza. Él firmaba como «el mulato perro». Nueve años después, el prior rompió la norma y le permitió profesar.",
"Atendió a miles de enfermos en la enfermería del convento y en la calle sin preguntar quién era nadie. Fundó junto con otros un asilo para niñas huérfanas, recogió animales abandonados y repartió cada semana comida a cientos de pobres de Lima. Fue canonizado en 1962 y Juan XXIII lo propuso como signo contra el racismo."],
f:["",""],
s:"Sufrió en carne propia una estructura excluyente y no se amargó ni se resignó: sirvió desde abajo hasta que la estructura cedió. Patrono contra el racismo y de la justicia social.",
o:"San Martín de Porres, hermano escoba: enséñanos a servir sin buscar lugar y a no cerrarle a nadie la puerta que a ti te cerraron."},

"San Carlos Borromeo":{d:"1538 – 1584 · Milán",
v:["Sobrino del papa Pío IV, fue nombrado cardenal a los veintidós años y colmado de cargos y rentas: el típico eclesiástico de carrera del Renacimiento. La muerte repentina de su hermano mayor lo sacudió. Se ordenó sacerdote, renunció a las rentas y pidió ir a su diócesis de Milán, cosa que casi ningún obispo hacía entonces.",
"Fue el gran motor de la aplicación del Concilio de Trento. Fundó seminarios para que los sacerdotes se formaran, visitó una por una las parroquias de los valles alpinos y creó escuelas de catequesis dominical para niños que llegaron a tener cuarenta mil alumnos.",
"Durante la peste de 1576, las autoridades civiles y buena parte de la nobleza huyeron de Milán. Él se quedó. Vendió la plata y los tapices del arzobispado para alimentar a los apestados, organizó hospitales de campaña y recorrió a pie las calles llevando el viático. Murió a los cuarenta y seis años, agotado."],
f:["",""],
s:"Se quedó cuando los que mandaban se fueron, y vendió los bienes de la Iglesia para comprar comida. Es el criterio para toda institución eclesial en una emergencia.",
o:"San Carlos Borromeo: que nuestra Iglesia se quede donde otros se van y que sus bienes sirvan a quien tiene hambre."},

"San Martín de Tours":{d:"316 – 397 · Panonia y Galia",
v:["Hijo de un oficial del ejército romano, fue inscrito por obligación en la caballería imperial a los quince años. Siendo todavía catecúmeno, una noche de invierno a las puertas de Amiens se encontró con un mendigo desnudo que temblaba de frío. No llevaba dinero: sacó la espada, partió su capa militar en dos y le dio la mitad. Aquella noche soñó con Cristo vestido con media capa.",
"Pidió la baja del ejército diciendo que era soldado de Cristo y que no le era lícito combatir, y estuvo preso por ello. Se hizo monje y fundó en Ligugé la primera comunidad monástica de la Galia.",
"Lo hicieron obispo de Tours con una estratagema, porque él se negaba: lo sacaron de casa con el pretexto de visitar a un enfermo. Siguió viviendo como monje en una celda fuera de la ciudad. Recorrió los campos predicando y se enfrentó al emperador Máximo para que no ejecutara a unos herejes: fue de las primeras voces cristianas contra la pena de muerte por motivos religiosos."],
f:["",""],
s:"La mitad de la capa es la imagen clásica de la caridad, pero conviene mirar el detalle: partió lo suyo, no lo que le sobraba, y lo hizo a la intemperie, sin testigos.",
o:"San Martín de Tours, que partiste tu capa: danos la libertad de dar lo que estamos usando y no solo lo que ya no nos sirve."},

"Santa Francisca Javier Cabrini":{d:"1850 – 1917 · Lombardía y Estados Unidos",
v:["Nació en Sant’Angelo Lodigiano, la menor de trece hermanos, y fue una niña enfermiza a la que dos congregaciones rechazaron por su salud. Se hizo maestra, fundó por su cuenta las Misioneras del Sagrado Corazón y pidió al papa León XIII ir a misionar a China. El papa le respondió: «no a Oriente, sino a Occidente».",
"Fue a Nueva York en 1889, donde los migrantes italianos vivían hacinados, trabajaban en condiciones brutales y eran despreciados. Al llegar, el arzobispo le dijo que se volviera porque no había casa ni dinero. No se volvió.",
"En veintiocho años cruzó el océano veinticuatro veces y fundó sesenta y siete instituciones: escuelas, orfanatos y hospitales en Estados Unidos, Argentina, Brasil, Nicaragua y varios países de Europa. Murió sola en Chicago, preparando regalos de Navidad para niños pobres. Fue la primera ciudadana estadounidense canonizada y es patrona de los migrantes."],
f:["",""],
s:"Trabajó con migrantes despreciados en el país que los necesitaba y los maltrataba. Es exactamente el escenario de la migración venezolana y del desplazamiento interno en Colombia.",
o:"Santa Francisca Cabrini, madre de los migrantes: cuida a los que llegan a nuestros pueblos sin nada y danos una casa abierta."},

"Santa Isabel de Hungría":{d:"1207 – 1231 · Hungría y Turingia",
v:["Hija del rey de Hungría, fue prometida a los cuatro años al heredero de Turingia y criada en el castillo de Wartburg, en Alemania. Contra lo que suele pasar en estos matrimonios, quiso de verdad a su marido, Luis, y tuvieron tres hijos. Él la apoyaba cuando la corte se escandalizaba por su manera de tratar a los pobres.",
"En la hambruna de 1226, mientras Luis estaba de viaje, Isabel abrió los graneros del castillo y repartió el grano, y mandó construir un hospital a los pies de la colina, al que bajaba a diario a atender enfermos con sus manos. La corte la acusó de dilapidar el patrimonio.",
"Luis murió de peste camino de la cruzada cuando ella tenía veinte años. Sus cuñados la expulsaron del castillo con sus hijos en pleno invierno. Se refugió en Marburgo, se hizo terciaria franciscana, renunció a todo y pasó sus últimos años atendiendo enfermos en el hospital que ella misma fundó. Murió a los veinticuatro años y fue canonizada cuatro años después."],
f:["",""],
s:"Tenía poder y lo usó para abrir los graneros, no para administrar su imagen. Patrona de Cáritas y de las obras de caridad en muchos países.",
o:"Santa Isabel de Hungría: que quien tenga algo en la mano lo abra a tiempo, y que la caridad no nos cueste solo lo que nos sobra."},

"San Francisco Javier":{d:"1506 – 1552 · Navarra y Oriente",
v:["Nació en el castillo de Javier, en Navarra, de familia noble arruinada tras la conquista del reino. Estudiaba en París, soñando con una carrera brillante, cuando compartió habitación con un vasco cojo y mayor que él, Ignacio de Loyola, que durante años le repitió la misma pregunta: de qué le sirve al hombre ganar el mundo entero si pierde su alma. Acabó cediendo. Fue uno de los siete primeros jesuitas.",
"Lo enviaron a la India en 1541 con treinta y cinco años. Trabajó en Goa, entre los pescadores de perlas de la costa de Pesquería, en Malaca, en las Molucas y en Japón, donde fue el primer misionero cristiano. Aprendía las lenguas a trompicones, hacía catecismos en verso para que los niños los cantaran y escribió cartas furiosas a Europa denunciando el maltrato de los colonos portugueses a los pueblos que decían evangelizar.",
"Murió a los cuarenta y seis años en la isla de Sancián, frente a la costa china, esperando una barca que lo llevara a un país que tenía prohibida la entrada a extranjeros. Es patrono de las misiones junto con santa Teresita."],
f:["",""],
s:"Denunció a los suyos. Un misionero que calla los abusos de quienes lo protegen hace daño; Javier escribió al rey de Portugal para decírselo.",
o:"San Francisco Javier: danos hambre de ir más lejos y honradez para denunciar el mal que hacen los nuestros."},

"San Ambrosio":{d:"Hacia 340 – 397 · Milán",
v:["Era gobernador romano del norte de Italia, no estaba bautizado y solo fue a la basílica de Milán a poner orden en la pelea entre facciones por el nombramiento del nuevo obispo. Según la tradición, un niño gritó su nombre y la multitud lo eligió allí mismo. En una semana fue bautizado, ordenado y consagrado obispo.",
"Repartió sus bienes entre los pobres y mandó fundir los vasos sagrados de la iglesia para rescatar prisioneros de guerra, decisión que le criticaron y que él defendió por escrito: la Iglesia tiene oro para gastarlo en los pobres, no para guardarlo. Escribió tratados sobre los deberes, sobre Nabot y sobre Tobías, con páginas durísimas contra la usura y el acaparamiento de tierras.",
"En el año 390, el emperador Teodosio ordenó la matanza de miles de habitantes de Tesalónica en represalia por un motín. Ambrosio le negó la comunión y le exigió penitencia pública. El emperador cedió. Fue también quien bautizó a san Agustín."],
f:["No das de lo tuyo al pobre: le devuelves lo suyo","Tratado sobre Nabot"],
s:"Dos cosas: vendió los bienes sagrados para liberar cautivos, y le puso límites al poder político. La Iglesia tiene autoridad moral cuando está libre del poder al que debe corregir.",
o:"San Ambrosio: que los bienes de la Iglesia sirvan a los pobres y que nunca nos falte la voz para decirle no al poderoso."},

"Inmaculada Concepción":{d:"Dogma proclamado en 1854",
v:["Pío IX definió el dogma el 8 de diciembre de 1854: María fue preservada del pecado original desde el primer instante de su concepción, por los méritos de Cristo. Cuatro años después, en Lourdes, Bernadette oyó de la Señora exactamente ese nombre.",
"La fiesta afirma que la gracia de Dios llega antes que nuestro esfuerzo. No es María quien se hace digna: es Dios quien se adelanta. Eso vale también para cada persona que acompañamos.",
"En Colombia la víspera es la Noche de las Velitas: el 7 de diciembre las familias ponen velas y faroles en puertas, andenes y ventanas, y con eso empieza la Navidad. Es una de las pocas fiestas que todavía saca a los vecinos a la calle a la misma hora."],
f:["",""],
s:"La Noche de las Velitas es una oportunidad pastoral enorme: el barrio entero está afuera. Es el momento del año en que es más fácil encontrarse con los vecinos que nunca entran a la iglesia.",
o:"Virgen Inmaculada: que la luz que encendemos en la puerta nos empuje a conocer a quien vive en la casa de al lado."},

"San Juan Diego":{d:"1474 – 1548 · México",
v:["Cuauhtlatoatzin, «águila que habla», era un indígena chichimeca de Cuautitlán, campesino y tejedor de esteras. Tenía unos cincuenta años y llevaba poco tiempo bautizado cuando, en diciembre de 1531, camino de la catequesis, oyó que lo llamaban en náhuatl, su lengua, en el cerro del Tepeyac.",
"La Señora le pidió que fuera a decirle al obispo que quería un templo allí. Juan Diego respondió lo que un indígena de su tiempo tenía aprendido: que él era un don nadie, «un cordelillo, una escalerilla de tablas», y que mandara a alguien de respeto. Ella insistió en que lo quería a él.",
"Fue al obispado dos veces y lo hicieron esperar. A la tercera llevó en la tilma las flores que había cortado en un cerro pelado en pleno invierno. Al soltarlas apareció la imagen. Juan Diego pasó el resto de su vida en una pequeña habitación junto a la ermita, atendiendo a los peregrinos. Fue canonizado en 2002."],
f:["",""],
s:"La Señora eligió como mensajero al que la sociedad consideraba nadie, y el obispo tuvo que escucharlo. Es la primera lección de la opción por los pobres en América.",
o:"San Juan Diego, el de la tilma: que creamos a los que se presentan diciendo que no son nadie, porque suelen traer el recado."},

"Nuestra Señora de Guadalupe":{d:"1531 · México",
v:["Las apariciones del Tepeyac ocurrieron diez años después de la caída de Tenochtitlan, en un territorio arrasado, donde los pueblos indígenas habían perdido templos, dioses y dignidad, y la evangelización avanzaba con enorme dificultad.",
"La imagen habla en el lenguaje visual de los pueblos originarios: el cinturón alto que indica embarazo, el sol detrás y la luna bajo los pies, las estrellas del manto, la flor de cuatro pétalos sobre el vientre que para los nahuas significaba el centro del universo. Y tiene el rostro mestizo. Por eso se la entendió como una madre que no venía con los conquistadores sino con los conquistados.",
"Juan Pablo II la declaró patrona de América y de Filipinas, y el 12 de diciembre es fiesta en todo el continente. En la Conferencia de Aparecida se la recuerda como la imagen del rostro mestizo de la Iglesia latinoamericana."],
f:["¿No estoy yo aquí, que soy tu madre?","Palabras del relato del Nican Mopohua"],
s:"Guadalupe es la primera inculturación del Evangelio en América: Dios habla en la lengua y en los símbolos del pueblo, no en los del que manda.",
o:"Virgen de Guadalupe, madre mestiza: no dejes que la Iglesia hable un idioma que nuestra gente no entiende."},

"San Juan de la Cruz":{d:"1542 – 1591 · Castilla y Andalucía",
v:["Juan de Yepes nació muy pobre en Fontiveros; su padre murió cuando él era niño y su madre, tejedora, anduvo de pueblo en pueblo buscando trabajo. De muchacho trabajó en el hospital de bubas de Medina del Campo, con enfermos de sífilis, mientras estudiaba de noche.",
"Carmelita y sacerdote, conoció a santa Teresa de Ávila, que lo convenció de llevar la reforma a los frailes. Aquello le costó caro: sus propios hermanos de orden lo secuestraron en 1577 y lo encerraron nueve meses en una celda de Toledo de dos metros por tres, donde lo azotaban en público cada semana. Allí, sin papel, compuso de memoria el «Cántico espiritual».",
"Se fugó descolgándose por una ventana con tiras de sábana. Escribió «Noche oscura», «Subida al monte Carmelo» y «Llama de amor viva», la cumbre de la poesía mística en castellano. Murió a los cuarenta y nueve años, apartado y enfermo. Es doctor de la Iglesia."],
f:["A la tarde te examinarán en el amor","Dichos de luz y amor"],
s:"La noche oscura da nombre a algo que los agentes de pastoral conocen: seguir sirviendo cuando no se siente nada. Y recuerda que el examen final no será de resultados, sino de amor.",
o:"San Juan de la Cruz: cuando no sintamos nada y todo esté oscuro, sostennos en el amor callado."},

"San Esteban":{d:"Siglo I · Jerusalén",
v:["Los Hechos de los Apóstoles cuentan que la comunidad de Jerusalén tuvo su primer conflicto interno: las viudas de los creyentes de lengua griega quedaban desatendidas en el reparto diario de alimentos frente a las de lengua hebrea. Los apóstoles convocaron a la asamblea y eligieron a siete hombres para ese servicio. El primero de la lista era Esteban.",
"Es decir: el primer mártir cristiano era un encargado del servicio a las viudas pobres, lo que hoy llamaríamos un agente de pastoral social. Y predicaba. Su discurso ante el Sanedrín, el más largo del libro de los Hechos, le costó la vida.",
"Lo sacaron de la ciudad y lo apedrearon. Mientras moría pidió perdón para los que lo mataban. Entre los que guardaban los mantos de los verdugos estaba un joven llamado Saulo, que años después sería san Pablo. Su fiesta se celebra el 26 de diciembre, al día siguiente de Navidad."],
f:["Señor, no les tengas en cuenta este pecado","Hechos 7,60"],
s:"El primer mártir salió de la pastoral social de la primera comunidad. Servir las mesas y anunciar el Evangelio nunca fueron dos cosas distintas.",
o:"San Esteban, primer mártir y servidor de las mesas: que nuestro servicio tenga la valentía de hablar y la libertad de perdonar."}

 let b=null,bd=9999;for(const s of SANTOS){const sk=s[0]*100+s[1];const df=sk>=k?sk-k:sk+1200-k;if(df<bd){bd=df;b=s}}return[b,false]}

const reflexHoy=()=>REFLEX[diaDelAno()%REFLEX.length];

function cicloM(){const c=[210,178],R=118,M=METODO,K=['find','scale','people','compass','sun'],P={find:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'};const pt=i=>{const a=-Math.PI/2+i*2*Math.PI/5;return [c[0]+R*Math.cos(a),c[1]+R*Math.sin(a)]};
 return `<div class="diag"><svg viewBox="0 0 420 350" role="img" aria-label="Ciclo: Ver, Juzgar, Actuar, Revisar y Celebrar"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker></defs>${M.map((_,i)=>{const a=-Math.PI/2+(i+.26)*2*Math.PI/5,b=-Math.PI/2+(i+.74)*2*Math.PI/5,x1=c[0]+R*Math.cos(a),y1=c[1]+R*Math.sin(a),x2=c[0]+R*Math.cos(b),y2=c[1]+R*Math.sin(b);return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#ah)"/>`}).join('')}${M.map((m,i)=>{const[x,y]=pt(i);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="40" fill="var(--pine)"/><g transform="translate(${(x-10).toFixed(1)} ${(y-25).toFixed(1)}) scale(.84)" fill="none" stroke="#e7c078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[K[i]]||EMB[K[i]]}</g><text x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="600" fill="#f3efe1" font-family="Source Sans 3,sans-serif">${m[0]}</text>`}).join('')}<g transform="translate(192 150) scale(1.5)" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${EMB.heart}</g><text x="210" y="208" text-anchor="middle" font-size="13" fill="var(--soft)" font-family="Source Sans 3,sans-serif">desde el Evangelio</text></svg></div>`}

 (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(done):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()})}

const SYN={plata:'dinero',sueldo:'salario',patron:'empresa',jefe:'empresa',guerrilla:'violencia',paramilitares:'violencia',ambiente:'ecologia',medioambiente:'ecologia',venezolano:'migrante',venezolanos:'migrantes',extranjero:'migrante',curas:'sacerdote',cura:'sacerdote',ia:'inteligencia',rico:'riqueza',ricos:'riqueza',votar:'voto',politico:'politica',comunista:'comunismo',socialista:'comunismo',pobre:'pobres'};
const toks=s=>norm(s).split(/[^a-zñ0-9]+/).filter(w=>w.length>1&&!STOP.has(w));
const same=(a,b)=>{const n=Math.max(4,Math.min(a.length,b.length)-2);return a===b||(a.length>=4&&b.length>=4&&a.slice(0,n)===b.slice(0,n))};
const IDX=DUDAS.map(d=>({d,h:toks(d[0]+' '+(d[4]||'')),b:toks(d[1])}));
const FIDX=FL.map(f=>({f,h:toks(f.t+' '+f.q+' '+f.k),b:toks(f.b.join(' '))}));
function matchDudas(q){let T=toks(q);T=[...new Set(T.flatMap(w=>SYN[w]?[w,SYN[w]]:[w]))];if(!T.length)return{d:[],f:[]};
 const N=IDX.length,idf={};T.forEach(w=>{const df=IDX.filter(e=>e.h.some(x=>same(w,x))).length;idf[w]=Math.log(1+N/(1+df))/Math.log(1+N)});
 const sc=e=>{let s=0,hits=0;T.forEach(w=>{const a=e.h.some(x=>same(w,x)),b=e.b.some(x=>same(w,x));if(a){s+=2+4*idf[w];hits++}else if(b){s+=idf[w];hits++}});return s+(hits/T.length)*2};
 const rank=(A,min)=>A.map(e=>[sc(e),e]).filter(x=>x[0]>=min).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
 return{d:rank(IDX,4).slice(0,5).map(e=>e.d),f:rank(FIDX,4).slice(0,3).map(e=>e.f)}}

}
