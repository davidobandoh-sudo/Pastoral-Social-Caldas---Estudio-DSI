C({n:7,t:"Bienestar y justicia para todos: la economía",r:"158–194",s:"Mercado, empresa, dinero y pobreza: ni capitalismo salvaje ni colectivismo.",
intro:"La Iglesia mira la economía con simpatía crítica. Le interesa la prosperidad, siempre que alcance para todos y que el dinero sirva en lugar de gobernar.",
or:"Jesús pobre, tú multiplicaste el pan compartido. Líbranos de la avaricia y de la indiferencia; enséñanos a producir, comprar y repartir como hermanos. Amén.",
din:"Rastrea tu camiseta. Cada uno mira dónde se hizo su ropa o su café y reconstruye quién intervino y quién se quedó con cuánto. Se lee Lc 16,19-31. ¿Dónde están hoy Lázaro y el rico en esta cadena? ¿Qué compra podría cambiar?",
cp:{c:"Revisa tus gastos del mes: ¿qué dicen de lo que amas?",s:"Compra esta semana directamente a un productor local.",t:"Apoyen o creen un fondo solidario o cooperativa juvenil en la parroquia."},
f:[
["Economía y ética","¿La economía tiene que ver con la moral?","Tiene leyes propias, pero está sometida a la dignidad humana.",["La economía organiza la producción, reparto y consumo de bienes escasos. Funciona según sus propias reglas y, aun así, depende de personas que deciden.","Tu resumen lo pone en orden: la política fija sus fines y la ética orienta a la política. Si se invierte, aparece el economicismo. La Iglesia solo se vuelve crítica cuando la economía se absolutiza."],"158–160, 162","CiV 36-37; EG 53-60"],
["El bienestar no es malo","¿Es inmoral la riqueza?","La prosperidad es buena cuando sirve al desarrollo de todos.",["Aumentar el bienestar es un alto fin ético, si está orientado al desarrollo solidario. Dedicarse a los negocios puede ser una verdadera vocación.","La riqueza se vuelve peligrosa cuando se convierte en ídolo o aísla. Quien la disfruta está llamado a compartir. El empresario honesto aporta creatividad y empleo."],"161, 163, 166","Lc 12,13-21; Vocación del líder empresarial; LS 129"],
["La pobreza y el cristiano","¿Qué hacer ante la pobreza?","Reconocer a Cristo en el pobre, ayudar hoy y cambiar lo que la produce.",["Las personas deben esforzarse por salir de la pobreza, y también trabajar en común para vencer las estructuras que la perpetúan. El cristiano reconoce a Cristo en el más pobre.","Asistencia y transformación se necesitan. Nuestra Pastoral Social lo expresa así: cuidar, servir y transformar. El asistencialismo se queda en el segundo verbo y no llega al tercero."],"168–169","Mt 25,31-46; EG 186-216; DT (2025)"],
["¿Capitalismo? Depende","¿Es compatible el capitalismo con la dignidad?","Sí a la empresa, al mercado y a la creatividad; no a una libertad económica sin marco jurídico y ético.",["San Juan Pablo II distingue: si por capitalismo se entiende una economía que reconoce la empresa, el mercado, la propiedad y la creatividad, la respuesta es afirmativa. Si es un sistema donde la libertad económica no se encuadra en un marco que la ponga al servicio de la persona, es negativa.","No existe un modelo económico cristiano: la Iglesia no compite entre modelos técnicos. Francisco denunció con dureza una economía de exclusión que mata."],"171–172, 174","CA 42; EG 53; FT 168"],
["Mercado libre y sus límites","¿Es bueno el mercado libre?","Es instrumento eficaz, incapaz por sí solo de satisfacer necesidades de quien no puede pagar.",["El mercado permite intercambiar y coordinar libremente. La competencia es sana cuando es un esfuerzo por ser mejor y dañina cuando busca destruir al otro.","Muchos no pueden entrar al mercado porque no tienen nada que ofrecer o comprar. La justicia exige cubrir sus necesidades básicas. Tu resumen explica que oferta y demanda deben complementarse con reciprocidad en los intercambios."],"177–179","CA 34, 40; CiV 35-37"],
["Globalización económica y Estado","¿Qué papel tiene el Estado en la economía?","Crear el marco, garantizar reglas y ayudar según subsidiaridad.",["La globalización trajo oportunidades y nuevas desigualdades, sin un marco ético adecuado. El Estado debe fijar reglas y brindar ayuda para que cada uno pueda ayudarse a sí mismo.","También cumplen un papel las organizaciones sin ánimo de lucro, las cooperativas, fundaciones y clubes: la llamada economía civil, en la que encaja bien la economía solidaria."],"180–183","CiV 38-41; CA 48"],
["Finanzas, corrupción y confianza","¿Cuáles son los pecados de la economía?","La mentira, el fraude y la especulación que olvida a las personas destruyen el verdadero capital: la confianza.",["Sin confianza la economía no funciona. El engaño y la corrupción no son fallos menores: tienen víctimas reales.","Los bancos y mercados financieros prestan un servicio importante cuando se ordenan al bien común. La especulación que se desliga de la economía real y del bien común debe ser regulada."],"190–191","CiV 65; Oeconomicae et pecuniariae quaestiones (2018)"]
],
q:[
["La Iglesia afirma que:",["Existe un modelo económico cristiano","No existe un modelo económico cristiano","Solo el socialismo es válido","El mercado es intrínsecamente malo"],1,"La Iglesia orienta con principios y no compite entre modelos técnicos."],
["Según CA 42, el capitalismo es aceptable si:",["No hay impuestos","Reconoce empresa y mercado dentro de un marco jurídico y ético al servicio de la persona","Lo manejan cristianos","Busca máxima utilidad"],1,"La libertad económica debe estar encuadrada."],
["El mayor capital que destruyen el fraude y la mentira es:",["El bursátil","La confianza","La maquinaria","El crédito"],1,"Sin confianza, la economía no funciona."],
["Economicismo significa:",["Ahorrar mucho","Poner la economía por encima de la política y la ética","Estudiar economía","Crear cooperativas"],1,"Invierte el orden: la economía se absolutiza."],
["¿Cuál expresa bien la DSI ante la pobreza?",["Solo limosna","Solo cambio político","Ayuda inmediata y transformación de estructuras","Esperar el progreso"],2,"Se necesitan ambas cosas."]
]});
C({n:8,t:"Poder y moral: la comunidad política",r:"195–228",s:"Democracia, autoridad, conciencia y cómo participar siendo cristiano.",
intro:"La política, en sentido amplio, es la preocupación por el bien común, y por tanto concierne a todos. Este capítulo explica para qué existe el poder y cuáles son sus límites.",
or:"Señor, que reinas lavando pies: limpia nuestra política de engaño y de odio. Danos valentía para servir y humildad para escuchar al que piensa distinto. Amén.",
din:"El concejo de jóvenes. Simulen una sesión del Concejo sobre un tema real del municipio. Algunos son concejales, otros líderes comunales, otros periodistas. Al final, evalúen: ¿quién habló por los que no tenían voz? ¿Hubo servicio o solo disputa?",
cp:{c:"Ora por quienes gobiernan tu municipio, incluso aquellos con quienes no estás de acuerdo.",s:"Infórmate de cómo participar en la Junta de Acción Comunal o el Consejo de Juventud.",t:"Presenten una propuesta concreta a la Alcaldía o al Consejo Municipal de Juventud."},
f:[
["Para qué existe la comunidad política","¿La política es necesaria?","El Estado existe para la persona y la sociedad civil, nunca al revés.",["La comunidad política regula lo público. Para el cristiano, la persona y la sociedad civil van primero, pero no se puede vivir sin Estado: su función es subsidiaria y hace posible un orden.","Tu resumen distingue política en sentido amplio (preocupación por el bien común, que nos toca a todos) y en sentido estricto (lucha por el poder)."],"195–199","GS 74; CDSI 384-392"],
["El poder como servicio","¿Cómo reinó Jesús?","Jesús no buscó el trono: lavó pies y entregó la vida.",["Jesús rechazó el camino de los zelotes y no se dejó usar políticamente. Israel esperaba un soberano y encontró al siervo. La cruz no fue un fracaso, porque allí venció el amor.","De ahí nace el criterio para quien gobierna: quien sirve al bien común no busca primero su provecho. Y la autoridad se legitima por servir, siempre sujeta a la ley moral."],"207–210, 216–217","Mc 10,42-45; Jn 13; Rm 13"],
["Democracia: valor y límites","¿Es todo lo democrático bueno?","Es el orden que mejor protege los derechos, y las mayorías tampoco pueden decidirlo todo.",["La Iglesia la favorece sin idealizarla. El cristianismo aportó a su raíz la dignidad igual de cada persona.","Una democracia sin valores se convierte, advirtió san Juan Pablo II, en un totalitarismo visible o encubierto. Ninguna mayoría puede disponer de la vida, la libertad o la dignidad. La Iglesia también apoya la división de poderes y el Estado de derecho."],"204–205, 213, 220–223","CA 46; EV 70; PT 68"],
["Conciencia y objeción","¿Quién tiene la última palabra: Estado o conciencia?","No obliga moralmente una ley contraria a la dignidad humana.",["La última instancia vinculante es la conciencia bien formada. Ningún orden jurídico puede imponer que se participe en algo gravemente inmoral, y la objeción de conciencia es legítima.","Tu resumen enumera formas de resistencia ante leyes injustas: pasiva, activa pacífica y, como caso extremo, rebelión. El Magisterio prefiere siempre la vía activa no violenta."],"206, 218","Hch 5,29; GS 16; CCC 2242-2243; CA 23"],
["Ser político y cristiano","¿Puede un cristiano dedicarse a la política?","Es un honor, y también un lugar donde no todo se puede negociar.",["La política es el arte de lo posible y a menudo exige acuerdos. No se debe condenar a un político cristiano por ello.","Hay límites: no puede disponer de los valores esenciales de la persona. Francisco habla de la mejor política y de la caridad política. Un cristiano sí puede militar en un partido cuyas posiciones no comparte del todo, formando su conciencia y sin renunciar a lo esencial."],"219, 319","GS 75; CfL 42; FT 154-197"],
["Partidos e información","¿Qué se exige a partidos y medios?","Los partidos deben servir a la participación; sin información veraz no hay democracia real.",["Los partidos organizan la opinión y la participación, y solo cumplen su tarea si tienen transparencia interna y están orientados al bien común.","Cuando el poder dirige la información, o los medios se concentran, la democracia se debilita. Hoy esto incluye desinformación y algoritmos."],"211–212","CDSI 413-416; FT 42-50; MH 25"],
["Iglesia y Estado laico","¿Cómo deben relacionarse?","Autonomía y colaboración: laicidad, sí; laicismo que excluye la fe, no.",["La Iglesia ya no se presenta como aliada política del Estado: es parte de la sociedad civil y pide libertad para enseñar, celebrar y servir.","Aprueba una laicidad que distinga competencias y coopere. Y critica el laicismo, que quiere expulsar la religión de la vida pública. La libertad religiosa es un derecho de toda persona."],"214, 224–225","GS 76; DH 2"],
["Amistad civil, ley y castigo","¿Basta la ley para convivir? ¿Cómo tratar al delincuente?","Sin amistad social la justicia es fría; el castigo debe buscar restaurar.",["Ninguna sociedad vive solo de normas: necesita solidaridad activa, lo que santo Tomás llamaba amistad civil y hoy Francisco llama amistad social.","El delincuente sigue siendo persona. Las penas no deben degradar y se orientan a la rehabilitación. Actualización necesaria: desde 2018, el Catecismo enseña que la pena de muerte es inadmisible (CCC 2267), posterior a la edición del DOCAT."],"226–228","FT 94, 263-270; CCC 2267"]
],
q:[
["La política en sentido amplio es:",["La lucha por cargos","La preocupación por el bien común","Lo que hacen los partidos","Solo votar"],1,"Por eso todos tenemos parte en ella."],
["Para la DSI, las mayorías democráticas:",["Pueden decidirlo todo","No pueden disponer de los valores esenciales de la persona","No tienen valor","Dependen de la Iglesia"],1,"La democracia necesita fundamento ético (CA 46)."],
["La objeción de conciencia es:",["Una rebeldía ilegítima","Legítima ante órdenes gravemente inmorales","Solo para militares","Solo para sacerdotes"],1,"La conciencia va más allá del poder político."],
["Según el Catecismo actual (2267), la pena de muerte es:",["Admisible","Admisible en casos raros","Inadmisible","Asunto de cada Estado"],2,"Redacción aprobada en 2018 por el papa Francisco."],
["Laicidad y laicismo se diferencian en que:",["Son iguales","La laicidad distingue y coopera; el laicismo excluye la fe de lo público","El laicismo es lo que enseña la Iglesia","La laicidad exige Estado confesional"],1,"La Iglesia aprecia la laicidad positiva."]
]});
C({n:9,t:"Un mundo, una humanidad: la comunidad internacional",r:"229–255",s:"Globalización, migración, comercio justo y una sola familia humana.",
intro:"Lo que ocurre en un país afecta a otro. Este capítulo extiende la mirada: somos una sola familia y la solidaridad no puede detenerse en la frontera.",
or:"Dios de todos los pueblos, tú no tienes extranjeros. Abre nuestras fronteras interiores para acoger, proteger, promover e integrar a quien llega herido. Amén.",
din:"Mochila del migrante. Cada joven tiene un minuto para escribir las cinco cosas que se llevaría si debiera salir hoy de su casa para siempre. Compartan y escuchen, si es posible, el testimonio de una persona migrante o desplazada. ¿Quién les abrió la puerta? ¿Quién se la cerró?",
cp:{c:"Reza por un país en guerra que hayas olvidado.",s:"Acoge a una persona migrante o desplazada de tu comunidad.",t:"Prefieran productos de comercio justo y promuevan una jornada de información."},
f:[
["Globalización, no destino","¿Podemos influir en la globalización?","No es fatalidad: la construyen seres humanos y debe orientarse moralmente.",["El mundo se volvió casi una sola casa gracias a la técnica. Esa interconexión no reparte sus beneficios por igual: algunos quedan cada vez más atrás.","Por ser obra humana, se puede estructurar con criterios morales. El desafío es globalizar la solidaridad antes que la indiferencia."],"229–231","CiV 42; PP 43; EG 54"],
["Una sola familia humana","¿Qué nos une a todos los pueblos?","Un mismo Creador, una misma dignidad, un destino común.",["La Biblia nos presenta a la humanidad como unidad. Las diferencias de pueblos son riqueza y no razón de jerarquía.","De esta unidad se deriva el destino universal de los bienes y la opción por los pobres a escala mundial. Fratelli tutti pide una fraternidad abierta, que reconoce y ama a cada persona más allá de la proximidad física."],"235–239","Gn 1–11; Hch 17,26; FT 1, 95-100"],
["Cooperación internacional","¿Cómo se organiza la solidaridad mundial?","Hacen falta instituciones comunes, confianza y reglas compartidas.",["Hay problemas que ningún país resuelve solo. Se necesitan organizaciones cooperativas que administren bienes comunes, con confianza y unos mínimos morales.","La Iglesia ha pedido una autoridad política mundial eficaz que respete la subsidiaridad. La ONU es limitada, aunque indispensable. Los derechos humanos deben ser su base."],"234, 240–244","PT 137; CiV 67; FT 170-175"],
["Santa Sede y política internacional","¿Por qué el Vaticano participa en la política mundial?","Por su presencia global y su independencia para defender la paz y la dignidad.",["La Santa Sede es sujeto de derecho internacional y tiene relaciones diplomáticas con muchos países, para servir a la paz, la libertad religiosa y los derechos humanos.","No compite por territorios ni intereses económicos. Por eso puede servir de mediadora."],"247, 279–283","GS 89; Discurso de Pablo VI a la ONU (1965)"],
["Migraciones","¿Qué pide la Iglesia ante las migraciones?","Acoger, proteger, promover e integrar: la persona va antes que la frontera.",["Se migra por miseria, persecución, violencia o falta de libertad. El DOCAT aborda sobre todo a Europa, pero en Colombia y América Latina el tema es inmediato: desplazamiento interno y migración venezolana.","La Iglesia se compromete especialmente con los más vulnerables. Los Estados tienen derecho a regular, pero sin vulnerar la dignidad de quien llega."],"248–250","Mt 25,35; EMCC; FT 129-132; Mensaje JMMR 2018"],
["Comercio justo","¿Qué tiene que ver mi compra con el mundo?","Comprar es un acto moral: cada mercado puede ser más humano.",["Los mercados han ayudado a algunos y agravado problemas en otros. El comercio justo busca precios dignos, condiciones decentes y relaciones estables con productores pobres.","No resuelve todo, pero muestra que es posible hacerlo de otro modo. Para zonas cafeteras tiene especial sentido."],"251–253","CiV 66; LS 206"]
],
q:[
["Según el DOCAT, la globalización:",["Es un destino inevitable","Es obra humana y puede orientarse moralmente","Es mala en sí","Solo afecta a Europa"],1,"Por ser obra humana, se puede estructurar con criterio moral."],
["Los cuatro verbos del papa Francisco para los migrantes son:",["Ver, juzgar, actuar, revisar","Acoger, proteger, promover, integrar","Cuidar, servir, transformar, celebrar","Registrar, ubicar, emplear, devolver"],1,"Mensaje para la Jornada del Migrante y Refugiado de 2018."],
["La fraternidad que propone Fratelli tutti es:",["Solo entre católicos","Abierta, más allá de la proximidad física","Nacionalista","Solo emocional"],1,"FT 1."],
["El comercio justo busca:",["Vender más barato","Relaciones comerciales más solidarias y dignas","Eliminar el mercado","Productos de lujo"],1,"DOCAT 252."],
["La opción por los pobres a escala global se fundamenta en:",["La riqueza de la Iglesia","La mirada de Cristo y la unidad de la familia humana","Un acuerdo de la ONU","El libre mercado"],1,"DOCAT 238."]
]});
C({n:10,t:"Preservar la creación: el medio ambiente",r:"256–269",s:"La casa común, la ecología integral y la sostenibilidad.",
intro:"El grito de la tierra y el grito de los pobres son uno. Con Laudato si’ la Iglesia propone una ecología integral que abarca ambiente, economía, cultura y vida cotidiana.",
or:"Altísimo y buen Señor, gracias por el agua, las montañas y el café de nuestras laderas. Enséñanos a cuidar la casa común y a quienes más sufren su deterioro. Amén.",
din:"Mapa de la quebrada. Dibujen el cauce de agua de su municipio con lo que entra en él y quién depende de ella. Lean LS 139 y LS 49. ¿Qué crisis ambiental es también crisis social aquí? ¿Quién ya trabaja en ello?",
cp:{c:"Haz una caminata en silencio por la naturaleza, dando gracias.",s:"Participen en una jornada de limpieza o siembra con una organización local.",t:"Hagan seguimiento a un conflicto ambiental de su territorio y reúnan información veraz."},
f:[
["Una vocación ecológica","¿La ecología es tema de especialistas?","Cuidar la creación es parte de la vocación cristiana.",["San Juan Pablo II habló de la vocación ecológica de cada cristiano. No se trata solo de llamar a otros a la moral, sino de transformar la propia vida.","La Iglesia no tiene competencia técnica específica, pero aporta una visión sobre el valor de la creación, del ser humano y de los pobres."],"256–259","Gn 2,15; LS 62-64, 217"],
["Dominio o custodia","¿Qué significa «dominad la tierra»?","Se nos encargó cuidar y cultivar, sin explotación despótica.",["La naturaleza es un orden abierto, que el ser humano puede desarrollar. Laudato si’ rechaza la interpretación del «dominio» como permiso para destruir.","Cada criatura tiene valor propio, y el ser humano tiene una responsabilidad única. Evita tanto el antropocentrismo despótico como la igualación de todo ser viviente con la persona."],"257","Gn 1,28; Gn 2,15; LS 66-69, 90"],
["Ecología integral","¿Qué significa ecología integral?","No hay dos crisis, sino una sola y compleja crisis socioambiental.",["Todo está conectado. Las soluciones deben combatir la pobreza, devolver la dignidad a los excluidos y cuidar la naturaleza al mismo tiempo.","Incluye dimensiones ambiental, económica, social, cultural y de la vida cotidiana. Los pobres son quienes más sufren el daño ambiental."],"260–261","LS 137-162; LS 139; LS 49"],
["Justicia entre generaciones","¿Le estamos robando el futuro a nuestros hijos?","La tierra que recibimos pertenece también a quienes vendrán.",["Las decisiones de hoy limitan la vida de mañana. Sin un giro solidario el problema solo aumenta.","Laudato si’ plantea la pregunta directa: ¿qué mundo queremos dejar? Y Laudate Deum (2023) advierte que la respuesta internacional a la crisis climática sigue siendo insuficiente."],"262","LS 159-160; LD (2023)"],
["Sostenibilidad y los principios","¿Cómo se relaciona la sostenibilidad con la DSI?","Se entiende con los mismos principios: persona, solidaridad y subsidiaridad.",["La persona sigue en el centro; la sostenibilidad requiere solidaridad cercana y mundial; y la subsidiaridad evita imponer desde arriba lo que las comunidades pueden realizar.","La fe advierte además contra convertir la sostenibilidad en una ideología impuesta a la fuerza."],"263–267","LS 196; CDSI 451-487"],
["Vivir bien con menos","¿Cómo se concreta esto en la vida?","Sobriedad feliz: menos consumo y más vínculos.",["Vivir dentro de los límites de la naturaleza no consiste en aumentar sin fin mercancías y velocidad. Laudato si’ propone una sobriedad vivida con libertad y gozo.","¿Dónde está Dios en la crisis? Junto a quien sufre las consecuencias: el campesino sin agua, el migrante climático, el habitante de los barrios olvidados."],"268–269","LS 222-225; LS 203-208"]
],
q:[
["Según LS 139, hay:",["Dos crisis separadas","Una sola crisis socioambiental","Solo una crisis técnica","Ninguna crisis real"],1,"Lo ambiental y lo social están unidos."],
["«Cultivar y cuidar» (Gn 2,15) indica:",["Dominio absoluto","Relación de custodia responsable","Prohibición de trabajar la tierra","Tarea solo de agricultores"],1,"LS 67."],
["¿Quién sufre más el deterioro ambiental, según Laudato si’?",["Las empresas","Los pobres","Los gobernantes","Los científicos"],1,"LS 48-49."],
["¿Qué documento de 2023 retoma la crisis climática?",["Laudate Deum","Dilexi te","Dignitas infinita","Evangelii gaudium"],0,"Exhortación del papa Francisco de octubre de 2023."],
["La ecología integral incluye:",["Solo la conservación de bosques","Lo ambiental, económico, social, cultural y cotidiano","Solo el reciclaje","Únicamente política internacional"],1,"LS capítulo IV."]
]});
C({n:11,t:"Vivir en libertad y sin violencia: la paz",r:"270–304",s:"La paz como obra de justicia, perdón y responsabilidad.",
intro:"En tierras golpeadas por el conflicto armado, este capítulo no es teoría. La paz es don de Dios y trabajo diario; empieza dentro y se juega en las instituciones.",
or:"Jesús, paz nuestra: desarma nuestras palabras y nuestras manos. Consuela a las víctimas, convierte a los violentos y haznos artesanos de reconciliación. Amén.",
din:"El árbol de la violencia. Dibujen un árbol: frutos (hechos violentos del territorio), tronco (lo que los sostiene) y raíces (causas). Al lado, un segundo árbol de paz. Lean Mt 5,9 y PP 76. ¿Qué raíz podríamos tocar los jóvenes este año?",
cp:{c:"Pide la gracia de perdonar a alguien concreto, aunque sea el primer paso.",s:"Escucha a una víctima o a un firmante de paz, sin juzgar.",t:"Promuevan un espacio de diálogo entre jóvenes de veredas o barrios distantes."},
f:[
["Paz, don de Dios y compromiso","¿Qué es la paz?","Mucho más que ausencia de guerra: fruto del orden justo y del amor.",["Definirla como silencio de armas o equilibrio de fuerzas es insuficiente. Es obra de la justicia y efecto de la caridad. Pablo VI añadió que el desarrollo es su nuevo nombre.","Jesús es nuestra paz, y la suya no se difunde sola: el ser humano la acoge o la rechaza. Es tarea de todos, creyentes o no."],"270–275","Is 32,17; Ef 2,14; GS 78; PP 76; PT"],
["La paz empieza adentro","¿Por dónde empieza un cristiano a construir paz?","En el corazón reconciliado, la oración y el perdón.",["La paz no comienza en una mesa de negociación. Empieza en algunas personas y desde ahí se expande. Se apoya en la oración, la Palabra y la reconciliación.","El perdón no niega la justicia ni olvida a la víctima. Rompe la cadena del odio. Fratelli tutti distingue perdón y olvido, y reclama memoria."],"274, 276–277","Mt 5,9; Mt 18,21-22; FT 225-254"],
["Iglesia, diplomacia y ONU","¿Qué hace la Iglesia por la paz?","Ora, educa, media y defiende el derecho internacional.",["La oración tiene fuerza para cambiar el mundo y alimenta el compromiso. Además, la Santa Sede actúa en foros internacionales y apoya la Carta de las Naciones Unidas, que prohíbe el recurso a la fuerza salvo casos definidos.","En Colombia, la Iglesia ha acompañado procesos de diálogo y a las comunidades víctimas del conflicto armado."],"278–283","GS 83-90; PT 145"],
["La guerra: el mayor fracaso","¿Cómo ve la Iglesia la guerra?","La guerra no resuelve problemas: siempre es derrota de la humanidad.",["La Iglesia condena la crueldad de la guerra. Sus causas son el odio, las ideologías, las ansias de poder y riqueza, y también la injusticia. Prevenirla implica atacar esas raíces.","Fratelli tutti se pregunta si hoy, con armas tan destructivas, se puede seguir aplicando la teoría de la guerra justa. Las sanciones deben evitar el daño a la población civil."],"284–288","GS 77-82; CCC 2307-2317; FT 256-262"],
["Legítima defensa y sus límites","¿Puede un país defenderse con armas?","Solo con condiciones estrictas y respetando siempre a los civiles.",["La agresión es inmoral y el agredido tiene derecho y deber de defenderse. El Catecismo exige condiciones: daño duradero, grave y cierto; agotamiento de otros medios; posibilidades serias de éxito; y que no se generen males mayores.","Aun entonces no todo vale. Los soldados deben rechazar órdenes contra el derecho internacional. Las víctimas y las minorías deben ser protegidas, y ante un genocidio la comunidad internacional tiene el deber de actuar."],"289–294","CCC 2309; GS 79; FT 258"],
["Armas, terrorismo y ciencia","¿Qué dice la Iglesia sobre armas y terrorismo?","Armas de destrucción masiva, nunca; y matar en nombre de Dios es blasfemia.",["La Iglesia pide un desarme general, equilibrado y controlado, rechaza la lógica de disuasión nuclear y exige prohibir armas indiscriminadas como las minas antipersona, realidad bien conocida en Colombia.","Ninguna opresión justifica el terrorismo. Para combatirlo hay que abordar sus causas sin violar derechos. La ciencia también debe evaluar sus efectos: Magnifica humanitas advierte sobre el uso militar de la IA."],"295–304","PT 112; FT 262; MH"]
],

C({n:12,t:"El compromiso personal y colectivo: practicar la caridad",r:"305–328",s:"Del papel a la calle: lo que me toca a mí.",
intro:"Todo lo anterior culmina en una pregunta: ¿qué vas a hacer? Francisco soñó con una generación que fuera «Doctrina Social con pies». Aquí se concreta.",
or:"Señor, tú dijiste: «Rema mar adentro». Aquí estoy con mis miedos y mi poco. Lo que soy también puede servir: tómalo y envíame. Amén.",
din:"Dejar la orilla (adaptada de la Guía de estudio). Con Lc 5,4-11, grupos preparan un sociodrama sobre: las orillas que nos retienen; cuándo dejarlas; qué se encuentra mar adentro; y qué herramientas necesitamos para pescar. Cierra un llamado a que cada uno nombre una orilla y dé un paso.",
cp:{c:"Busca a alguien que te acompañe espiritualmente.",s:"Escoge una tarea estable (no un evento) en la Pastoral Social.",t:"Formulen en grupo un proyecto con Ver, Juzgar, Actuar, Revisar y Celebrar."},
f:[
["Una vocación de todos los bautizados","¿A quién le toca el compromiso social?","A todo bautizado: es parte de seguir a Jesús, no un extra.",["Por el bautismo y la confirmación todos somos enviados. Los laicos tienen como tarea propia transformar las realidades temporales desde dentro.","Jesús encarnó los cuatro principios: dio dignidad a cada persona, buscó el bien de todos, despertó responsabilidad y se hizo solidario hasta el final. Seguirlo implica imitar eso."],"305–311","LG 31; AA 7; CfL 15; EG 120"],
["Dios antes que la acción","¿Por qué no basta con hacer cosas?","Sin raíz en Cristo, la acción social se seca o se vuelve activismo.",["El Estado puede transferir dinero, pero no sustituye la visita al enfermo, la hospitalidad, la cercanía al preso. El dinero solo no crea humanidad.","Los cristianos comprometidos también necesitan quien cuide su alma. Los agentes de pastoral se desgastan, por lo que requieren oración, acompañamiento y comunidad. Lo que de verdad traemos, dice el DOCAT, es a Jesucristo."],"312, 314–315","DCE 31; EG 262; Mt 25,36"],
["No estar solo, tener brújula","¿Cómo sostener el compromiso?","En comunidad, con la Escritura, los sacramentos y el Magisterio como brújula.",["Quien se compromete corre peligro de quedarse aislado. Necesita amigos en la fe y grupos que le sostengan. Y una brújula: la Biblia, la Tradición, el Catecismo y los documentos sociales.","La Iglesia debe salir a las periferias, sin cerrarse en sí misma, y a la vez es casa a la que se vuelve."],"313, 316–317","Hch 2,42-47; EG 20-24"],
["La doctrina y el espíritu de la época","¿Cambia la Iglesia su doctrina según las modas?","Lo esencial no se somete a votación; su comprensión y aplicación sí se desarrollan.",["Las verdades de fe no dependen de mayorías. A la vez, la doctrina se profundiza con el tiempo, y la DSI en particular se actualiza ante realidades nuevas.","El cambio del Catecismo sobre pena de muerte fue explicado como desarrollo coherente de la doctrina."],"318","DV 8; Carta CDF sobre CCC 2267 (2018)"],
["Partidos, asociaciones y protestas","¿Dónde puedo comprometerme?","En cualquier lugar compatible con la dignidad humana, sin esconder la fe.",["Se puede participar en partidos y organizaciones no cristianas, sin encerrarse en un gueto. Hay profesiones y actividades incompatibles con la visión cristiana del ser humano.","Los cristianos pueden y a veces deben salir a la calle pacíficamente, y no solo por sus propios intereses. Los encuentros juveniles fortalecen la fe y la cultura del encuentro."],"319–323","GS 75; EG 183; CV 143, 168-174"],
["Criticar a la Iglesia con amor","¿Puede un católico criticar a la Iglesia?","Sí, si nace del amor y busca su conversión.",["Santa Catalina de Siena, san Francisco y san Bernardo dirigieron críticas desde la fidelidad. La crítica que busca ayudar es legítima; la que solo descalifica no construye.","El compromiso social también une a cristianos de diversas confesiones: es un camino concreto de ecumenismo."],"324–328","Mt 18,15; UR 12; EG 26-27"],
["Doctrina Social con pies","¿Cuál es el sueño final?","Una generación entera que encarne la Doctrina Social.",["En el prólogo del DOCAT, Francisco dice que más que grupos que discutan bajo los árboles, sueña con un millón de jóvenes, o una generación, que sean la Doctrina Social con pies.","Tu Línea lo dice con tres verbos: cuidar, servir, transformar. Y con una convicción pastoral: lo que soy también puede servir."],"Prólogo del papa Francisco","ChV 168-174; Lc 10,37"]
],

add(2,[
["Doctrina, social, de la Iglesia","¿Qué significa cada palabra del nombre?","Un conjunto ordenado de enseñanzas sobre la vida social organizada, propio de toda la comunidad eclesial.",["«Doctrina» indica enseñanza organizada: principios de reflexión, criterios de juicio y directrices de acción. «Social» se refiere a las relaciones institucionalizadas (trabajo, Estado, mercado); la amistad o el noviazgo corresponden a la moral personal. «De la Iglesia» señala que su sujeto es toda la comunidad, bajo la guía de sus pastores y con los laicos como colaboradores activos.","Sirve recordar cinco elementos: su naturaleza es un cuerpo de principios; su origen, la reflexión a la luz de la Revelación y la Tradición; su objeto, lo social; su fin, pastoral; su sujeto, la Iglesia. No es una ideología ni el fundamento de un movimiento político."],"Cáritas, módulo 1","SRS 8, 41; CA 54"],
["Por qué interviene la Iglesia en lo social","¿Con qué derecho habla de estos temas?","Porque anunciar el Evangelio incluye sus consecuencias en la vida social.",["San Juan Pablo II afirma que enseñar la doctrina social pertenece a la misión evangelizadora. Hay cuatro razones de fondo: el vínculo entre evangelización y promoción humana; la necesidad de principios morales para la paz social; el peso que tienen las condiciones sociales sobre la vida espiritual y moral; y la larga experiencia de la Iglesia junto a las personas.","Pablo VI y san Juan Pablo II resumen esa experiencia con una expresión: la Iglesia es experta en humanidad."],"Cáritas, módulo 1","CA 5, 54; SRS 41; PP 13"],
["Una raíz que viene de la Biblia","¿La DSI la inventaron los papas modernos?","Su fuente es la Escritura, desde el Génesis hasta el Evangelio.",["En el Antiguo Testamento sobresalen cinco claves: la creación del ser humano; el pecado, que explica divisiones e injusticias; la liberación de Egipto; la Ley como base de la convivencia; y los profetas, que denuncian el atropello a los pobres.","En el Nuevo Testamento, Dios se revela como Padre de todos, Cristo reconcilia, y la liberación interior debe reflejarse en la sociedad. El mandamiento nuevo y las bienaventuranzas ordenan lo social; el ser va antes que el tener. Jesús asume la misión profética en la sinagoga de Nazaret."],"Cáritas, módulo 2","LE 3; Gn 1,27; Ex 3,7-8; Lc 4,18-21; Mt 5,1-12"],
["Lo que ya decían los Padres de la Iglesia","¿Había doctrina social en los primeros siglos?","Sí: los Padres ya veían la riqueza retenida como una herida contra el pobre.",["San Juan Crisóstomo enseñó que el rico es como un administrador de bienes que deben llegar a los necesitados; para él, no compartir es robar a los pobres. San Ambrosio, comentando la historia de Nabot, recordó que la tierra fue creada en común para todos. San Gregorio de Nisa describió en el siglo IV a miles de personas desamparadas a las puertas de los banquetes, con una actualidad que sorprende.","Estos textos prueban que el sentido social es parte esencial del cristianismo. Son una buena provocación para abrir un encuentro: lee uno y pregunta al grupo en qué época creen que se escribió."],"Cáritas, módulos 2, 4 y 6","San Juan Crisóstomo, Homilía 2 sobre Lázaro; San Ambrosio, De Nabuthe; San Gregorio de Nisa, Sobre el amor a los pobres"],
["Cómo leer un documento social","¿Qué diferencia hay entre encíclica, exhortación y carta?","No todos los documentos son iguales: conviene saber qué es cada uno y leerlo en su contexto.",["La encíclica es una carta solemne del papa; la exhortación apostólica anima a la Iglesia sobre un tema, muchas veces tras un Sínodo; la carta apostólica tiene un carácter más ocasional; y la carta pastoral es de un obispo o grupo de obispos a sus fieles. Pío XII usó además los radiomensajes durante la guerra.","Tu resumen da cinco reglas de lectura: ser fiel al texto oficial, comprenderlo como unidad, conocer su contexto histórico, relacionarlo con documentos anteriores y posteriores, y discernir a qué situaciones se aplica."],"Cáritas, módulo 2; Resumen DSI, unidad I","OA 42; CA 3"]
],[
["Según san Juan Pablo II, la Doctrina Social se apoya en:",["Solo la sociología","Principios de reflexión, criterios de juicio y directrices de acción","Programas de partido","Estadísticas económicas"],1,"SRS 8 describe así su contenido."],
["¿Cuál es la fuente originaria de la DSI según LE 3?",["La Revolución Industrial","La Sagrada Escritura","La Declaración de 1948","El Código Civil"],1,"Desde el Génesis y, en particular, el Evangelio."]
]);
add(3,[
["Acompañar sin humillar","¿Cómo se nota la dignidad en nuestro servicio?","Se acompaña a la persona desde sus capacidades, nunca desde sus carencias.",["Para Cáritas, la dignidad es el valor en que se apoya toda la acción social. Eso cambia el estilo: partir de lo que cada persona puede hacer, no centrarse solo en el problema o en la entrega material, y buscar acciones que abarquen a la persona completa.","Hay actitudes que contradicen el discurso aunque la intención sea buena: juzgar y moralizar, tratar con superficialidad, desconfiar de las capacidades del otro o resolverle la vida sin contar con él. Cada persona acompañada es templo de Cristo."],"Cáritas, módulo 3","Gn 1,26; GS 26; CDSI 153; 1 Co 3,16"]
]);
add(4,[
["Qué exige hoy el bien común","¿Qué cosas concretas hacen parte del bien común?","Paz, instituciones justas, ambiente sano y servicios esenciales; y es tarea de todos.",["Las exigencias cambian con cada época, pero incluyen la paz, la buena organización del Estado, un ordenamiento jurídico sólido y la protección del ambiente. Algunas coinciden con derechos humanos: alimentación, vivienda, trabajo, educación, transporte, salud, información libre y libertad religiosa.","Nadie queda exento de colaborar, según sus capacidades. El Estado tiene una responsabilidad especial, porque el bien común es la razón de ser de la autoridad política. Pregunta útil: ¿qué pasa cuando uno de estos bienes se vuelve simple mercancía?"],"Cáritas, módulo 4","CDSI 166-168; PT 64-65, 136"],
["Solidaridad y subsidiaridad se necesitan","¿Por qué siempre aparecen juntas?","La solidaridad enfrenta el individualismo; la subsidiaridad enfrenta el colectivismo.",["Entre la persona y el Estado existen grupos intermedios: familia, municipio, asociaciones, gremios. Cada uno aporta algo único. La solidaridad une a todos en la responsabilidad común; la subsidiaridad protege la autonomía de cada grupo para que no sea aplastado.","Ambas se aplican también entre naciones: Juan XXIII extendió estos principios al orden internacional, porque hay problemas que superan a cada gobierno, y ninguna autoridad mundial debería anular a los poderes locales."],"Cáritas, módulo 5","GS 30, 75; QA 79; SRS 38-40; PT 80, 140-141"],
["Enemigos de la participación","¿Qué impide que la gente participe de verdad?","El materialismo, la tecnocracia y las oligarquías económicas.",["La participación es exigencia de la dignidad y ejercicio concreto de la libertad. Pablo VI advierte sobre el materialismo, que impone modelos de conducta, y sobre la tentación de medirlo todo por eficacia, intereses y relaciones de fuerza.","La tecnocracia olvida que técnica y economía solo tienen sentido al servicio de las personas, que han de ser autoras de su progreso. La participación abarca la cultura, la economía, la política y la vida internacional. Es uno de los pilares de la democracia."],"Cáritas, módulo 6","OA 22, 24, 39, 41, 47; PP 34; GS 31; CDSI 190"],
["Trabajo, saber y límites de la propiedad","¿Puede el bien común limitar lo que es mío?","La propiedad no es un derecho incondicional; a veces el bien común exige la expropiación.",["Pablo VI afirma que la propiedad privada no constituye para nadie un derecho absoluto. El Concilio reconoce que el bien común puede exigir la expropiación, con las debidas garantías.","San Juan Pablo II enseña que el trabajo está en el origen de la propiedad individual, y que hoy importan tanto como la tierra el conocimiento, la técnica y el saber. Esa intuición prepara lo que Magnifica humanitas dirá sobre datos y algoritmos."],"Cáritas, módulo 6","PP 22-23; GS 69, 71; CA 30-32; MH 65-67"],
["Los valores como luz para decidir","¿Cómo me ayudan los valores en una decisión concreta?","Verdad, libertad, justicia y caridad permiten contrastar cada decisión.",["Las leyes de la vida social no garantizan automáticamente el bien de todos. San Juan XXIII afirma la prioridad de la ética sobre la técnica y de la persona sobre las cosas: el orden social se funda en la verdad, se practica en la justicia, se vivifica por el amor y respeta la libertad.","Estos valores chocan con la cultura dominante, sobre todo con el consumismo. Por eso hay que educarse en ellos y hacer discernimiento: elige uno y procura hacerlo realidad esta semana."],"Cáritas, módulo 7","MM 226-227, 246; PT 37; CA 36; SRS 43"]
],[
["La subsidiaridad se opone especialmente al:",["Individualismo","Colectivismo","Bien común","Voluntariado"],1,"Protege la autonomía de personas y grupos; la solidaridad se opone al individualismo."],
["Tres amenazas a la participación señaladas en la formación de Cáritas son:",["Materialismo, tecnocracia y oligarquías","Fe, razón y Estado","Familia, municipio y asociación","Verdad, justicia y amor"],0,"OA 39 y 41; PP 34."]

DUDAS.push(["¿La DSI empezó con León XIII?","Su formulación moderna, sí. Sus raíces están en la Escritura y en los Padres de la Iglesia, que ya hablaban con fuerza de los pobres y del uso de los bienes.","LE 3; Cáritas, módulo 2"],["¿Qué diferencia hay entre Pastoral Social y una ONG?","La Pastoral Social actúa desde el encuentro con Cristo y como parte de la misión de la Iglesia. Puede usar buenas técnicas, y su razón de fondo es el amor de Dios a cada persona.","DCE 31; Cáritas, módulo 3"]);

["Dignidad de la persona","Partimos de las capacidades de cada persona y contamos con ella.",["¿Tratamos a quien acompañamos como imagen de Dios, también al hablar de él cuando no está?","¿En qué momentos le hemos resuelto la vida sin preguntarle?","¿Qué rasgo de Dios descubro en una persona concreta que atendemos?"]],
["Bien común","Miramos a toda la comunidad, y no solo a nuestro grupo.",["¿Qué aporto yo al bien común de mi municipio?","¿Qué señales mostrarían que nuestro equipo lo practica?","¿Qué bien común de nuestro territorio se está volviendo mercancía?"]],
["Solidaridad y subsidiaridad","Nos implicamos sin reemplazar a nadie.",["¿Damos espacio real para que otros asuman tareas?","¿Dependemos de una sola persona que lo hace todo?","¿Con qué otros grupos del municipio deberíamos unirnos?"]],
["Participación y destino de los bienes","Quienes viven el problema tienen voz en la solución.",["¿Quién decide en nuestros proyectos? ¿Están ahí los jóvenes y los más afectados?","¿Se anuncia en nuestra parroquia que los bienes son para todos?","¿Cómo usamos los recursos que recibimos?"]],

const D=(c,q,a,r,k='')=>DUDAS.push([q,a,r,c,k]);
D("Lo básico","¿Qué es, en una frase, la Doctrina Social?","Es la enseñanza de la Iglesia sobre cómo organizar la vida en sociedad a la luz del Evangelio y de la razón.","DOCAT 22–24; SRS 41","definicion resumen significa");
D("Lo básico","¿Para qué me sirve conocerla?","Te da criterios para leer la realidad, decidir y actuar: en tu trabajo, tu voto, tu consumo y tu servicio en la comunidad.","DOCAT 23; MM 226-227","utilidad importancia estudiar");
D("Lo básico","¿Solo es para católicos?","Se dirige también a toda persona de buena voluntad, porque sus argumentos pueden ser comprendidos por la razón.","DOCAT 35; PT","no creyentes ateos otras religiones");
D("Lo básico","¿Cambia con el tiempo?","Sus principios permanecen; su aplicación se desarrolla a medida que aparecen problemas nuevos, como la inteligencia artificial o la crisis ecológica.","DOCAT 34, 36; MH 17-27","actualiza evoluciona modas");
D("Lo básico","¿Cuál es el documento más importante para empezar?","Para una visión ordenada, el Compendio de la Doctrina Social de la Iglesia. Para jóvenes, el DOCAT. Para hoy, lee también Fratelli tutti, Laudato si’ y Magnifica humanitas.","CDSI; DOCAT; FT; LS; MH","leer libro empezar encíclica recomendado");
D("Lo básico","¿Qué significa Ver, Juzgar, Actuar?","Es el método para mirar la realidad, iluminarla con el Evangelio y traducirla en acción. Tu Línea añade Revisar y Celebrar.","MM 236; Más → Método pastoral","metodo pasos revisar celebrar");
D("Lo básico","¿La Iglesia siempre se ocupó de los pobres?","Sí, desde la Biblia y los Padres de la Iglesia. Lo que comenzó en 1891 fue su forma sistemática de enseñanza social.","LE 3; RN; DT","historia origen");

D("Iglesia y política","¿Puede un sacerdote hacer campaña política?","La política de partido corresponde a los laicos. A los clérigos no les compete tomar parte activa en partidos, salvo excepciones que determina la autoridad de la Iglesia. Sí pueden y deben enseñar los principios morales.","GS 76; CIC can. 287 §2","cura padre obispo candidato");
D("Iglesia y política","¿Un católico debe votar por un partido específico?","No existe un partido obligatorio para el católico. Debes formar la conciencia y examinar propuestas a la luz de la dignidad, la vida, la justicia y el bien común.","DOCAT 319; GS 75-76","voto candidato elecciones");
D("Iglesia y política","¿Qué tipo de gobierno defiende la Iglesia?","Aprecia la democracia en cuanto asegura la participación y el control del poder, siempre con un fundamento ético. No idealiza ningún sistema.","DOCAT 32, 221; CA 46","democracia sistema dictadura");
D("Iglesia y política","¿Qué dice sobre la corrupción?","Es una grave injusticia que roba a la comunidad, sobre todo a los pobres, y destruye la confianza. La autoridad existe para servir.","DOCAT 190, 210; CDSI 411","corrupto robar funcionario");
D("Iglesia y política","¿Puedo participar en protestas?","Sí, de forma pacífica, cuando se oprime la justicia, y también por causas que no sean las propias. La violencia no es el camino.","DOCAT 322; CA 23","marcha paro manifestacion huelga");
D("Iglesia y política","¿Debe el Estado ayudar a los pobres?","Sí: debe proteger a los más débiles y crear condiciones justas, respetando la iniciativa de personas y comunidades.","DOCAT 182; RN; CA 48","subsidios gobierno asistencialismo");
D("Iglesia y política","¿Estado laico significa que la fe no puede opinar?","No. La laicidad distingue competencias; los creyentes tienen derecho a participar en la vida pública desde sus convicciones.","DOCAT 214, 224–225; DH 2","religion publico laicismo");
D("Iglesia y política","¿Qué es la caridad política?","Es amar al prójimo también mediante leyes, instituciones y compromiso público, buscando el bien de muchos.","FT 176-186; DCE 28","amor politica");

D("Economía y pobreza","¿La Iglesia está en contra del capitalismo?","Valora la empresa, el mercado y la creatividad, y rechaza una libertad económica sin marco jurídico y ético al servicio de la persona.","DOCAT 171; CA 42; EG 53","mercado liberalismo neoliberal");
D("Economía y pobreza","¿La propiedad privada es buena o mala?","Es buena porque protege la libertad y la responsabilidad, pero no es absoluta: está subordinada al destino universal de los bienes.","DOCAT 90–91; PP 23; FT 120","tierra expropiar dueño");
D("Economía y pobreza","¿Puedo ganar dinero con un negocio?","Sí. La empresa honesta es una verdadera vocación si respeta a las personas, paga lo justo y sirve al bien común.","DOCAT 163, 174","empresa emprender ganancia lucro empresario");
D("Economía y pobreza","¿Cobrar intereses es pecado?","El crédito y los bancos pueden prestar un servicio. La usura, que aprovecha la necesidad con intereses abusivos, es gravemente injusta.","DOCAT 191; CCC 2269, 2449","usura prestamo gota a gota banco interes");
D("Economía y pobreza","¿Qué es el destino universal de los bienes?","Los bienes de la tierra fueron creados para toda la humanidad; cada persona debe poder acceder a lo necesario para vivir con dignidad.","DOCAT 89; GS 69","bienes tierra para todos");
D("Economía y pobreza","¿Por qué la Iglesia habla de opción por los pobres?","Porque Dios se inclina hacia quien está caído. No excluye a los ricos: invita a mirar la sociedad desde quienes van últimos.","DOCAT 238; SRS 42; DT","preferencia preferidos");
D("Economía y pobreza","¿Cómo puedo ayudar sin crear dependencia?","Escucha a la persona, parte de sus capacidades, decide con ella y acompaña un proceso. Da lo urgente sin quedarte solo en eso.","DOCAT 98; Cáritas, módulo 3","asistencialismo mercado ayudas regalar");
D("Economía y pobreza","¿Consumir mucho es pecado?","Tener lo necesario no es malo. El consumismo daña cuando pone las cosas por encima de las personas y olvida a los demás.","CA 36; LS 203-208","compras comprar lujo");
D("Economía y pobreza","¿Qué es la economía solidaria?","Formas de producir y repartir que priorizan a las personas y la cooperación, como cooperativas y fondos comunitarios. Encaja con la lógica del don.","DOCAT 183; CiV 36-38","cooperativa fondo");

D("Trabajo","¿Por qué se dice que el trabajo da dignidad?","Porque la persona se realiza y sirve a otros al trabajar. Su valor viene de quien lo realiza, no del tipo de oficio.","DOCAT 134, 143; LE 6","oficio dignidad empleo");
D("Trabajo","¿Qué es un salario justo?","El que permite una vida digna al trabajador y a su familia, y participar en la sociedad. No lo define solo el mercado.","DOCAT 155; LE 19","sueldo pago paga mínimo");
D("Trabajo","¿Qué dice sobre el trabajo informal?","Reclama protección y dignidad para quien vive del rebusque. Muchos trabajan sin derechos, y la sociedad entera debe buscar salidas.","DOCAT 148; EG 192; LE 18","rebusque informalidad vendedor ambulante precario");
D("Trabajo","¿Puedo formar parte de un sindicato?","Sí. Asociarse es un derecho. El sindicato defiende intereses justos y debe mantenerse libre de la instrumentalización partidista.","DOCAT 156; LE 20","sindicalista gremio");
D("Trabajo","¿Es obligatorio descansar el domingo?","El descanso dominical recuerda que no somos máquinas y orienta la vida hacia Dios, la familia y los demás, salvo necesidades justificadas.","DOCAT 139; Ex 20,8-11; CCC 2184-2188","domingo descanso festivo");
D("Trabajo","¿Trabajar demasiado también es un problema?","Sí. El trabajo hace parte de la vida, pero no lo es todo: no debe devorar la familia, la salud ni la vida espiritual.","DOCAT 138, 149","estres agotamiento horas");
D("Trabajo","¿La inteligencia artificial me quitará el trabajo?","La Iglesia pide evaluar la automatización por la dignidad del trabajador y atender a quienes queden excluidos, más allá de la eficiencia.","MH 37, 67","ia automatizacion robots desempleo");

D("Persona y vida","¿Qué significa la dignidad humana?","Cada persona vale por ser imagen de Dios. Esa dignidad no se gana ni se pierde, aunque alguien sea pobre, enfermo o haya cometido un delito.","DOCAT 47, 54; DI","valor persona imagen");
D("Persona y vida","¿Qué dice la Iglesia sobre el aborto?","Defiende la vida desde la concepción y, por eso, lo rechaza. También pide acompañar con misericordia y ayuda real a la mujer, sin condenarla.","DOCAT 74–75; EV 58-62; CCC 2270-2274","embarazo interrupcion");
D("Persona y vida","¿Qué dice sobre la eutanasia?","Rechaza causar la muerte. Pide cuidados paliativos y compañía, y acepta renunciar a tratamientos desproporcionados.","DOCAT 77–83; CCC 2276-2279; Samaritanus bonus","muerte digna enfermo terminal paliativos encarnizamiento");
D("Persona y vida","¿Todos los derechos humanos son iguales?","Todos se basan en la dignidad y deben respetarse en conjunto. La vida es el primero, porque hace posibles los demás.","DOCAT 63–65; MH 54-58","derecho vida");
D("Persona y vida","¿Qué dice la Iglesia de las personas con discapacidad?","Son sujetos con plena dignidad, y la justicia exige que puedan participar en toda la vida social y eclesial.","DOCAT 60","discapacitado inclusion accesibilidad");
D("Persona y vida","¿Cómo debe tratarse a las personas homosexuales?","La Iglesia enseña que toda persona debe ser acogida con respeto y sin discriminación injusta, mientras mantiene su enseñanza sobre el matrimonio y la sexualidad.","CCC 2358; DI; DOCAT 58","gay lgbt orientacion discriminacion");
D("Persona y vida","¿Hombres y mujeres tienen la misma dignidad?","Sí. La Iglesia afirma la igual dignidad y rechaza la discriminación y la violencia contra las mujeres.","DOCAT 58–59; GS 29; DI","mujer machismo igualdad genero");
D("Persona y vida","¿Qué dice sobre los presos?","Siguen siendo personas. Las penas deben respetar su dignidad y buscar la reinserción. La pena de muerte es inadmisible.","DOCAT 228; CCC 2267; Mt 25,36","carcel delincuente condena pena de muerte");

D("Familia","¿Por qué la Iglesia da tanta importancia a la familia?","Es la primera escuela de humanidad, donde aprendemos a ser amados y a convivir. Por eso es célula vital de la sociedad.","DOCAT 114–119; FC 42","hogar celula");
D("Familia","Mi familia no es ideal. ¿Esto no me aplica?","Claro que te aplica. La Iglesia invita a acompañar cada situación con cercanía; la comunidad también puede acoger y sanar.","AL 291-312; DOCAT 116","separados divorcio herida padres madre soltera");
D("Familia","¿Qué debe hacer el Estado por las familias?","Apoyarlas con empleo digno, vivienda, salud y educación, sin reemplazar su responsabilidad.","DOCAT 131–133; CDSI 252-254","politica familiar subsidio");
D("Familia","¿Qué lugar tienen los abuelos?","Son memoria y sabiduría, y merecen cuidado y compañía, nunca descarte.","DOCAT 121; FT 19","ancianos adulto mayor vejez");
D("Familia","¿Por qué se debe proteger especialmente a los niños?","Porque son los más vulnerables. Cualquier explotación o abuso contra ellos es gravemente injusta y debe denunciarse.","DOCAT 122; CDSI 245","niñez infancia menores abuso");

D("Paz y violencia","¿La paz es solo que no haya guerra?","No. Es fruto de la justicia y del amor, y requiere desarrollo, reconciliación e instituciones justas.","DOCAT 275; GS 78; PP 76","conflicto armado");
D("Paz y violencia","¿Perdonar significa olvidar?","No. El perdón rompe la cadena del odio sin negar la verdad, la memoria ni la justicia que merecen las víctimas.","DOCAT 277; FT 246-252","victimas reconciliacion memoria");

["Qué guarda esta herramienta","Tus notas, los temas que marcas como leídos, los materiales que chuleas en las sesiones, tus guardados y el avance del repaso. Todo eso se queda únicamente en el dispositivo donde lo escribes: no viaja a ningún servidor y nadie más puede verlo, ni siquiera quienes hicimos la herramienta."],
["Qué no te pide","No pide nombre, correo, teléfono, documento ni ubicación. No hay registro ni contraseña. No usa cookies de publicidad ni comparte nada con terceros."],
["Ten en cuenta","Si borras los datos del navegador, desinstalas la app o cambias de equipo, tus notas se pierden, porque solo viven ahí. Guarda aparte lo que sea importante para ti."],
["Sobre los menores de edad","Esta herramienta no recoge datos de ninguna persona, por lo que puede usarse libremente en grupos juveniles. Si en algún momento se habilita un formulario o un espacio para escribir, se pedirán los permisos que exige la ley colombiana de protección de datos (Ley 1581 de 2012) y la política de la Diócesis."],
["Quién responde por esto","Pastoral Social · Cáritas Diocesana de Caldas (Antioquia). Para dudas o sugerencias, acércate a la Pastoral Social diocesana."]

const SANTOS=[
[1,17,"San Antonio Abad","Padre de los monjes","Dejó todo a los veinte años al escuchar el Evangelio del joven rico y se retiró al desierto de Egipto. Enseñó que la soledad con Dios no aparta del hermano: de su celda salían consejo y pan para los pobres.","llama","#8a5a2b"],
[1,24,"San Francisco de Sales","Patrono de los periodistas","Obispo de Ginebra, convenció más con la dulzura que con la disputa. Decía que se atrapan más moscas con una gota de miel que con un barril de vinagre; su método sirve para cualquier joven que quiera hablar de fe sin pelear.","pluma","#2f6f8f"],
[1,28,"Santo Tomás de Aquino","Doctor de la Iglesia","Pensó la fe con una razón rigurosa y escribió sobre la justicia, la ley y el bien común páginas que todavía sostienen la Doctrina Social. También enseñó que la amistad civil es necesaria para que una sociedad no se sostenga solo de normas.","libro","#6b4f9e"],
[1,31,"San Juan Bosco","Padre y maestro de los jóvenes","Recogió en Turín a muchachos huérfanos y obreros a quienes nadie educaba, y les dio oficio, escuela y casa. Su sistema preventivo se resume en razón, religión y cariño: prevenir antes que castigar.","estrella","#2a6f55"],
[2,8,"Santa Josefina Bakhita","Patrona de las víctimas de la trata","Secuestrada de niña en Sudán y vendida varias veces como esclava, llegó a Italia, recibió el bautismo y fue religiosa canosiana. Perdonó a sus secuestradores y se convirtió en rostro de la lucha contra la trata de personas.","cadena","#4a4a7a"],
[2,11,"Nuestra Señora de Lourdes","Jornada Mundial del Enfermo","La Iglesia celebra hoy a los enfermos y a quienes los cuidan. Es día para recordar que el cuidado no termina cuando ya no se puede curar, y para agradecer a quienes acompañan el dolor ajeno.","agua","#3a6ea8"],
[3,8,"San Juan de Dios","Patrono de los enfermos y del personal de salud","Fundó en Granada un hospital donde atendía a quienes nadie recibía, cargándolos él mismo por las calles. Murió al enfermarse por rescatar a un joven de un río. Patrono de enfermeras, enfermeros y hospitales.","corazon","#b0442f"],
[3,19,"San José","Esposo de María, patrono de los trabajadores","Carpintero de Nazaret, custodió a Jesús y a María sin pronunciar una palabra registrada en el Evangelio. Su figura enseña que el trabajo callado y la paternidad responsable también son forma de santidad.","herramienta","#7a5a35"],
[3,23,"Santo Toribio de Mogrovejo","Arzobispo de Lima","Recorrió a pie y a caballo su inmensa diócesis andina, aprendió quechua y defendió a los indígenas frente a los encomenderos. Convocó concilios que marcaron la evangelización de América Latina.","baculo","#2a6f8f"],
[3,24,"San Óscar Romero","Mártir, obispo de los pobres","Arzobispo de San Salvador, denunció la represión y defendió a campesinos y desaparecidos. Fue asesinado mientras celebraba la Misa, el 24 de marzo de 1980. Decía que la Iglesia debe encarnarse en los pobres, no mirarlos desde lejos.","caliz","#8c2f2f"],
[4,29,"Santa Catalina de Siena","Doctora de la Iglesia","Joven laica, sirvió a enfermos de peste y escribió cartas valientes a papas y gobernantes pidiendo conversión y paz. Mostró que se puede amar a la Iglesia y a la vez corregirla con franqueza.","fuego","#9e3b6b"],
[5,1,"San José Obrero","Fiesta del trabajo","Instituida para que el primero de mayo tuviera también rostro cristiano. Recuerda que el trabajo no es castigo ni mercancía, sino participación en la obra creadora de Dios y camino de dignidad.","herramienta","#4a6b2f"],
[5,26,"San Felipe Neri","El santo de la alegría","Reunía en Roma a jóvenes de la calle con música, juegos y oración, y los llevaba a servir en los hospitales. Repetía que se puede ser santo sin andar con cara triste.","nota","#c07a28"],
[6,13,"San Antonio de Padua","Doctor evangélico","Predicador franciscano de enorme claridad, defendió a los endeudados y logró leyes que impedían encarcelar al deudor insolvente. Su caridad con los pobres le ganó el nombre popular de arca del testamento.","pan","#7a5a2b"],
[6,21,"San Luis Gonzaga","Patrono de la juventud","Renunció a su herencia de príncipe para entrar en la Compañía de Jesús. Murió a los veintitrés años contagiado mientras cuidaba enfermos de peste en Roma.","lirio","#4a6fae"],
[6,29,"San Pedro y San Pablo","Columnas de la Iglesia","El pescador que negó y el perseguidor que cayó del caballo. Juntos muestran que la Iglesia no se funda sobre personas perfectas, sino sobre personas perdonadas y enviadas.","llave","#8c6a2f"],
[7,4,"San Pier Giorgio Frassati","Joven de las bienaventuranzas","Montañista, universitario y militante social en Turín, repartía a escondidas su dinero entre los pobres. Murió a los veinticuatro años y a su entierro acudió media ciudad de gente humilde que él socorría. Canonizado en 2025.","montana","#2f6f5a"],
[7,11,"San Benito","Patrono de Europa","Su regla, ora et labora, ordenó la vida de los monasterios que sostuvieron la cultura y la caridad de Europa durante siglos. Enseñó que la oración y el trabajo se necesitan mutuamente.","libro","#3a3a5a"],
[7,16,"Nuestra Señora del Carmen","Patrona de los conductores en Colombia","Muy querida en nuestros pueblos y caminos. Su fiesta es ocasión para rezar por quienes se ganan la vida en la carretera y por la seguridad vial de nuestras veredas.","estrella","#6a4a9e"],
[7,22,"Santa María Magdalena","Apóstol de los apóstoles","Primera testigo de la resurrección y primera enviada a anunciarla. Su historia desmiente que el pasado de alguien determine lo que Dios puede hacer con su vida.","aurora","#a8406a"],
[7,25,"Santiago Apóstol","Patrono de los peregrinos","Uno de los primeros llamados y el primer apóstol mártir. Su camino sigue congregando a millones de caminantes que buscan sentido.","concha","#9e7a2f"],
[8,4,"San Juan María Vianney","Patrono de los párrocos","Cura de Ars, pasaba jornadas enteras confesando y fundó una casa para niñas abandonadas. Sostenía que la misericordia de Dios no tiene los límites que nosotros le ponemos.","confesion","#4a5a7a"],
[8,11,"Santa Clara de Asís","Primera seguidora de Francisco","Dejó su casa noble para vivir en pobreza radical en San Damián. Obtuvo de la Iglesia el privilegio de no poseer nada, en una época en que eso era impensable para un monasterio.","custodia","#8a7a3a"],
[8,14,"San Maximiliano Kolbe","Mártir de la caridad","Franciscano polaco, en Auschwitz se ofreció a morir en lugar de un padre de familia condenado al búnker del hambre. Aquel hombre sobrevivió a la guerra y asistió a su canonización.","cadena","#55557a"],
[8,15,"Asunción de la Virgen María","Solemnidad","María es llevada en cuerpo y alma a la gloria. Su Magníficat anuncia a un Dios que derriba a los poderosos y exalta a los humildes: el canto más social del Evangelio.","aurora","#3a6fa8"],
[8,18,"San Alberto Hurtado","Apóstol social de Chile","Jesuita, fundó el Hogar de Cristo para los sin techo y promovió sindicatos cristianos. Escribió sobre la justicia social y preguntaba insistentemente qué haría Cristo en su lugar.","casa","#2f6f6f"],
[8,23,"Santa Rosa de Lima","Patrona de América Latina","Primera santa del continente. Atendía en su propia casa a indígenas y enfermos abandonados, en un Perú colonial que los despreciaba.","rosa","#b04a6a"],
[8,28,"San Agustín","Doctor de la Iglesia","Tras una juventud inquieta, se convirtió y llegó a ser obispo de Hipona. En La ciudad de Dios pensó la relación entre la fe y la sociedad; enseñó que el corazón está inquieto hasta descansar en Dios.","corazon","#7a3a6a"],
[9,3,"San Gregorio Magno","Papa y doctor","Organizó la ayuda a los hambrientos de Roma con los bienes de la Iglesia y se llamó a sí mismo siervo de los siervos de Dios, título que los papas conservan.","pan","#6a6a2f"],
[9,5,"Santa Teresa de Calcuta","Madre de los más pobres","Dejó su colegio para vivir entre los moribundos de Calcuta y fundó las Misioneras de la Caridad. Insistía en que el amor comienza en casa y se mide en lo pequeño hecho con gran amor.","manos","#2f6f8f"],
[9,9,"San Pedro Claver","Esclavo de los esclavos para siempre","Jesuita catalán, sirvió cuarenta años en Cartagena de Indias a los africanos esclavizados que llegaban en los barcos negreros. Bajaba a las bodegas con agua, medicinas y consuelo, y bautizó a miles.","cadena","#7a3a3a"],
[9,13,"San Juan Crisóstomo","Doctor de la Iglesia","Obispo de Constantinopla, llamado boca de oro por su predicación. Enseñó sin rodeos que no dar a los pobres de los bienes propios es robarles; fue desterrado por denunciar los lujos de la corte.","boca","#8a6a2f"],
[9,27,"San Vicente de Paúl","Patrono de las obras de caridad","Organizó la caridad en Francia: fundó las Hijas de la Caridad y las Conferencias, y atendió galeotes, huérfanos y hambrientos. Decía que hay que amar a los pobres de tal modo que ellos perdonen el pan que se les da.","pan","#2a5a7a"],
[10,1,"Santa Teresa del Niño Jesús","Doctora de la Iglesia","Carmelita muerta a los veinticuatro años, propuso el caminito: hacer lo ordinario con amor extraordinario. Patrona de las misiones sin haber salido nunca de su convento.","rosa","#a8506a"],
[10,4,"San Francisco de Asís","Patrono de la ecología","Hijo de un comerciante rico, renunció a todo y abrazó la pobreza y a los leprosos. Su Cántico de las criaturas inspira Laudato si’; llamaba hermanos al sol, al agua y a la muerte.","aves","#3a7a4a"],
[10,7,"Nuestra Señora del Rosario","Memoria","El rosario es la oración sencilla del pueblo, que recorre con María la vida de Jesús. Se reza en caminos, velorios y casas: teología hecha costumbre.","rosario","#3a4a8a"],
[10,12,"San Carlo Acutis","Joven de la Eucaristía","Adolescente italiano muerto en 2006, puso su talento informático al servicio de la fe y documentó milagros eucarísticos en un sitio web. Ayudaba a mendigos de su barrio. Canonizado en 2025.","pantalla","#2f5a9e"],
[10,15,"Santa Teresa de Ávila","Doctora de la Iglesia","Reformó el Carmelo recorriendo España en condiciones durísimas. Combinó una honda vida de oración con un realismo práctico notable: también entre los pucheros anda Dios.","castillo","#8a4a2f"],
[10,21,"Santa Laura Montoya","Primera santa colombiana","Maestra de Jericó, Antioquia. Se internó en la selva de Dabeiba para vivir entre los embera, no para sacarlos de allí. Fundó a las lauritas y fue canonizada en 2013.","montana","#3d6b4a"],
[10,22,"San Juan Pablo II","Papa de la Doctrina Social","Trabajó en una cantera bajo la ocupación nazi y llegó a ser papa. Escribió tres grandes encíclicas sociales y visitó Colombia en 1986.","baculo","#5a6b8a"],
[11,1,"Todos los Santos","Solemnidad","La Iglesia celebra la multitud incontable de los que llegaron a la meta, la mayoría sin nombre en ningún calendario: abuelas, catequistas, vecinos. La santidad es vocación de todos, no privilegio de pocos.","corona","#8a7a2f"],
[11,3,"San Martín de Porres","Hermano de los pobres y los animales","Mulato limeño, enfermero dominico, atendía a esclavos, mendigos y enfermos sin distinción. Sufrió desprecio por su origen y respondió con una humildad desarmante.","escoba","#5a4a3a"],
[11,4,"San Carlos Borromeo","Obispo reformador","Arzobispo de Milán, vendió bienes para socorrer a los apestados y permaneció en la ciudad cuando otros huyeron. Impulsó los seminarios tras el Concilio de Trento.","baculo","#6a2f4a"],
[11,11,"San Martín de Tours","El de la capa partida","Siendo soldado, partió su capa con la espada para cubrir a un mendigo que temblaba de frío; esa noche soñó que era Cristo quien la llevaba. Después fue obispo y defensor de los perseguidos.","capa","#4a5a8a"],
[11,13,"Santa Francisca Javier Cabrini","Patrona de los migrantes","Fundó escuelas, hospitales y orfanatos para los emigrantes italianos en América. Cruzó el océano decenas de veces a pesar de su salud frágil.","barco","#2f6f7a"],
[11,17,"Santa Isabel de Hungría","Patrona de las obras de caridad","Princesa que convirtió el pan de palacio en pan de los hambrientos y fundó un hospital donde ella misma servía. Quedó viuda a los veinte años y murió a los veinticuatro.","rosa","#9e4a5a"],
[12,3,"San Francisco Javier","Patrono de las misiones","Recorrió India, Indonesia y Japón bautizando y defendiendo a los más humildes de los abusos coloniales. Murió a las puertas de China, solo, en una isla.","barco","#2f5a8a"],
[12,7,"San Ambrosio","Doctor de la Iglesia","Obispo de Milán, fundió los vasos sagrados para rescatar cautivos y enseñó que la tierra fue creada en común para todos, ricos y pobres. Se enfrentó al emperador para defender la justicia.","copa","#7a6a2f"],
[12,8,"Inmaculada Concepción","Solemnidad","María preservada del pecado desde su origen. En Colombia, la víspera se encienden velas y faroles en calles y ventanas: una de las noches más entrañables de nuestros pueblos.","vela","#3a6fa8"],
[12,9,"San Juan Diego","El indígena del Tepeyac","A través de un hombre humilde y despreciado, Dios habló a todo un continente. Su historia es memoria de que los últimos pueden ser portadores del mensaje.","tilma","#8a5a2f"],
[12,12,"Nuestra Señora de Guadalupe","Patrona de América Latina","Se presentó como madre mestiza y habló en la lengua del pueblo. Su imagen acompaña las luchas y las esperanzas del continente.","aurora","#2f7a5a"],
[12,14,"San Juan de la Cruz","Doctor místico","Poeta y reformador, escribió desde la cárcel algunos de los versos más hondos de la lengua castellana. Enseñó que en el atardecer de la vida seremos examinados en el amor.","noche","#3a3a6a"],
[12,26,"San Esteban","Primer mártir","Diácono encargado del servicio a las viudas, murió apedreado perdonando a quienes lo mataban. El primero en dar la vida por el Evangelio era un servidor de mesas.","piedra","#6a4a4a"]

["Las estructuras también se convierten","El pecado se acumula en costumbres, contratos y leyes. Cambiar el corazón es indispensable y no es suficiente: hay reglas que hieren aunque nadie quiera hacer daño. Mirarlas también es tarea evangélica."],
["La paciencia del sembrador","Casi nada de lo importante se ve en un semestre. El Reino crece de noche, cuando el sembrador duerme. Mide tu trabajo en años y en personas, no en fotos y asistencias."],
["Cuidar a quien cuida","Los agentes de pastoral se desgastan en silencio. Si en tu equipo nadie pregunta cómo estás, el equipo está incompleto. Cuidar, servir y transformar empieza por los de adentro."],
["El conflicto no es el enemigo","Un grupo sin desacuerdos suele ser un grupo donde alguien calla. El conflicto bien llevado purifica; el que se esconde se pudre. Hablen de frente y busquen lo que los une."],

["Ver a Cristo en el rostro concreto","Es fácil amar a la humanidad y difícil amar al vecino ruidoso. El Evangelio nunca habla de amar en general: habla de este herido, en este camino, hoy."],

["El perdón no borra la verdad","Perdonar no es decir que no pasó nada ni callar a las víctimas. Es romper la cadena del odio sin renunciar a la justicia ni a la memoria. Por eso es tan difícil y tan necesario aquí."],
["Discípulos antes que funcionarios","Lo que traemos no es un programa, ni un subsidio, ni una metodología. Es a Jesucristo. Todo lo demás sirve en la medida en que conduzca a Él."]

["Oración por quienes sirven","Padre bueno, cuida a los que cuidan. A los catequistas cansados, a los voluntarios que nadie aplaude, a las madres que sostienen casas enteras, a los agentes de pastoral que ya no saben dónde descansar. Dales fuerza, alegría y hermanos a su lado. Amén.","Por el equipo"],
["Acción de gracias al terminar","Gracias, Señor, por lo caminado. Por lo que salió bien y por lo que nos enseñó al fallar. Gracias por cada persona que conocimos y por lo que ellas nos dieron sin saberlo. Recibe este trabajo pequeño y hazlo fecundo más allá de lo que veamos. Amén.","Para el momento del Celebrar"],

const COPID={
que:"COPPAS quiere decir Comité Parroquial de Pastoral Social. Es el grupo de la parroquia que se encarga de que la caridad no dependa de la buena voluntad de unos pocos, sino que tenga ojos, método y continuidad: mirar lo que pasa en el barrio o la vereda, leerlo con el Evangelio y responder con algo que la comunidad pueda sostener.",
por:"La diferencia entre un COPPAS y un grupo de ayudas es sencilla: el grupo de ayudas pregunta «¿qué damos?»; el COPPAS pregunta primero «¿qué está pasando aquí y por qué?». Por eso en esta ruta la acción llega en el paso cinco y no en el primero. No es demora: es respeto. El problema del otro deja de ser «su problema» cuando antes lo hemos mirado juntos.",
es:["Un grupo estable de la parroquia, no una comisión que se arma para una actividad.","Un lugar donde se decide con la comunidad, no sobre la comunidad.","Una escuela: se aprende sirviendo y se sirve aprendiendo."],
noes:["No es la bodega de la parroquia ni el grupo que empaca mercados.","No es un grupo que resuelve solo: articula con quien sí tiene la competencia.","No es un comité de emergencias. Atiende urgencias, pero no vive de ellas."],
como:"Esta sección es la ruta completa, paso a paso. Cada paso está pensado para una reunión del comité: entre hora y media y dos horas. Se puede hacer uno por semana o uno cada quince días. Al final de cada paso queda algo escrito en una ficha, y esas cinco fichas son el plan del COPPAS. No hay que tener la cartilla en papel: todo está aquí y lo que escriban se guarda en el teléfono.",
nota:"Esta sección se apoya en la cartilla «Servir juntos» y en el Manual de Formación COPPAS de la Pastoral Social, Cáritas Diocesana de Caldas."
